<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Feedback — LiteracyLab AI</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1F1EF; --surface:#FFFFFF; --border:#D3D3CF; --ink:#212121; --ink-soft:#5A5A56;
    --wine:#7A3B45; --wine-ink:#552830; --wine-tint:#EBDEE0; --good:#2E6B4E; --good-tint:#E3F0E9; --bad:#A63A3A;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#161513; --surface:#1E1B18; --border:#37322B; --ink:#EDE9E2; --ink-soft:#B3AB9C;
      --wine:#C4776E; --wine-ink:#E3A79F; --wine-tint:#362320; --good:#7FD6A4; --good-tint:#17301F; --bad:#E58B84; }
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:"Lexend", "Segoe UI", Helvetica, Arial, sans-serif; line-height:1.6; }
  .top{ border-top:4px solid var(--wine); }
  .wrap{ max-width:560px; margin:0 auto; padding:20px 16px 56px; }
  .brand{ display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--ink); padding:8px 0 20px; }
  .brand img{ width:44px; height:44px; border-radius:10px; }
  .brand span{ font-weight:700; font-size:22px; letter-spacing:-.2px; }
  .brand b{ color:var(--wine-ink); }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:28px; }
  h1{ font-size:24px; line-height:1.25; margin:0 0 8px; }
  p{ margin:0 0 16px; color:var(--ink-soft); }
  label{ display:block; font-weight:600; font-size:14px; margin:18px 0 6px; }
  select, textarea{ width:100%; font:inherit; font-size:16px; padding:10px 12px; border:1px solid var(--border); border-radius:10px; background:var(--surface); color:var(--ink); }
  textarea{ min-height:130px; resize:vertical; }
  select:focus-visible, textarea:focus-visible, button:focus-visible, input:focus-visible{ outline:2px solid var(--wine); outline-offset:2px; }
  .check{ display:flex; gap:10px; align-items:flex-start; font-weight:400; font-size:14px; color:var(--ink-soft); margin-top:16px; }
  .check input{ width:18px; height:18px; margin-top:3px; accent-color:var(--wine); }
  .rate{ display:flex; gap:8px; }
  .rate button{ flex:1; font:inherit; font-weight:600; padding:10px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--ink); cursor:pointer; }
  .rate button[aria-pressed="true"]{ background:var(--wine-tint); border-color:var(--wine); color:var(--wine-ink); }
  .go{ margin-top:22px; font:inherit; font-weight:600; font-size:16px; padding:13px 26px; border:0; border-radius:999px; background:var(--wine); color:#fff; cursor:pointer; }
  .go[disabled]{ opacity:.6; cursor:default; }
  .msg{ margin-top:14px; font-size:14px; }
  .msg.err{ color:var(--bad); }
  .thanks{ background:var(--good-tint); color:var(--good); border-radius:10px; padding:12px 14px; margin-bottom:18px; font-weight:500; }
  .count{ text-align:right; font-size:12px; color:var(--ink-soft); }
  footer{ margin-top:18px; font-size:12px; color:var(--ink-soft); }
  footer a{ color:var(--ink-soft); }
</style>
<script src="analytics.js"></script>
<link rel="stylesheet" href="/theme.css?v=7">
</head>
<body class="top">
<div class="wrap">
  <a class="brand" href="index.html"><img src="apple-touch-icon.png" alt="" width="44" height="44"><span>LiteracyLab <b>AI</b></span></a>

  <div class="card" id="card">
    <div id="ratingThanks" class="thanks" hidden>Thanks, that's been noted.</div>
    <h1 id="title">Tell us what you think</h1>
    <p id="lede">Every message is read. If something was confusing, missing or broken, this is where we find out.</p>

    <form id="form" novalidate>
      <label id="rateLabel">Was that email useful?</label>
      <div class="rate" role="group" aria-labelledby="rateLabel">
        <button type="button" data-r="up" aria-pressed="false">Yes</button>
        <button type="button" data-r="down" aria-pressed="false">No</button>
      </div>

      <label for="category">What is it about?</label>
      <select id="category">
        <option value="idea">An idea or request</option>
        <option value="bug">Something is broken</option>
        <option value="question">A question</option>
        <option value="praise">Something you liked</option>
        <option value="other" selected>Something else</option>
      </select>

      <label for="message">Your message</label>
      <textarea id="message" maxlength="2000" placeholder="What would make LiteracyLab AI better for your child?"></textarea>
      <div class="count"><span id="n">0</span> / 2000</div>

      <label class="check"><input type="checkbox" id="contact"> You can email me about this feedback</label>

      <button class="go" id="send" type="submit">Send feedback</button>
      <div class="msg" id="status" role="status" aria-live="polite"></div>
    </form>
  </div>
  <footer>Please don't include your child's name or anything private. <a href="privacy.html">Privacy</a></footer>
</div>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  var token = q.get("t") || "";
  var emailKey = q.get("e") || "";
  var pre = q.get("r"); // up | down | more
  var rating = pre === "up" || pre === "down" ? pre : null;

  var $ = function (id) { return document.getElementById(id); };
  var buttons = Array.prototype.slice.call(document.querySelectorAll(".rate button"));
  function paint() { buttons.forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-r") === rating ? "true" : "false"); }); }
  paint();
  buttons.forEach(function (b) {
    b.addEventListener("click", function () { rating = rating === b.getAttribute("data-r") ? null : b.getAttribute("data-r"); paint(); });
  });
  $("message").addEventListener("input", function () { $("n").textContent = $("message").value.length; });

  function post(payload) {
    return fetch("/api/email?action=feedback", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) })
      .then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || "Something went wrong."); return d; }); });
  }

  // A thumbs up or down from the email is recorded straight away, so one click
  // is enough. The form below is optional extra detail. A page reload does not
  // record it twice.
  if (rating) {
    var flag = "ll_fb_" + emailKey + "_" + rating;
    var already = false;
    try { already = sessionStorage.getItem(flag) === "1"; } catch (e) {}
    $("title").textContent = rating === "up" ? "Glad it helped" : "Sorry it wasn't useful";
    $("lede").textContent = "You can add more detail below, or just close this page.";
    if (!already) {
      post({ token: token, emailKey: emailKey, rating: rating, category: "other" })
        .then(function () { $("ratingThanks").hidden = false; try { sessionStorage.setItem(flag, "1"); } catch (e) {} })
        .catch(function () {});
    } else {
      $("ratingThanks").hidden = false;
    }
  }

  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var message = $("message").value.trim();
    var status = $("status");
    if (!message && !rating) { status.className = "msg err"; status.textContent = "Please add a rating or a message."; return; }
    $("send").disabled = true;
    status.className = "msg"; status.textContent = "Sending…";
    post({ token: token, emailKey: emailKey, rating: rating, category: $("category").value, message: message, contactOk: $("contact").checked })
      .then(function () {
        $("card").innerHTML = '<h1>Thank you</h1><p>Your feedback has been saved and will be read. If you asked us to get in touch, we will reply by email.</p><p><a href="index.html" style="color:var(--wine-ink);font-weight:600;">Back to LiteracyLab AI</a></p>';
      })
      .catch(function (err) {
        $("send").disabled = false;
        status.className = "msg err"; status.textContent = err.message;
      });
  });
})();
</script>
</body>
</html>
