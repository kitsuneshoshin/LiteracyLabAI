name: Regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Pinned to match the local dev machine. When CI ran 20 and local
          # ran 24 the two disagreed about what "node --test tests/" even
          # means (24 resolves it as a module, 20 as a directory), so a
          # green CI run said nothing about whether the suite runs locally.
          node-version: 24
      - run: npm install
      - run: npm test
