     the whole app down: every sm:/md: Tailwind breakpoint below then evaluates
     against 980px and never fires, so the "responsive" layout silently never
     applies on the devices most likely to use it. Found by a live mobile
     emulation test reporting a 980px layout viewport at a 375px device width. -->
<meta name="viewport" content="width=device-width, initial-scale=1">

  // who lands there to the real site, keeping the page they asked for.
  if (/\.github\.io$/.test(location.hostname)) {
    location.replace("https://www.literacylabai.com" + location.pathname.replace(/^\/LiteracyLabAI/i, "") + location.search + location.hash);
  }
</script>

// serverless functions. Throws if somehow called without a session.
// Browser-native text-to-speech (no API cost) for the "Read prompt aloud"
// button, which matters most for the Early Years tier — pre/early readers
// who often can't fully read the prompt themselves.
function speakText(text) {
  if (!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel(); // stop anything already reading
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.rate = 0.9;
  window.speechSynthesis.speak(utterance);
}

async function authedFetch(session, path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      Authorization: `Bearer ${session.access_token}`,
      ...(options.headers || {}),
    },
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || `Request to ${path} failed (${res.status}).`);
    err.statusCode = res.status;
    err.payload = data;
    throw err;
  }
  return data;
}

// Which of a learner's interests a NEW piece is explained through. Pure (no
// state, no storage) so tests/interest-rotation.test.js can run the real code:
// only interests that suit the age tier, never the same as the previous
// piece unless it's the only choice, and a safe fallback when none are set.
function pickInterestForNewPiece({ interests, validForTier, last, fallback, random = Math.random }){
  const suited = interests.filter(id => validForTier.includes(id));
  const pool = suited.length ? suited : (interests.length ? interests : [fallback]);
  const options = pool.length > 1 ? pool.filter(id => id !== last) : pool;
  return options[Math.floor(random() * options.length)] || fallback;
}

// Flag EMOJI (as opposed to the globe glyph above) don't reliably render as
// flags on Windows - many configurations fall back to showing the raw
// two-letter regional-indicator text ("GB United Kingdom") instead of a
// flag, since Windows' font stack has historically had spotty support for
// the flag sequences specifically. `country` itself stays exactly as-is
// everywhere (it's the real stored value: DB column, API params, object
// keys below) - these are display-only helpers, used only where a country
// is actually shown to someone, never where it's read back as data.

// No published word-count guidance is specific enough to justify a
// separate character cap, so it's derived from the word target using a
// words-to-characters ratio that shrinks smoothly as the target grows
// (younger writing has more short/simple words and spacing overhead per
// word). This must be a continuous function of the target rather than a
// per-tier constant - a discrete per-tier ratio was tried first and live
// testing caught it producing a SMALLER cap for an older grade than a
// younger one right at a tier boundary (e.g. US Grade 9's 450-word target
// got a tighter cap than Grade 8's 400-word target, because the ratio
// stepped down from "middle" to "high" faster than the target grew).
function deriveMaxChars(target){
  const ratio = 7.5 + 5.5 * Math.exp(-target / 220);
  return Math.round((target * ratio) / 10) * 10;
}
function writingLimitsFor(country, gradeIdx){
  const gradeLabel = GRADE_DATA[country].grades[gradeIdx];
  const tier = tierForGrade(country, gradeIdx);
  const target = (GRADE_WORD_TARGETS[country] || {})[gradeLabel] ?? TIER_WRITING_LIMITS[tier].target;
  return { target, maxChars: deriveMaxChars(target) };
}

// The one interest with a {sport} placeholder — filled in per country by sportFor().
const SPORT_ANALOGY = {
  early: "like winning a game of {sport} — you keep trying until you finally score",
  elementary: "like training for {sport} — you practise one skill at a time before the big match",
  middle: "like a {sport} game plan — set up your point carefully, then make your move",
  high: "like elite {sport} technique — the small, precise details are what separate good from great",
};
function sportsAnalogy(tier, country){
  return SPORT_ANALOGY[tier].replace(/\{sport\}/g, sportFor(country).toLowerCase());
}
function vocabFor(interest, tier, country){
  const pairs = VOCAB_BANK[interest] ? VOCAB_BANK[interest][tier] : VOCAB_BANK.exam[tier];
  if (interest !== "sports") return pairs;
  const sport = sportFor(country).toLowerCase();
  return pairs.map(([term,def])=> [term, def.replace(/\{sport\}/g, sport)]);
}

// Base skill each growth tip targets, before it's explained through the student's interest.
const GROWTH_TIP_BASE = {
  early: "Next time, try starting one sentence with a describing word, like “Suddenly,” to make your story even more exciting.",

// the feedback lands as something they already understand rather than an abstract rule.
const INTEREST_ANALOGY = {

             elementary: "like a mission control checklist, where each step has to happen in the right order before launch",

             middle: "like a function: one clear input (your point), a process (your reasoning), and an output (your conclusion)",

  history: { early: "like telling a story about long ago — first, next, and last",

             middle: "like cause and effect in a historical event, where one action leads clearly to the next",

             elementary: "like a trailer — hook the audience early, save the best part for last",
             middle: "like a plot twist in a film: set it up quietly, then reveal it",
             high: "like a well-edited scene — build-up, climax, then a clean cut to the next idea" },
  exam:    { early: "like following a recipe, one step at a time, in order",
             elementary: "like a checklist, where you tick off one step before moving to the next",
             middle: "like a mark scheme — hit each point clearly, in the order it's expecting",
             high: "like an examiner's mark scheme: address the question, evidence it, then weigh it up" },

             middle: "like an animal's camouflage — the details only work when they all fit together",
             high: "like an ecosystem, where every part depends on the others to function well" },
};
function analogyFor(interest, tier, country){
  if (interest === "sports") return sportsAnalogy(tier, country);
  return (INTEREST_ANALOGY[interest] || INTEREST_ANALOGY.exam)[tier];
}
function growthTipFor(tier, interest, motivation, country, confidence){
  const closer = MOTIVATION_CLOSER[motivation] || MOTIVATION_CLOSER.enjoyment;
  return `${GROWTH_TIP_BASE[tier]} Think of it ${analogyFor(interest, tier, country)}. ${closer}${confidenceStretch(tier, confidence)}`;
}

function readingGlows(tier, score, totalQ, curriculum){
  const skill = READING_BANK[tier][0].skill; // same comprehension skill across all passages in a tier
  if (score === totalQ) return `Perfect score! You picked out every detail needed for ${skill.toLowerCase()} — exactly what ${curriculum} expects at this level.`;
  return `Nice reading — you got ${score} of ${totalQ} right, which shows a solid handle on ${skill.toLowerCase()} under ${curriculum}.`;
}
function readingGrows(tier, score, totalQ, interest, country, motivation, confidence){
  const base = score === totalQ
    ? "Try reading the next passage a little faster and see if your comprehension holds up under time pressure."
    : "Go back to the question you missed and find the exact sentence in the passage that answers it — that habit is the fastest way to stop losing marks on inference questions.";
  const closer = MOTIVATION_CLOSER[motivation] || MOTIVATION_CLOSER.enjoyment;
  return `${base} Think of it ${analogyFor(interest, tier, country)}. ${closer}${confidenceStretch(tier, confidence)}`;
}

// Generic hover/focus tooltip, reused everywhere a label or control needs a
// short explanation without permanently occupying page space. Keyboard-
// accessible (shows on focus, not just mouse hover) since a parent using a
// screen reader or tabbing through the dashboard deserves the same
// explanations a mouse user gets by hovering.
function Tooltip({ text, children, position = "top" }){
  if (!text) return children;
  const posClasses = position === "bottom" ? "top-full mt-2 origin-top" : "bottom-full mb-2 origin-bottom";
  // The bubble is centred on its trigger, so on a narrow screen a trigger
  // near the left edge pushes it off-screen: live testing at 375px found the
  // leftmost dashboard tooltips (trigger centred at ~86px) overhanging by
  // ~20px. A JS measure-and-nudge was tried first and could not be shown to
  // actually move the element, so it was dropped rather than shipped
  // unverified. Narrowing the bubble below sm instead fixes it arithmetically:
  // at w-40 (160px) a trigger centred at 86px puts the left edge at ~6px,
  // on-screen, and the widest trigger positions stay clear of the right edge.
  return (
    <span className="group relative inline-flex focus-ring rounded" tabIndex={0}>
      {children}
      <span
        className={`pointer-events-none absolute left-1/2 ${posClasses} w-40 sm:w-56 max-w-[calc(100vw-1.5rem)] -translate-x-1/2 rounded-xl p-3 text-[12.5px] leading-snug opacity-0 scale-95 transition-all duration-150 group-hover:opacity-100 group-hover:scale-100 group-focus:opacity-100 group-focus:scale-100 z-20`}
        style={{ background: "var(--ink)", color: "white", boxShadow: "0 10px 30px -12px hsl(var(--shadow) / 0.4)" }}>
        {text}
      </span>
    </span>
  );
}

function SectionLabel({ children, tip, tipPosition }){
  const label = <div className="text-xs font-semibold uppercase tracking-wider" style={{ color: "var(--ink-faint)" }}>{children}</div>;
  if (!tip) return label;
  return (
    <Tooltip text={tip} position={tipPosition}>
      <span className="inline-flex items-center gap-1 cursor-help" style={{ borderBottom: "1px dashed var(--ink-faint)" }}>
        {label}
      </span>
    </Tooltip>
  );
}

// The activity log behind the pricing table's "Full history" row. This used
// to be computed by api/history.js and returned as `recent` — but nothing
// on the page ever rendered it, so a differentiator that was being sold
// didn't visibly exist on ANY plan. Same failure mode as the exam-technique
// claim: shipped in the payload, absent from the product.
const HISTORY_PAGE = 10;

// Every word this learner has ever been taught (built server-side from
// past submissions' saved feedback - see api/history.js), with a
// "Test yourself" multiple-choice quiz built from the same list
// (api/_lib/vocabQuiz.js). Two small internal views (browse/quiz) rather
// than a separate page, since it's meant to be a quick side activity.
// ---- Vocabulary practice. Words come from every piece of feedback; how well each is known is a four-step Leitner
// ladder (a word you know climbs a step, one you miss drops back to the start), so flashcards always begin with the
// words that need the most work. Progress is kept on this device AND saved to the account, so it follows the learner
// between devices: each word is { box, at } (when it last changed) and, when the two copies disagree, the newer one wins.
const VOCAB_BOXES = 4;
const VOCAB_BOX_NAME = ["New", "Learning", "Nearly there", "Know it"];
const VOCAB_BOX_COLOR = ["var(--border)", "var(--gold)", "var(--cyan)", "var(--good)"];
const vocabNextBox = (box, gotIt) => (gotIt ? Math.min(VOCAB_BOXES - 1, (Number.isInteger(box) ? box : 0) + 1) : 0);
const vocabTermKey = (t) => String(t == null ? "" : t).trim().toLowerCase().replace(/\s+/g, " ");
// One saved word: a bare number (how an earlier version stored it) or { box, at }; anything else is not a word.
function vocabEntry(v){
  if (Number.isInteger(v) && v >= 0 && v < VOCAB_BOXES) return { box: v, at: 0 };
  if (v && typeof v === "object" && Number.isInteger(v.box) && v.box >= 0 && v.box < VOCAB_BOXES) return { box: v.box, at: Number.isFinite(v.at) && v.at > 0 ? v.at : 0 };
  return null;
}
const vocabBoxOf = (boxes, term) => { const e = vocabEntry(boxes && boxes[vocabTermKey(term)]); return e ? e.box : 0; };
const vocabDeck = (words, boxes, size = 8) => (words || []).map((w, i) => ({ w, i, b: vocabBoxOf(boxes, w.term) })).sort((a, b) => a.b - b.b || a.i - b.i).slice(0, size).map((x) => x.w);
// Joins this device's copy with the account's: for each word the newer change wins. toPush is what the account
// is missing or has older, to be saved; merged is what both should now hold.
function vocabMerge(local, server){
  const merged = {}, toPush = [];
  const keys = new Set([...Object.keys(local || {}), ...Object.keys(server || {})]);
  for (const k of keys) {
    const l = vocabEntry(local && local[k]), s = vocabEntry(server && server[k]);
    if (l && (!s || l.at > s.at)) { merged[k] = l; toPush.push({ term: k, box: l.box, at: l.at }); }
    else if (s) merged[k] = s;
  }
  return { merged, toPush };
}
function loadVocabBoxes(childId){
  try {
    const raw = JSON.parse(localStorage.getItem("ll_vocab_boxes_" + childId) || "{}");
    if (!raw || typeof raw !== "object" || Array.isArray(raw)) return {};
    const out = {};
    for (const k of Object.keys(raw)) { const e = vocabEntry(raw[k]); if (e) out[k] = e; }
    return out;
  } catch (e) { return {}; }
}
function saveVocabBoxes(childId, boxes){
  try { localStorage.setItem("ll_vocab_boxes_" + childId, JSON.stringify(boxes)); } catch (e) { /* private window: practice still works, it just is not remembered here */ }
}

// The Frayer card for a word: definition, characteristics, example and non-example. Older words only have the
// definition and example, so a box with nothing to show is left out rather than shown empty.
function frayerCells(w){
  const clean = (t) => (typeof t === "string" ? t.trim() : "");
  return [["Definition", clean(w && w.definition)], ["Characteristics", clean(w && w.characteristics)], ["Example", clean(w && w.example)], ["Not an example", clean(w && w.nonExample)]].filter(([, text]) => text);
}
function FrayerCard({ w, big = false }){
  const cells = frayerCells(w);
  if (cells.length === 0) return null;
  return (
    <div className={"grid gap-2 " + (cells.length > 1 ? "sm:grid-cols-2" : "")} role="group" aria-label={"Word card for " + (w && w.term)}>
      {cells.map(([label, text]) => (
        <div key={label} className="rounded-lg p-2.5" style={{ background: label === "Not an example" ? "var(--bad-tint)" : "var(--surface)", border: "1px solid var(--border-soft)" }}>
          <div className="text-[10.5px] font-bold uppercase tracking-wide mb-0.5" style={{ color: label === "Not an example" ? "var(--bad)" : "var(--ink-faint)" }}>{label}</div>
          <p className={(big ? "text-[14px]" : "text-[13px]") + " leading-snug" + (label === "Example" || label === "Not an example" ? " italic" : "")} style={{ color: "var(--ink)" }}>{label === "Example" ? "“" + text + "”" : text}</p>
        </div>
      ))}
    </div>
  );
}

function MasteryPips({ box }){
  return (
    <span className="inline-flex items-center gap-1" title={VOCAB_BOX_NAME[box]} aria-label={VOCAB_BOX_NAME[box]}>
      {[0, 1, 2, 3].map((n) => <span key={n} className="rounded-full" style={{ width: 14, height: 5, background: n <= box && box > 0 ? VOCAB_BOX_COLOR[box] : "var(--border)" }} />)}
    </span>
  );
}

function VocabularyBank({ session, childId, backendLive, onSeePlans, displayName }){
  const [words, setWords] = useState(null); // null = still loading
  const [locked, setLocked] = useState(false); // Free plan: the bank is Core/Premium
  const [loadError, setLoadError] = useState("");
  const [view, setView] = useState("words"); // words | cards | quiz
  const [deck, setDeck] = useState([]);
  const [boxes, setBoxes] = useState({});
  const [query, setQuery] = useState("");
  const [sort, setSort] = useState("newest");
  const [quiz, setQuiz] = useState(null);
  const [quizError, setQuizError] = useState("");
  const [loading, setLoading] = useState(false);

  // Fetched here (rather than passed in) because the bank is its own tab in the workspace and opens straight
  // after a submission - it always wants the latest words, not whatever the dashboard loaded earlier.
  useEffect(()=>{
    setView("words"); setQuiz(null); setQuizError(""); setLoadError(""); setLocked(false); setQuery("");
    setBoxes(childId ? loadVocabBoxes(childId) : {});
    if (!backendLive || !childId) { setWords([]); return; }
    let cancelled = false;
    setWords(null);
    authedFetch(session, `/api/history?childId=${childId}`)
      .then(d => {
        if (cancelled) return;
        setLocked(!!d.vocabLocked); setWords(d.vocabWords || []);
        // Join this device's progress with the account's (the newer change wins) and save back whatever the account lacks.
        if (!d.vocabLocked && d.vocabProgress && typeof d.vocabProgress === "object") {
          const { merged, toPush } = vocabMerge(loadVocabBoxes(childId), d.vocabProgress);
          setBoxes(merged); saveVocabBoxes(childId, merged);
          for (let i = 0; i < toPush.length; i += 100) {
            authedFetch(session, "/api/history", { method: "POST", body: JSON.stringify({ childId, updates: toPush.slice(i, i + 100) }) }).catch(() => {});
          }
        }
      })
      .catch(err => { if (!cancelled) { setLoadError(err.message || "Couldn't load your vocabulary right now."); setWords([]); } });
    return ()=>{ cancelled = true; };
  }, [childId, backendLive]);

  function rate(term, gotIt){
    const key = vocabTermKey(term);
    const entry = { box: vocabNextBox(vocabBoxOf(boxes, term), gotIt), at: Date.now() };
    setBoxes((prev) => {
      const next = { ...prev, [key]: entry };
      if (childId) saveVocabBoxes(childId, next);
      return next;
    });
    // Saved to the account too, quietly: if it cannot be (offline, plan change), this device keeps it and the
    // next time the page opens the newer copy is sent up.
    if (backendLive && childId && session) authedFetch(session, "/api/history", { method: "POST", body: JSON.stringify({ childId, updates: [{ term: key, box: entry.box, at: entry.at }] }) }).catch(() => {});
  }

  function startCards(){ setDeck(vocabDeck(words, boxes, 8)); setView("cards"); }

  async function startQuiz(){
    setLoading(true);
    setQuizError("");
    try {
      // Tells the server which words the last quiz used so a new quiz picks different ones (when the bank has enough).
      const exclude = (quiz?.questions || []).map(q => q.term).join("|");
      const data = await authedFetch(session, `/api/history?childId=${childId}&quiz=1&count=5${exclude ? `&exclude=${encodeURIComponent(exclude)}` : ""}`, { cache: "no-store" });
      if (!data.questions || data.questions.length === 0) {
        setQuizError(`Collect at least ${data.minRequired || 4} different words first. You have ${wordsLearnedLabel(data.available)} so far.`);
        setQuiz(null);
      } else {
        setQuiz(data);
      }
      setView("quiz");
    } catch (err) {
      setQuizError(err.payload?.error || err.message || "Couldn't load the quiz right now.");
      setView("quiz");
    } finally {
      setLoading(false);
    }
  }
  function wordsLearnedLabel(n){
    return n === 1 ? "1 word learned" : `${n || 0} words learned`;
  }

  const who = displayName ? `${displayName}'s` : "Your";

  if (locked) {
    return (
      <div className="card p-10 flex flex-col items-center justify-center text-center gap-3 min-h-[300px] max-w-3xl mx-auto">
        <IconLock size={22} style={{ color: "var(--ink-faint)" }} />
        <div className="font-display font-semibold text-base" style={{ color: "var(--ink)" }}>The vocabulary bank is part of Core and Premium</div>
        <p className="text-[13px] max-w-[46ch]" style={{ color: "var(--ink-faint)" }}>
          Every word from your feedback is still taught on each piece. Upgrade to collect them all in one place, practise them with flashcards and test yourself with a quick quiz.
        </p>
        <button onClick={onSeePlans} className="focus-ring inline-flex items-center gap-1.5 rounded-full px-4 py-2 text-sm font-bold mt-1" style={{ background: "var(--gold)", color: "#fff" }}>See plans</button>
      </div>
    );
  }

  const list = words || [];
  const total = list.length;
  const known = list.filter((w) => vocabBoxOf(boxes, w.term) === VOCAB_BOXES - 1).length;
  const shown = list
    .filter((w) => { const q = query.trim().toLowerCase(); return !q || vocabTermKey(w.term).includes(q) || String(w.definition || "").toLowerCase().includes(q); })
    .slice()
    .sort((a, b) => sort === "az" ? vocabTermKey(a.term).localeCompare(vocabTermKey(b.term)) : sort === "practise" ? vocabBoxOf(boxes, a.term) - vocabBoxOf(boxes, b.term) : 0);

  return (
    <div className="max-w-5xl mx-auto flex flex-col gap-4">
      <div className="card p-5 sm:p-6">
        <div className="flex flex-col sm:flex-row sm:items-center gap-4 justify-between">
          <div className="min-w-0">
            <h2 className="font-display font-bold text-xl" style={{ color: "var(--ink)" }}>{who} vocabulary bank</h2>
            <p className="text-[13px] mt-0.5" style={{ color: "var(--ink-soft)" }}>Every word from your feedback, in one place. Practise a few each day and they stick.</p>
          </div>
          {total > 0 && view === "words" && (
            <div className="flex flex-wrap gap-2 shrink-0">
              <button onClick={startCards} className="focus-ring inline-flex items-center gap-1.5 rounded-full px-4 py-2 text-sm font-bold" style={{ background: "var(--cyan)", color: "white" }}>
                <IconSparkle size={14} /> Practise flashcards
              </button>
              <button onClick={startQuiz} disabled={loading} className="focus-ring inline-flex items-center gap-1.5 rounded-full px-4 py-2 text-sm font-bold disabled:opacity-50" style={{ background: "var(--surface-2)", color: "var(--ink)" }}>
                {loading ? "Loading…" : "Take a quiz"}
              </button>
            </div>
          )}
        </div>
        {total > 0 && view === "words" && (
          <div className="mt-4">
            <div className="flex items-center justify-between text-xs mb-1.5" style={{ color: "var(--ink-soft)" }}>
              <span><strong className="tabular" style={{ color: "var(--ink)" }}>{known}</strong> of {total} word{total === 1 ? "" : "s"} known</span>
              <span className="tabular">{total - known} still to practise</span>
            </div>
            <div className="h-2 rounded-full overflow-hidden" style={{ background: "var(--border)" }} role="progressbar" aria-valuemin={0} aria-valuemax={total} aria-valuenow={known} aria-label="Words known">
              <div className="h-full rounded-full" style={{ width: (total ? (known / total) * 100 : 0) + "%", background: "var(--good)", transition: "width 300ms" }} />
            </div>
          </div>
        )}
      </div>

      {view === "cards" ? (
        <VocabFlashcards deck={deck} boxes={boxes} onRate={rate} onBack={()=>setView("words")} onAgain={startCards} />
      ) : view === "quiz" ? (
        <VocabQuiz quiz={quiz} error={quizError} onRate={rate} onRetry={startQuiz} onBack={()=>setView("words")} loading={loading} />
      ) : !words ? (
        <div className="card p-6 text-sm text-center" style={{ color: "var(--ink-faint)" }}>Loading…</div>
      ) : loadError ? (
        <div className="card p-6 text-sm text-center" style={{ color: "var(--bad)" }}>{loadError}</div>
      ) : total === 0 ? (
        <div className="card py-10 px-6 text-center flex flex-col items-center gap-2">
          <IconBookOpenCheck size={24} style={{ color: "var(--ink-faint)" }} />
          <div className="font-display font-semibold text-sm" style={{ color: "var(--ink)" }}>No words collected yet</div>
          <p className="text-[13px] max-w-[42ch]" style={{ color: "var(--ink-faint)" }}>
            {backendLive
              ? "Every writing or reading piece you submit teaches a few new words. They'll collect here, and once you have 4 you can practise and test yourself."
              : "Sign in and submit a piece to start building a vocabulary bank."}
          </p>
        </div>
      ) : (
        <>
          <div className="flex flex-wrap items-center gap-2">
            <input type="search" value={query} onChange={(e)=>setQuery(e.target.value)} placeholder="Search your words"
              aria-label="Search your words" className="focus-ring flex-1 min-w-[12rem] rounded-full border px-4 py-2 text-sm"
              style={{ borderColor: "var(--border)", background: "var(--surface)", color: "var(--ink)" }} />
            <select value={sort} onChange={(e)=>setSort(e.target.value)} aria-label="Sort words" className="focus-ring rounded-full border px-3 py-2 text-sm"
              style={{ borderColor: "var(--border)", background: "var(--surface)", color: "var(--ink)" }}>
              <option value="newest">Newest first</option>
              <option value="practise">Needs practice first</option>
              <option value="az">A to Z</option>
            </select>
          </div>
          {shown.length === 0 ? (
            <div className="card p-6 text-sm text-center" style={{ color: "var(--ink-faint)" }}>No words match "{query}".</div>
          ) : (
            <div className="grid sm:grid-cols-2 xl:grid-cols-3 gap-3">
              {shown.map((v) => (
                <div key={v.term} className="card p-4 flex flex-col gap-1.5" style={{ borderColor: "var(--border)" }}>
                  <div className="flex items-center justify-between gap-2">
                    <span className="font-display font-bold text-[15px]" style={{ color: "var(--cyan-ink)" }}>{v.term}</span>
                    <MasteryPips box={vocabBoxOf(boxes, v.term)} />
                  </div>
                  <p className="text-[13px] leading-snug" style={{ color: "var(--ink)" }}>{v.definition}</p>
                  {v.example && <p className="text-[13px] leading-snug italic" style={{ color: "var(--ink-soft)" }}>“{v.example}”</p>}
                  {v.characteristics && <p className="text-[12.5px] leading-snug" style={{ color: "var(--ink-soft)" }}><span className="font-semibold" style={{ color: "var(--ink)" }}>It is: </span>{v.characteristics}</p>}
                  {v.nonExample && <p className="text-[12.5px] leading-snug" style={{ color: "var(--ink-soft)" }}><span className="font-semibold" style={{ color: "var(--bad)" }}>Not: </span>{v.nonExample}</p>}
                  {v.trick && <p className="text-[12.5px] leading-snug" style={{ color: "var(--cyan-ink)" }}><span className="font-semibold">Word trick: </span>{v.trick}</p>}
                </div>
              ))}
            </div>
          )}
        </>
      )}
    </div>
  );
}

// One word at a time: see the word, say what it means, flip to check, then say whether you knew it.
function VocabFlashcards({ deck, boxes, onRate, onBack, onAgain }){
  const [idx, setIdx] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [known, setKnown] = useState(0);
  const card = deck[idx];
  if (!card) {
    return (
      <div className="card p-8 flex flex-col items-center gap-4 text-center max-w-xl mx-auto w-full">
        <ScoreRing score={known} total={deck.length} label="knew it" />
        <div>
          <h3 className="font-display font-bold text-lg" style={{ color: "var(--ink)" }}>{known === deck.length ? "You knew them all" : "Nice work"}</h3>
          <p className="text-[13.5px] mt-1" style={{ color: "var(--ink-soft)" }}>Words you missed come back first next time, so they get the practice.</p>
        </div>
        <div className="flex gap-2 flex-wrap justify-center">
          <button onClick={onAgain} className="focus-ring rounded-full px-5 py-2.5 text-sm font-bold" style={{ background: "var(--cyan)", color: "white" }}>Practise again</button>
          <button onClick={onBack} className="focus-ring rounded-full px-5 py-2.5 text-sm font-bold" style={{ background: "var(--surface-2)", color: "var(--ink)" }}>Back to words</button>
        </div>
      </div>
    );
  }
  function answer(gotIt){
    onRate(card.term, gotIt);
    if (gotIt) setKnown((k) => k + 1);
    setFlipped(false);
    setIdx((i) => i + 1);
  }
  return (
    <div className="max-w-xl mx-auto w-full flex flex-col gap-4">
      <div className="flex items-center gap-3">
        <button onClick={onBack} className="focus-ring text-[13px] font-semibold underline" style={{ color: "var(--ink-soft)" }}>Back</button>
        <div className="flex-1 h-2 rounded-full overflow-hidden" style={{ background: "var(--border)" }} role="progressbar" aria-valuemin={0} aria-valuemax={deck.length} aria-valuenow={idx} aria-label="Cards done">
          <div className="h-full rounded-full" style={{ width: (idx / deck.length) * 100 + "%", background: "var(--cyan)", transition: "width 250ms" }} />
        </div>
        <span className="text-xs font-semibold tabular" style={{ color: "var(--ink-soft)" }}>{idx + 1} / {deck.length}</span>
      </div>
      <button type="button" onClick={()=>setFlipped((f) => !f)} aria-label={flipped ? "Show the word" : "Show the meaning"}
        className="focus-ring card w-full text-left p-6 sm:p-8 min-h-[16rem] flex flex-col justify-center gap-3" style={{ borderColor: flipped ? "var(--cyan)" : "var(--border)", borderWidth: 1.5 }}>
        <div className="flex items-center justify-between">
          <span className="text-[11px] font-bold uppercase tracking-wide" style={{ color: "var(--ink-faint)" }}>{flipped ? "Meaning" : "What does this word mean?"}</span>
          <MasteryPips box={vocabBoxOf(boxes, card.term)} />
        </div>
        <div className="font-display font-extrabold text-3xl" style={{ color: "var(--cyan-ink)" }}>{card.term}</div>
        {flipped ? (
          <div className="flex flex-col gap-2">
            <FrayerCard w={card} big />
            {card.trick && <p className="text-[13px]" style={{ color: "var(--cyan-ink)" }}><span className="font-semibold">Word trick: </span>{card.trick}</p>}
          </div>
        ) : (
          <p className="text-[13px]" style={{ color: "var(--ink-faint)" }}>Say it in your own words, then tap the card to check.</p>
        )}
      </button>
      {flipped ? (
        <div className="grid grid-cols-2 gap-3">
          <button onClick={()=>answer(false)} className="focus-ring rounded-xl py-3 text-sm font-bold" style={{ background: "var(--bad-tint)", color: "var(--bad)" }}>Not yet</button>
          <button onClick={()=>answer(true)} className="focus-ring rounded-xl py-3 text-sm font-bold" style={{ background: "var(--good-tint)", color: "var(--good)" }}>I knew it</button>
        </div>
      ) : (
        <button onClick={()=>setFlipped(true)} className="focus-ring rounded-xl py-3 text-sm font-bold" style={{ background: "var(--ink)", color: "white" }}>Show the meaning</button>
      )}
    </div>
  );
}

// The quiz, one question at a time with an answer you can see straight away, then a summary that names the words to revisit.
function VocabQuiz({ quiz, error, onRate, onRetry, onBack, loading }){
  const [idx, setIdx] = useState(0);
  const [chosen, setChosen] = useState(null);
  const [results, setResults] = useState([]); // true/false per question answered
  useEffect(()=>{ setIdx(0); setChosen(null); setResults([]); }, [quiz]);
  if (error) {
    return (
      <div className="card p-6 max-w-xl mx-auto w-full">
        <p className="text-sm py-2 text-center" style={{ color: "var(--ink-faint)" }}>{error}</p>
        <button onClick={onBack} className="focus-ring mt-3 w-full rounded-full py-2.5 text-sm font-bold" style={{ background: "var(--surface-2)", color: "var(--ink)" }}>Back</button>
      </div>
    );
  }
  if (!quiz) return null;
  const qs = quiz.questions;
  const q = qs[idx];
  if (!q) {
    const right = results.filter(Boolean).length;
    const missed = qs.filter((_, i) => !results[i]);
    return (
      <div className="card p-6 sm:p-8 flex flex-col items-center gap-4 text-center max-w-xl mx-auto w-full">
        <ScoreRing score={right} total={qs.length} />
        <h3 className="font-display font-bold text-lg" style={{ color: "var(--ink)" }}>{right === qs.length ? "Perfect score" : right >= qs.length / 2 ? "Good going" : "Keep practising"}</h3>
        {missed.length > 0 && (
          <div className="w-full text-left flex flex-col gap-2">
            <div className="text-[11px] font-bold uppercase tracking-wide" style={{ color: "var(--ink-faint)" }}>Words to revisit</div>
            {missed.map((m) => (
              <div key={m.term} className="rounded-xl p-3" style={{ background: "var(--surface-2)" }}>
                <span className="font-display font-bold text-sm" style={{ color: "var(--cyan-ink)" }}>{m.term}</span>
                <p className="text-[13px] mt-0.5" style={{ color: "var(--ink)" }}>{m.options[m.correctIndex]}</p>
              </div>
            ))}
          </div>
        )}
        <div className="flex gap-2 flex-wrap justify-center">
          <button onClick={onRetry} disabled={loading} className="focus-ring rounded-full px-5 py-2.5 text-sm font-bold disabled:opacity-50" style={{ background: "var(--cyan)", color: "white" }}>{loading ? "Loading…" : "New quiz"}</button>
          <button onClick={onBack} className="focus-ring rounded-full px-5 py-2.5 text-sm font-bold" style={{ background: "var(--surface-2)", color: "var(--ink)" }}>Back to words</button>
        </div>
      </div>
    );
  }
  const answered = chosen != null;
  function pick(oi){
    if (answered) return;
    setChosen(oi);
    const ok = oi === q.correctIndex;
    setResults((r) => { const next = r.slice(); next[idx] = ok; return next; });
    if (onRate) onRate(q.term, ok);
  }
  return (
    <div className="max-w-xl mx-auto w-full flex flex-col gap-4">
      <div className="flex items-center gap-3">
        <button onClick={onBack} className="focus-ring text-[13px] font-semibold underline" style={{ color: "var(--ink-soft)" }}>Back</button>
        <div className="flex-1 h-2 rounded-full overflow-hidden" style={{ background: "var(--border)" }} role="progressbar" aria-valuemin={0} aria-valuemax={qs.length} aria-valuenow={idx} aria-label="Quiz progress">
          <div className="h-full rounded-full" style={{ width: (idx / qs.length) * 100 + "%", background: "var(--cyan)", transition: "width 250ms" }} />
        </div>
        <span className="text-xs font-semibold tabular" style={{ color: "var(--ink-soft)" }}>{idx + 1} / {qs.length}</span>
      </div>
      <div className="card p-5 sm:p-6">
        <div className="text-[11px] font-bold uppercase tracking-wide mb-1" style={{ color: "var(--ink-faint)" }}>Which meaning fits?</div>
        <div className="font-display font-extrabold text-2xl mb-4" style={{ color: "var(--cyan-ink)" }}>{q.term}</div>
        <div className="flex flex-col gap-2">
          {q.options.map((opt, oi) => {
            const isCorrect = oi === q.correctIndex;
            const isChosen = oi === chosen;
            let st = { borderColor: "var(--border)", background: "var(--surface)", color: "var(--ink)" };
            if (answered && isCorrect) st = { borderColor: "var(--good)", background: "var(--good-tint)", color: "var(--ink)" };
            else if (answered && isChosen) st = { borderColor: "var(--bad)", background: "var(--bad-tint)", color: "var(--ink)" };
            return (
              <button key={oi} disabled={answered} onClick={()=>pick(oi)} className="focus-ring text-left rounded-xl border px-3.5 py-2.5 text-[14px] disabled:cursor-default" style={st}>{opt}</button>
            );
          })}
        </div>
        {answered && (
          <p className="text-[13px] mt-3 font-semibold" style={{ color: chosen === q.correctIndex ? "var(--good)" : "var(--bad)" }} role="status">

        )}

      <button onClick={()=>{ setChosen(null); setIdx((i) => i + 1); }} disabled={!answered}

        {idx + 1 === qs.length ? "See my results" : "Next question"}
      </button>
    </div>
  );
}

    <div className="card p-5 mb-5 flex items-start gap-3" style={{ borderColor: "var(--gold)", borderWidth: 1.5, background: "var(--gold-tint)" }}>

          {onSeePlans && (
            <button onClick={onSeePlans} className="focus-ring inline-flex items-center gap-1.5 rounded-full px-3.5 py-1.5 text-[12.5px] font-bold" style={{ background: "var(--gold)", color: "#fff" }}>
              <IconCrown size={12} strokeWidth={2.4} /> See plans

}

function ProgressTimeline({ weeks }){
  const plottable = (weeks || []).filter(w => w.masteryPct != null);
  if (plottable.length < 2) {
    return (
      <div className="text-sm py-6 text-center" style={{ color: "var(--ink-faint)" }}>
        Keep submitting stories — a trend line appears once there are at least two weeks of assessed writing.
      </div>
    );
  }
  const W = 640, H = 200, padL = 34, padR = 12, padT = 16, padB = 28;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const n = plottable.length;
  const x = (i) => padL + (n === 1 ? innerW / 2 : (i / (n - 1)) * innerW);
  const y = (pct) => padT + innerH - (pct / 100) * innerH;
  const points = plottable.map((w, i) => ({ ...w, cx: x(i), cy: y(w.masteryPct) }));
  const path = points.map((p, i) => `${i === 0 ? "M" : "L"} ${p.cx.toFixed(1)} ${p.cy.toFixed(1)}`).join(" ");
  const areaPath = `${path} L ${points[points.length - 1].cx.toFixed(1)} ${padT + innerH} L ${points[0].cx.toFixed(1)} ${padT + innerH} Z`;
  const fmtWeek = (iso) => new Date(iso + "T00:00:00Z").toLocaleDateString(undefined, { month: "short", day: "numeric", timeZone: "UTC" });
  const fmtWeekLong = (iso) => new Date(iso + "T00:00:00Z").toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric", timeZone: "UTC" });
  // At most 5 x-axis labels, evenly spaced, so dense histories don't overlap.
  const labelEvery = Math.max(1, Math.ceil(n / 5));
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ height: 200 }}>
      {[0, 25, 50, 75, 100].map(gy => (
        <g key={gy}>
          <line x1={padL} x2={W - padR} y1={y(gy)} y2={y(gy)} stroke="var(--border-soft)" strokeWidth="1" />
          <text x={padL - 8} y={y(gy) + 4} textAnchor="end" fontSize="10" fill="var(--ink-faint)">{gy}%</text>
        </g>
      ))}
      <path d={areaPath} fill="var(--cyan-tint)" opacity="0.6" />
      <path d={path} fill="none" stroke="var(--cyan-ink)" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
      {points.map((p, i) => (
        <g key={p.weekStart} style={{ cursor: "pointer" }}>
          {/* A transparent, larger circle widens the hover/tap target beyond the
              tiny 3.5px visible dot, without changing what's drawn. */}
          <circle cx={p.cx} cy={p.cy} r="10" fill="transparent">
            <title>{`Week of ${fmtWeekLong(p.weekStart)}: ${p.masteryPct}% mastery, ${p.submissions} submission${p.submissions===1?"":"s"}${p.wordsWritten ? `, ${p.wordsWritten.toLocaleString()} words written` : ""}`}</title>
          </circle>
          <circle cx={p.cx} cy={p.cy} r="3.5" fill="var(--cyan-ink)" />
        </g>
      ))}
      {points.map((p, i) => (
        (i % labelEvery === 0 || i === points.length - 1) && (
          <text key={"lbl-" + p.weekStart} x={p.cx} y={H - 8}
            textAnchor={i === 0 ? "start" : i === points.length - 1 ? "end" : "middle"}
            fontSize="10" fill="var(--ink-faint)">{fmtWeek(p.weekStart)}</text>
        )
      ))}
    </svg>
  );
}

// One component, three pages (page = "overview" | "profile" | "plan"):
// Manage profile and Manage plan used to be cards at the bottom of one very
// long Dashboard scroll. They're now their own pages, reached from the
// header's Account menu, so the overview stays about progress and the
// settings/billing forms get a screen to themselves.
function Dashboard({ country, setCountry, gradeIdx, setGradeIdx, tier, interests, toggleInterest, confidenceWriting, setConfidenceWriting, confidenceReading, setConfidenceReading, motivation, setMotivation, displayName, setDisplayName, avatarId, setAvatarId, children_, activeChildId, onSwitchChild, onAddChild, onRemoveChild, onMakeUsable, activeChangeAvailableAt, used, total, plan, session, setView, history, progress, peerStats, backendLive, needsOnboarding, onCompleteOnboarding, page = "overview" }){
  const showOverview = page === "overview";
  const showProfile = page === "profile";
  const showPlan = page === "plan";
  const grades = GRADE_DATA[country].grades;
  const gradeLabel = grades[gradeIdx];
  const remaining = total - used;
  const MAPPED_TARGETS = { "🇬🇧 United Kingdom": MASTERY_TARGETS_UK, "🇺🇸 United States": MASTERY_TARGETS_US, "🇦🇺 Australia": MASTERY_TARGETS_AU };
  const MAPPED_BADGE = {
    "🇬🇧 United Kingdom": "DfE & AQA verified", "🇺🇸 United States": "Common Core & AP verified", "🇦🇺 Australia": "Australian Curriculum verified",
    "🇨🇦 Canada": "Ontario Curriculum verified", "🇦🇪 UAE & GCC Hubs": "Cambridge & IGCSE verified",
    "🇸🇬 Singapore & SE Asia": "Cambridge & IGCSE verified", "🌐 Global ESL Mode": "CEFR levels verified",
  };
  // Demo mode (no backend) only has static data for the 3 originally-mapped
  // regions; with a live backend, api/progress.js now maps every region
  // (see masteryTargets.js), so isMapped there reflects what it returns.
  const isMapped = backendLive ? Boolean(progress && progress.isMapped) : !!MAPPED_TARGETS[country];
  const [billingLoading, setBillingLoading] = useState(false);
  const [billingError, setBillingError] = useState(null);
  const paid = isPaidPlan(plan);
  const meta = planMeta(plan);
  // What this account can still buy: Free sees both plans, Core sees Premium
  // (it used to get only a sentence about Premium and no way to act on it),
  // Premium/Pro/Admin have nothing left to upgrade to.
  const PLAN_CARDS = [
                    { tier: "core", name: "Core", price: PLAN_META.core.price, sub: "One learner", features: ["Unlimited writing & reading submissions", "26-week progress trend chart", "Anonymous ranking in their year group", "Full activity history", "Vocabulary bank with a self-test quiz"] },
                    { tier: "premium", name: "Premium", price: PLAN_META.premium.price, sub: "Up to 6 learners", features: ["Everything in Core, for the whole household", "Extended feedback: a second, harder next step", "Your response rewritten and a model response, with the framework shown in both", "A short written answer in reading, marked out of 2 or 3", "Spelling & grammar check and a score out of 10 on every piece", "Exam-technique scoring against real assessment objectives (ages 11+)"] },
  ];
  const upsellCards = plan === "free" ? PLAN_CARDS : plan === "core" ? PLAN_CARDS.filter(c => c.tier === "premium") : [];

  // Redirects to Stripe's own hosted page for either starting a
  // subscription or managing/cancelling an existing one — we never handle
  // card details ourselves. The actual plan flip happens via the Stripe
  // webhook (api/stripe-webhook.js), not here; this just gets the user to
  // the right Stripe page and back. The tier is passed through for a new
  // subscription; an existing subscriber is sent to Stripe's portal
  // regardless of what's clicked, since changing tier belongs there.
  async function handleBilling(tier){
    if (!backendLive || billingLoading) return;
    setBillingLoading(true);
    setBillingError(null);
    try {
      const result = await authedFetch(session, "/api/billing-session", {
        method: "POST",
        body: JSON.stringify({ tier: tier || "core" }),
      });
      window.llTrack && window.llTrack("begin_checkout", { plan: tier || "core" });
      window.location.href = result.url;
    } catch (err) {
      setBillingError(err.payload?.error || err.message || "Something went wrong opening billing. Please try again.");
      setBillingLoading(false);
    }
  }
  // Real, working versions of the two rights privacy.html promises parents
  // ("export a copy... in a portable format", "delete the entire account, at
  // any time") - both used to be policy-only promises with no supporting
  // endpoint. Both live in api/account.js (GET = export, DELETE = delete) -
  // merged into one file to stay within Vercel Hobby's 12-function-per-
  // deployment cap. Deletion cancels any Stripe subscription and deletes the
  // auth user, cascading every child profile and submission, then signs out
  // locally, since the account that owned this session no longer exists.
  async function handleExportData(){
    if (!backendLive) return;
    try {
      const data = await authedFetch(session, "/api/account");
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "literacylab-data-export.json";
      a.click();
      URL.revokeObjectURL(url);
    } catch (err) {
      logAppError("Failed to export account data:", err);
      window.alert("Something went wrong exporting your data. Please try again or email privacy@literacylabai.com.");
    }
  }
  async function handleDeleteAccount(){
    if (!backendLive) return;
    if (!window.confirm("Permanently delete your entire LiteracyLab AI account? This deletes every learner profile, all writing and reading history, and cancels any active subscription. This cannot be undone.")) return;
    try {
      await authedFetch(session, "/api/account", { method: "DELETE" });
      await supabaseClient.auth.signOut();
    } catch (err) {
      logAppError("Failed to delete account:", err);
      window.alert("Something went wrong deleting your account. Please try again or email privacy@literacylabai.com.");
    }
  }
  // With a live backend, real per-skill mastery (computed from this
  // student's own submission history — see api/progress.js) replaces the
  // static demo numbers below, once it's loaded.
  const targets = backendLive
    ? (progress ? progress.targets : null)
    : (isMapped ? MAPPED_TARGETS[country][tier] : MASTERY_TARGETS[tier]);

  return (
    <>
    {needsOnboarding && !showPlan && (
      <div className="mx-auto max-w-[1400px] px-4 sm:px-6 pt-8">
        <div className="rounded-2xl px-5 py-4 flex items-center gap-3 flex-wrap" style={{ background: "var(--cyan-tint)", border: "1.5px solid var(--cyan)" }}>
          <div className="w-9 h-9 rounded-full grid place-items-center shrink-0" style={{ background: "var(--cyan)", color: "#fff" }}>
            <IconSparkle size={17} strokeWidth={2.2} />
          </div>
          <div className="flex-1 min-w-[200px]">
            <div className="font-display font-bold text-sm" style={{ color: "var(--ink)" }}>Welcome! Let's set up your learner first.</div>
            <div className="text-[13px]" style={{ color: "var(--ink-soft)" }}>This takes under a minute and personalises every piece of feedback from here on.</div>
          </div>
        </div>
      </div>
    )}
    <div className="mx-auto max-w-[1400px] px-4 sm:px-6 py-8 flex flex-col gap-8">
      {backendLive && !showPlan && (
        <ChildSwitcher children_={children_} activeChildId={activeChildId} onSwitchChild={onSwitchChild} onAddChild={onAddChild} />
      )}
      {backendLive && !showPlan && (
        <PausedLearnerNotice child={children_.find(c => c.id === activeChildId)} children_={children_}
          activeChangeAvailableAt={activeChangeAvailableAt} onMakeUsable={onMakeUsable} />
      )}

      {showOverview && (<>
      {/* SNAPSHOT — every quick number, in one glance, before anything
          else. Used to be a narrow sidebar column next to the first
          card; now leads the page since it's what a returning parent
          actually wants first, not buried below a settings form. */}
      <div className="flex flex-col gap-3">
        <div className="text-[11px] font-bold uppercase tracking-wide" style={{ color: "var(--ink-faint)" }}>Snapshot</div>
        <div className="grid sm:grid-cols-3 gap-4">
          {backendLive ? (
            <>
              <StatTile icon={IconTrend} label="Reading Accuracy" value={history?.avgReadingScore != null ? `${history.avgReadingScore}%` : "—"} sub={history ? `From ${history.readingSubmissions} submission${history.readingSubmissions===1?"":"s"}` : "Loading…"} accent="var(--good)"
                tip="Average % of comprehension questions answered correctly across every graded reading exercise this learner has completed." />
              <StatTile icon={IconPen} label="Words Written" value={history ? history.wordsWritten.toLocaleString() : "—"} sub={history ? `Across ${history.writingPieces} piece${history.writingPieces===1?"":"s"}` : "Loading…"} accent="var(--cyan-ink)"
                tip="Total word count across every completed writing submission - reading exercises aren't counted here." />
              <StatTile icon={IconFlame} label="Active Streak" value={history ? `${history.activeStreak} day${history.activeStreak===1?"":"s"}` : "—"} sub="Real progress, tracked from your submissions" accent="var(--gold)"
                tip="Consecutive days with at least one writing or reading submission, ending today or yesterday. Resets to 0 the moment a day is missed - it's a motivational streak, not something that affects mastery scoring." />
            </>
          ) : (
            <>
              <StatTile icon={IconTrend} label="Overall Mastery" value="72%" sub="+6% this month" accent="var(--good)" />
              <StatTile icon={IconPen} label="Words Written" value="8,450" sub="Across 14 pieces" accent="var(--cyan-ink)" />
              <StatTile icon={IconFlame} label="Active Streak" value="12 days" sub="Personal best: 19 days" accent="var(--gold)" />
            </>
          )}
        </div>
      </div>

      {/* LEARNING ACTIVITY — everything about how the learner is actually
          doing, grouped together: target mastery, the trend line built
          from the same glow/grow data, peer comparison, the raw activity
          log, and the vocabulary bank. */}
      <div className="flex flex-col gap-6">
        <div className="text-[11px] font-bold uppercase tracking-wide" style={{ color: "var(--ink-faint)" }}>Learning activity</div>

        <div className="card p-6">
          <div className="flex items-center justify-between mb-1 flex-wrap gap-2">

              <span className="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-[11px] font-bold" style={{ background: "var(--good-tint)", color: "var(--good)" }}>
                <IconCheck size={12} strokeWidth={2.6} /> {MAPPED_BADGE[country]}
              </span>
            ) : (
              <span className="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-[11px] font-bold" style={{ background: "var(--surface-2)", color: "var(--ink-faint)" }}>
                Illustrative — syllabus mapping in progress
              </span>
            )}
          </div>
          <p className="text-xs mb-4" style={{ color: "var(--ink-faint)" }}>
            {backendLive
              ? (isMapped
                  ? "Each target cites the exact standard it's drawn from. Progress below is computed from your own submission history, not a demo number."
                  : `${stripFlag(country)} isn't individually mapped to a national standard yet, so target names are illustrative — but the progress shown is still computed from your own submission history.`)

            <div className="font-display font-semibold text-sm" style={{ color: "var(--ink)" }}>{needsOnboarding ? "Start Writing" : "Go to Student Workspace"}</div>

          </div>
          <IconArrowRight size={18} style={{ color: "var(--cyan-ink)" }} />

// A short, low-friction "did this land?" check — captured per piece of feedback
// rather than guessed once at signup, since feedback receptivity shifts over time.
// A thumbs-down is the one moment a parent/student is already telling us
// something didn't work - asking "why?" right there, optionally, turns a bare
// satisfaction score into an actual product-feedback backlog (see
// commitments.feedback_text). Thumbs-up stays a single tap: there's nothing
// to elaborate on when something already worked.
function ThumbsFeedback({ context, session, submissionId, backendLive }){
  const [value, setValue] = useState(null);
  const [showCommentBox, setShowCommentBox] = useState(false);
  const [comment, setComment] = useState("");

  function send(v, text){
    setValue(v);
    if (backendLive && submissionId) {
      authedFetch(session, "/api/email?action=rating", { method: "POST", body: JSON.stringify({ submissionId, helpfulRating: v, feedbackText: text || undefined }) })
        .catch((err)=> logAppError("Failed to log feedback rating:", err));
    }
  }

  if (value) {
    return (
      <div className="text-[12.5px] flex items-center gap-1.5" style={{ color: "var(--ink-faint)" }}>
        <IconCheck size={13} strokeWidth={2.4} style={{ color: "var(--good)" }} />
        Thanks — that helps us calibrate your next {context}.
      </div>
    );
  }

  if (showCommentBox) {
    const good = showCommentBox === "up";
    return (
      <div className="flex flex-col gap-2 max-w-md">
        <span className="text-[12.5px] font-medium" style={{ color: "var(--ink-faint)" }}>{good ? "Glad it helped — anything we should keep doing, or do better? (optional)" : "Sorry to hear that — want to tell us why? (optional)"}</span>
        <textarea value={comment} onChange={(e)=>setComment(e.target.value)} rows={2} maxLength={1000}
          placeholder={good ? "What worked well, or what would make it even better?" : "What would have made this more helpful?"}
          className="focus-ring w-full rounded-xl border px-3 py-2 text-[13px]"
          style={{ borderColor: "var(--border)", background: "var(--surface)", color: "var(--ink)" }} />
        <div className="flex items-center gap-3">
          <button onClick={()=>send(good ? "up" : "down", comment.trim() || null)}
            className="focus-ring rounded-full px-3.5 py-1.5 text-xs font-semibold" style={{ background: "var(--ink)", color: "white" }}>
            Send
          </button>
          <button onClick={()=>send(good ? "up" : "down", null)} className="focus-ring text-xs font-semibold" style={{ color: "var(--ink-faint)" }}>
            Skip
          </button>
        </div>
      </div>
    );
  }

  return (
    <div className="flex items-center gap-2.5 flex-wrap">
      <span className="text-[12.5px] font-medium" style={{ color: "var(--ink-faint)" }}>Did this feedback help?</span>
      <div className="flex items-center gap-1.5">
        <button onClick={()=>setShowCommentBox("up")} aria-label="Yes, this helped"
          className="focus-ring w-8 h-8 rounded-full grid place-items-center border" style={{ borderColor: "var(--border)", color: "var(--ink-soft)" }}>
          <IconThumbsUp size={14} strokeWidth={2.2} />
        </button>
        <button onClick={()=>setShowCommentBox("down")} aria-label="No, this didn't help"
          className="focus-ring w-8 h-8 rounded-full grid place-items-center border" style={{ borderColor: "var(--border)", color: "var(--ink-soft)" }}>
          <IconThumbsDown size={14} strokeWidth={2.2} />
        </button>
      </div>
    </div>
  );
}

// The higher-leverage signal: not "did you like this" but "what will you actually do
// with it" — a committed action, chosen from options drawn from this piece's own Grow.
// Renders the student's own submitted text with the AI's highlight quotes
// picked out inline (green = glow, burgundy = grow), plus a plain-language
// list below each one — so feedback that's otherwise just prose the student
// has to mentally map back onto their story is instead pinned directly to
// the words it's about.
// Premium full rewrite: shows the corrected story with every word that differs
// from the student's own text marked, so they can see exactly what changed
// (a fixed capital, a new full stop, a reworded phrase) instead of re-reading
// the whole thing against the original. A plain word-by-word diff (longest
// common subsequence); a very long text skips the marking rather than stall.
function diffWordsToParts(original, revised){
  const split = (s)=> String(s).split(/(\s+)/).filter(t => t !== "");
  const isSpace = (t)=> /^\s+$/.test(t);
  const bt = split(revised);
  const bw = bt.filter(t => !isSpace(t));
  const aw = split(original).filter(t => !isSpace(t));
  const n = aw.length, m = bw.length;
  const matched = new Array(m).fill(false);
  if (n * m <= 2500000) {
    const w = m + 1;
    const dp = new Int32Array((n + 1) * w);
    for (let i = n - 1; i >= 0; i--) {
      for (let j = m - 1; j >= 0; j--) {
        dp[i * w + j] = aw[i] === bw[j] ? dp[(i + 1) * w + j + 1] + 1 : Math.max(dp[(i + 1) * w + j], dp[i * w + j + 1]);
      }
    }
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (aw[i] === bw[j]) { matched[j] = true; i++; j++; }
      else if (dp[(i + 1) * w + j] >= dp[i * w + j + 1]) i++;
      else j++;
    }
  } else {
    matched.fill(true);
  }
  const items = [];
  let wi = 0;
  bt.forEach(t => { items.push(isSpace(t) ? { t, c: null } : { t, c: !matched[wi++] }); });
  items.forEach((it, k) => {
    if (it.c !== null) return;
    const prev = items[k - 1], next = items[k + 1];
    it.c = !!(prev && next && prev.c === true && next.c === true);
  });
  const runs = [];
  items.forEach(it => {
    const last = runs[runs.length - 1];
    if (last && last.c === it.c) last.t += it.t; else runs.push({ t: it.t, c: it.c });
  });
  return runs.map((r, k) => r.c
    ? <mark key={`dv${k}`} title="Changed from your original" className="rounded px-0.5" style={{ background: "var(--good)", color: "#fff" }}>{r.t}</mark>
    : <span key={`dv${k}`}>{r.t}</span>);
}

function AnnotatedText({ text, highlights, revisedStory }){
  const spans = useMemo(()=>{
    if (!text || !Array.isArray(highlights) || highlights.length === 0) return null;
    const lowerText = text.toLowerCase();
    const found = [];
    highlights.forEach((h, i)=>{
      if (!h?.quote) return;
      const idx = lowerText.indexOf(String(h.quote).toLowerCase());
      if (idx === -1) return; // defensive: shouldn't happen, server validates this, but never crash the UI over it
      found.push({ start: idx, end: idx + h.quote.length, type: h.type === "grow" ? "grow" : "glow", note: h.note, revision: h.revision, key: i });
    });
    found.sort((a,b)=> a.start - b.start);
    const nonOverlapping = [];
    let cursor = 0;
    found.forEach(f=>{ if (f.start >= cursor) { nonOverlapping.push(f); cursor = f.end; } });
    return nonOverlapping;
  }, [text, highlights]);

  // The actual whole-text rewrite the user asked for: not a note beside the
  // original sentence, the student's FULL story with every "grow" fragment
  // swapped for its revision in place, everything else untouched. Built by
  // walking the same non-overlapping spans used to highlight the original.
  // Rendered as parts (not a plain string) so each actually-changed piece
  // can be marked - otherwise the revised paragraph reads as a wall of text
  // and a reader has to re-diff it against the original by eye to see what
  // was even changed.
  const revisedParts = useMemo(()=>{
    // Premium: the whole piece, corrected and improved, marked word by word.
    if (typeof revisedStory === "string" && revisedStory.trim() && text) return diffWordsToParts(text, revisedStory.trim());
    if (!spans || spans.length === 0) return null;
    if (!spans.some(f => f.type === "grow" && f.revision)) return null;
    const out = [];
    let pos = 0;
    spans.forEach((f, i) => {
      if (f.start > pos) out.push(<span key={`rt${i}`}>{text.slice(pos, f.start)}</span>);
      if (f.type === "grow" && f.revision) {
        let piece = f.revision;
        // A "grow" quote sometimes excludes its own trailing punctuation
        // while the AI's revision supplies its own closing punctuation -
        // found live as a real "..double period.." glitch right at the
        // splice point (e.g. "...space.. This..."). Only trims when the
        // very next original character is ALSO sentence-ending punctuation,
        // so a legitimate "..." ellipsis elsewhere in the story is untouched.
        const nextChar = text[f.end];
        if (piece && /[.!?]/.test(piece[piece.length - 1]) && nextChar && /[.!?]/.test(nextChar)) {
          piece = piece.slice(0, -1);
        }
        out.push(
          <mark key={`rh${i}`} title="Changed from your original" className="rounded px-0.5" style={{ background: "var(--good)", color: "#fff" }}>
            {piece}
          </mark>
        );
      } else {
        // A "glow" fragment is copied as-is (nothing to fix), so it isn't
        // marked here - only the genuinely changed "grow" pieces are.
        out.push(<span key={`ro${i}`}>{text.slice(f.start, f.end)}</span>);
      }
      pos = f.end;
    });
    if (pos < text.length) out.push(<span key="rtail">{text.slice(pos)}</span>);
    return out;
  }, [text, spans, revisedStory]);

  if (!spans || spans.length === 0) {
    return <p className="whitespace-pre-wrap font-read text-[14.5px] leading-relaxed" style={{ color: "var(--ink)" }}>{text}</p>;
  }

  const parts = [];
  let pos = 0;
  spans.forEach((f, i)=>{
    if (f.start > pos) parts.push(<span key={`t${i}`}>{text.slice(pos, f.start)}</span>);
    const isGlow = f.type === "glow";
    parts.push(
      <mark key={`h${i}`} title={f.note} tabIndex={0}
        className="focus-ring rounded px-0.5 cursor-help"
        style={{ background: isGlow ? "var(--good-tint)" : "var(--bad-tint)", color: isGlow ? "var(--good)" : "var(--bad)", textDecoration: "underline", textDecorationStyle: "dotted", textUnderlineOffset: 2 }}>
        {text.slice(f.start, f.end)}
      </mark>
    );
    pos = f.end;
  });
  if (pos < text.length) parts.push(<span key="tail">{text.slice(pos)}</span>);

  return (
    <div>
      <p className="whitespace-pre-wrap font-read text-[14.5px] leading-relaxed" style={{ color: "var(--ink)" }}>{parts}</p>
      <div className="flex items-center gap-3 mt-3 text-[11px] font-semibold" style={{ color: "var(--ink-faint)" }}>
        <span className="inline-flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full" style={{ background: "var(--good)" }} />Glow</span>
        <span className="inline-flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full" style={{ background: "var(--bad)" }} />Grow</span>
      </div>
      <div className="flex flex-col gap-1.5 mt-3 pt-3 border-t" style={{ borderColor: "var(--border-soft)" }}>
        {spans.map((f, i)=>(
          <div key={i} className="text-[12.5px] leading-snug flex items-start gap-1.5">
            <span className="font-bold shrink-0" style={{ color: f.type === "glow" ? "var(--good)" : "var(--bad)" }}>{f.type === "glow" ? "✓" : "→"}</span>
            <span style={{ color: "var(--ink-soft)" }}><strong style={{ color: "var(--ink)" }}>&ldquo;{text.slice(f.start, f.end)}&rdquo;</strong> — {f.note}</span>
          </div>
        ))}
      </div>
      {revisedParts && (
        <div className="mt-4 pt-4 border-t rounded-b-xl -mx-5 sm:-mx-6 -mb-5 sm:-mb-6 px-5 sm:px-6 pb-5 sm:pb-6" style={{ borderColor: "var(--border-soft)", background: "var(--good-tint)" }}>
          <div className="flex items-center justify-between gap-2 mb-2 flex-wrap">
            <div className="flex items-center gap-1.5">
              <IconSparkle size={13} strokeWidth={2.4} style={{ color: "var(--good)" }} />
              <span className="text-[11px] font-bold uppercase tracking-wide" style={{ color: "var(--good)" }}>{typeof revisedStory === "string" && revisedStory.trim() ? "Your response, corrected and improved" : "Your response, revised"}</span>
            </div>
            <span className="inline-flex items-center gap-1 text-[11px] font-semibold" style={{ color: "var(--ink-faint)" }}>
              <mark className="rounded px-1" style={{ background: "var(--good)", color: "#fff" }}>highlighted</mark> = what changed
            </span>
          </div>
          <p className="whitespace-pre-wrap font-read text-[14.5px] leading-relaxed" style={{ color: "var(--ink)" }}>{revisedParts}</p>
        </div>
      )}
    </div>
  );
}

// The whole-piece score (see api/_lib/prompt.js's overallScoreClause) was
// being generated and validated server-side but never actually rendered
// anywhere on the feedback screen itself - only buried in the Dashboard's
// activity history list, so a parent/student reading their Key Takeaways
// right after submitting never saw it at all. Writing-only: a reading
// comprehension attempt already has its own natural score (X of Y
// questions correct), shown as the percentage circle in
// ReadingFeedbackPanel below.
function OverallScorePanel({ feedback }){
  const score = feedback?.overallScore;
  if (score == null) return null;
  const color = score >= 8 ? "var(--good)" : score >= 5 ? "var(--gold-ink)" : "var(--bad)";
  return (
    <div className="card p-5 sm:p-6 flex items-center gap-4" style={{ borderColor: color, borderWidth: 1.5 }}>
      <ScoreRing score={score} total={10} label="score" />
      <div className="min-w-0">
        <div className="flex items-center gap-1.5 mb-1">
          <IconAward size={14} strokeWidth={2.2} style={{ color }} />
          <h3 className="font-display font-bold text-sm" style={{ color: "var(--ink)" }}>Overall score</h3>
        </div>
        {feedback?.scoreReason && (
          <p className="text-[13.5px] leading-snug" style={{ color: "var(--ink-soft)" }}>{feedback.scoreReason}</p>
        )}
      </div>
    </div>
  );
}

function FeedbackPanel({ tier, gradeLabel, country, interest, confidence, motivation, seed, feedback, submissionId, session, backendLive, submittedText, onSeePlans, onPractise }){
  // Real feedback from a plan without the spelling check / overall score
  // simply doesn't contain them (the server never generates them - see
  // api/_lib/plans.js), so their absence, on feedback that exists at all, is
  // what tells us to show the upgrade card. Demo mode has no feedback object
  // and falls back to scripted content, so it shows neither panel nor card.
  const premiumSectionsLocked = !!feedback && feedback.overallScore == null && !Array.isArray(feedback.spellingGrammar);
  const interestLabel = (INTERESTS.find(i=>i.id===interest) || INTERESTS[0]).label;
  const curriculum = GRADE_DATA[country].curriculum;
  const opener = CONFIDENCE_OPENER[confidence] || "";

  // When connected to the backend, `feedback` is the real LLM response for THIS
  // submission's actual text. Otherwise fall back to the scripted demo content.
  const glow = feedback?.glow || `${opener}${PRAISE[tier](gradeLabel, curriculum)}`;
  const grow = feedback?.grow || growthTipFor(tier, interest, motivation, country, confidence);
  const vocabList = feedback?.vocab
    ? feedback.vocab.map(v=>[v.term, v.definition, v.example, v.trick, v.characteristics, v.nonExample])
    : vocabFor(interest, tier, country);

  return (
    <div className="animate-float-in grid lg:grid-cols-5 gap-4 items-start">
     <div className="lg:col-span-3 flex flex-col gap-4 min-w-0">
      <OverallScorePanel feedback={feedback} />

      {submittedText && feedback?.highlights && (
        <div className="card p-5 sm:p-6">
          <div className="flex items-center gap-2 mb-3">
            <div className="w-8 h-8 rounded-full grid place-items-center" style={{ background: "var(--navy-tint)", color: "var(--ink)" }}>
              <IconPen size={15} strokeWidth={2.2} />
            </div>
            <h3 className="font-display font-bold" style={{ color: "var(--ink)" }}>Your submission, annotated</h3>
          </div>
          <AnnotatedText text={submittedText} highlights={feedback.highlights} revisedStory={feedback.revisedStory} />

      )}

      <ResponsesPanel feedback={feedback} />
      <FrameworkTipPanel feedback={feedback} />
      <DevicesPanel feedback={feedback} />
     </div>
     <div className="lg:col-span-2 flex flex-col gap-4 min-w-0">
      <SpellingGrammarPanel feedback={feedback} />

      {premiumSectionsLocked && (
        <LockedFeature title="Spelling & grammar check and overall score are on Premium"
          blurb="Premium adds a dedicated spelling and grammar check for every piece, plus a whole-piece score out of 10 with the reason behind it."
          onSeePlans={onSeePlans} />
      )}

      <div className="card p-5 sm:p-6" style={{ borderColor: "var(--good)", borderWidth: 1.5 }}>
        <div className="flex items-center gap-2 mb-2">
          <div className="w-8 h-8 rounded-full grid place-items-center" style={{ background: "var(--good-tint)", color: "var(--good)" }}>
            <IconCheck size={16} strokeWidth={2.4} />
          </div>
          <h3 className="font-display font-bold" style={{ color: "var(--ink)" }}>Glows — what you did well</h3>
        </div>
        <p className="text-[15px] leading-relaxed font-read" style={{ color: "var(--ink)" }}>{glow}</p>
      </div>

      <div className="card p-5 sm:p-6" style={{ borderColor: "var(--cyan)", borderWidth: 1.5 }}>
        <div className="flex items-center justify-between gap-2 mb-2 flex-wrap">
          <div className="flex items-center gap-2">
            <div className="w-8 h-8 rounded-full grid place-items-center" style={{ background: "var(--cyan-tint)", color: "var(--cyan-ink)" }}>
              <IconTarget size={16} strokeWidth={2.2} />
            </div>
            <h3 className="font-display font-bold" style={{ color: "var(--ink)" }}>Grows — your next step</h3>
          </div>
          <span className="inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-[11px] font-semibold" style={{ background: "var(--cyan-tint)", color: "var(--cyan-ink)" }}>
            explained through {interestLabel}
          </span>
        </div>
        <p className="text-[15px] leading-relaxed font-read" style={{ color: "var(--ink)" }}>{grow}</p>
        <GrowNextBlock feedback={feedback} />
      </div>

      <ExamTechniquePanel feedback={feedback} />

      <Collapsible defaultOpen={true} borderColor="var(--border)" iconBg="var(--cyan-tint)" iconColor="var(--cyan-ink)"
        icon={<IconSparkle size={16} strokeWidth={2.2} />} title={`Vocabulary Upgrades — ${interestLabel} edition`}
        teaser={vocabList.map(([term])=>term).join(", ")}>
        <VocabList items={vocabList} />

      {onPractise && (
        <div className="card p-4 sm:p-5 flex items-center justify-between gap-3 flex-wrap">
          <div className="min-w-0">

            <div className="text-[13px]" style={{ color: "var(--ink-soft)" }}>Flashcards and a quick quiz, starting with the words you need most.</div>
          </div>
          <button onClick={onPractise} className="focus-ring inline-flex items-center gap-1.5 rounded-full px-4 py-2 text-sm font-bold shrink-0" style={{ background: "var(--cyan)", color: "white" }}>Practise words <IconArrowRight size={14} /></button>
        </div>
      )}
      <ThumbsFeedback context="writing feedback" session={session} submissionId={submissionId} backendLive={backendLive} />
     </div>
    </div>
  );
}

/* ---------------------------------------------------------------- */
/* Exam-technique report (Premium, ages 11+)                          */
/* ---------------------------------------------------------------- */
// Renders whatever api/submit.js actually returned. It is driven entirely
// by the presence of feedback.examTechnique rather than by the plan the
// client thinks it's on: the server decides whether this section is
// generated at all, so there is nothing here to unlock by editing the page.
const EXAM_BAND_META = {
  1: { word: "Emerging",   color: "var(--bad)" },
  2: { word: "Developing", color: "var(--gold-ink)" },
  3: { word: "Secure",     color: "var(--cyan-ink)" },
  4: { word: "Strong",     color: "var(--good)" },
};

// Collapsed by default when a submission has a lot going on (Exam
// technique + Framework spotlight + Vocabulary all at once used to stack as
// 3 full-weight cards regardless of how many the student already had open,
// which is what made the feedback screen feel like an undifferentiated
// wall of boxes) - the student/parent controls what stays open, and each
// header always shows a one-line teaser so a collapsed section still
// visibly "does something" rather than looking like it vanished.
function Collapsible({ icon, iconBg, iconColor, title, teaser, borderColor, defaultOpen, staticOpen, children }){
  const [openState, setOpen] = useState(defaultOpen);
  // staticOpen: a page whose whole content IS this card (Manage profile) has
  // no reason to let the header collapse it away - always open, no toggle.
  const open = staticOpen || openState;
  if (staticOpen) {
    return (
      <div className="card p-5 sm:p-6" style={{ borderColor, borderWidth: 1.5 }}>
        <div className="flex items-center gap-2">
          <div className="w-8 h-8 rounded-full grid place-items-center shrink-0" style={{ background: iconBg, color: iconColor }}>{icon}</div>
          <h3 className="font-display font-bold" style={{ color: "var(--ink)" }}>{title}</h3>
        </div>
        <div className="mt-3">{children}</div>
      </div>
    );
  }
  return (
    <div className="card p-5 sm:p-6" style={{ borderColor, borderWidth: 1.5 }}>
      <button onClick={()=>setOpen(o=>!o)} className="focus-ring w-full flex items-center gap-2 text-left" aria-expanded={open}>
        <div className="w-8 h-8 rounded-full grid place-items-center shrink-0" style={{ background: iconBg, color: iconColor }}>
          {icon}
        </div>
        <div className="flex-1 min-w-0">
          <h3 className="font-display font-bold" style={{ color: "var(--ink)" }}>{title}</h3>
          {!open && teaser && <p className="text-[12px] truncate" style={{ color: "var(--ink-faint)" }}>{teaser}</p>}
        </div>
        <IconChevron size={16} strokeWidth={2.2} style={{ color: "var(--ink-faint)", transform: open ? "rotate(180deg)" : "none", transition: "transform 150ms", flexShrink: 0 }} />
      </button>
      {open && <div className="mt-3">{children}</div>}
    </div>
  );
}

function ExamTechniquePanel({ feedback }){
  const rows = Array.isArray(feedback?.examTechnique) ? feedback.examTechnique : null;
  if (!rows || rows.length === 0) return null;
  return (
    <Collapsible defaultOpen={true} borderColor="var(--gold)" iconBg="var(--gold-tint)" iconColor="var(--gold-ink)"
      icon={<IconGrad size={16} strokeWidth={2.2} />} title="Exam-technique scoring"
      teaser={feedback.examSummary || `${rows.length} objective${rows.length === 1 ? "" : "s"} scored`}>
      <p className="text-[12.5px] mb-4" style={{ color: "var(--ink-faint)" }}>
        Banded against the assessment objectives published for this year group. Bands, not marks — a single piece can't be graded like a moderated exam paper.
      </p>
      <div className="flex flex-col gap-3">
        {rows.map((r, i)=>{
          const band = EXAM_BAND_META[r.band] || EXAM_BAND_META[1];
          return (
            <div key={i} className="rounded-xl p-3.5" style={{ background: "var(--surface-2)" }}>
              <div className="flex items-start justify-between gap-3 flex-wrap">

      {Array.isArray(feedback.examNotBanded) && feedback.examNotBanded.length > 0 && (
        <p className="text-[12.5px] mt-3" style={{ color: "var(--ink-faint)" }}>
          Not banded here: {feedback.examNotBanded.join("; ")}. {feedback.examNotBanded.length === 1 ? "That is a" : "Those are"} {feedback.examNotBandedWhy || "skills this task cannot show"}.

function SpellingGrammarPanel({ feedback }){

  // The model's honest count of the TRUE total, which can be higher than

  // errors than are visibly listed right below it.
  const total = Number.isInteger(feedback?.spellingGrammarTotal) ? feedback.spellingGrammarTotal : items.length;

  return (
    <Collapsible defaultOpen={!clean} borderColor="var(--border)"
