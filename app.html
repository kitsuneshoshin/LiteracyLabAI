// Splits a response into plain runs and runs labelled with a framework part, in the order
// they occur. Labels whose text cannot be found (or that overlap an earlier one) are skipped,
// so a bad label can never garble the response.
function labelledRuns(text, labels){
  const body = String(text || "");
  const found = [];
  (Array.isArray(labels) ? labels : []).forEach((l)=>{
    if (!l || typeof l.text !== "string" || !l.text) return;
    const at = body.indexOf(l.text);
    if (at === -1) return;
    found.push({ at, end: at + l.text.length, part: l.part, note: l.note, text: l.text });
  });
  found.sort((a,b)=> a.at - b.at);
  const runs = [];
  let pos = 0;
  found.forEach((f)=>{
    if (f.at < pos) return;
    if (f.at > pos) runs.push({ text: body.slice(pos, f.at) });
    runs.push(f);
    pos = f.end;
  });
  if (pos < body.length) runs.push({ text: body.slice(pos) });
  return runs;
}

const FRAMEWORK_PART_COLORS = [
  ["var(--cyan-tint)", "var(--cyan-ink)"],
  ["var(--gold-tint)", "var(--gold-ink)"],
  ["var(--good-tint)", "var(--good)"],
  ["var(--navy-tint)", "var(--ink)"],
  ["var(--surface-2)", "var(--ink-soft)"],
];

// A response with every use of the framework marked: the part's name, the exact words that
// do that job, and one sentence on how they do it.
function LabelledResponse({ text, labels, parts }){
  const colorOf = (name)=> FRAMEWORK_PART_COLORS[Math.max(0, parts.findIndex(p=>p.name===name)) % FRAMEWORK_PART_COLORS.length];
  const runs = labelledRuns(text, labels);
  return (
    <div className="flex flex-col gap-2">
      {runs.map((r, i)=> r.part ? (
        <div key={i} className="rounded-xl p-3" style={{ background: colorOf(r.part)[0], borderLeft: "4px solid " + colorOf(r.part)[1] }}>
          <span className="inline-block rounded-full px-2 py-0.5 text-[11px] font-bold mb-1.5" style={{ background: "var(--surface)", color: colorOf(r.part)[1], border: "1px solid " + colorOf(r.part)[1] }}>{r.part}</span>
          <p className="whitespace-pre-wrap font-read text-[14px] leading-relaxed" style={{ color: "var(--ink)" }}>{r.text}</p>
          {r.note && <p className="text-[12.5px] mt-1.5" style={{ color: "var(--ink-soft)" }}><span className="font-semibold">How it works: </span>{r.note}</p>}
        </div>
      ) : (
        r.text.trim() ? <p key={i} className="whitespace-pre-wrap font-read text-[14px] leading-relaxed px-1" style={{ color: "var(--ink-soft)" }}>{r.text.trim()}</p> : null
      ))}
    </div>
  );
}

// Premium: the framework (PEEL, PEAL, Story Mountain, Show Don't Tell) shown at work in the
// student's own revised response and in a model response written to the same task, so they can
// see exactly where each part is and then compare. Rendered only when the server returned it.
function ResponsesPanel({ feedback }){
  const info = feedback?.frameworkInfo;
  const model = feedback?.modelResponse;
  const parts = Array.isArray(info?.parts) ? info.parts : [];
  if (!info?.name || !model || parts.length === 0) return null;
  const revisedLabels = Array.isArray(feedback.revisedFramework) ? feedback.revisedFramework : [];
  const hasRevised = typeof feedback.revisedStory === "string" && feedback.revisedStory.trim() && revisedLabels.length > 0;
  const used = new Set(revisedLabels.map(l=>l.part));
  const missing = parts.filter(p=>!used.has(p.name));
  return (
    <Collapsible defaultOpen={true} borderColor="var(--navy)" iconBg="var(--navy-tint)" iconColor="var(--ink)"
      icon={<IconGrid size={15} strokeWidth={2.2} />} title={`See ${info.name} at work`}
      teaser="In your response, and in a model response">
      <p className="text-[13px] mb-3" style={{ color: "var(--ink-faint)" }}>{info.description}</p>
      <div className="flex flex-wrap gap-1.5 mb-4">
        {parts.map((pt, i)=>(
          <span key={pt.name} title={pt.meaning} className="inline-flex items-center gap-1 rounded-full px-2.5 py-0.5 text-[11.5px] font-semibold"
            style={{ background: FRAMEWORK_PART_COLORS[i % FRAMEWORK_PART_COLORS.length][0], color: FRAMEWORK_PART_COLORS[i % FRAMEWORK_PART_COLORS.length][1] }}>
            {pt.name}<span className="font-normal" style={{ color: "var(--ink-soft)" }}> · {pt.meaning}</span>
          </span>
        ))}
      </div>
      {hasRevised && (
        <div className="mb-5">
          <div className="font-display font-bold text-[12px] mb-2" style={{ color: "var(--ink-faint)" }}>IN YOUR RESPONSE (corrected and improved)</div>
          <LabelledResponse text={feedback.revisedStory} labels={revisedLabels} parts={parts} />
          {missing.length > 0 && (
            <p className="text-[12.5px] mt-2" style={{ color: "var(--ink-soft)" }}>
              <span className="font-semibold" style={{ color: "var(--ink)" }}>Not in your response yet: </span>{missing.map(m=>m.name).join(", ")}. Add {missing.length === 1 ? "it" : "them"} next time and compare with the model below.
            </p>
          )}
        </div>
      )}
      <div>
        <div className="font-display font-bold text-[12px] mb-2" style={{ color: "var(--ink-faint)" }}>A MODEL RESPONSE TO THE SAME TASK</div>
        <LabelledResponse text={model} labels={feedback.modelFramework} parts={parts} />
        <p className="text-[12px] mt-2" style={{ color: "var(--ink-faint)" }}>Written by the AI as an example of a strong answer at your level. Use it to learn from, not to copy.</p>
      </div>
    </Collapsible>
  );
}

// One card per question after a graded reading attempt: what they chose, the
// right answer, and a short explanation pointing back into the passage. The
// single Glow and single Grow for a whole attempt used to be ALL the feedback
// a reader got, which at 1 right out of 5 was very little to learn from.
// Answers are already graded and revealed by the time this renders, so
// explaining the correct one gives nothing away. Driven by
// feedback.questionReview; entries the model omitted just show the result
// without an explanation.
function QuestionReviewPanel({ feedback, questions, answers }){
  const review = Array.isArray(feedback?.questionReview) ? feedback.questionReview : null;
  if (!review || review.length === 0 || !Array.isArray(questions) || questions.length === 0) return null;
  const byNumber = new Map(review.map(r => [r.n, r]));
  const rightCount = questions.filter((q, i) => qIsRight(q, answers?.[i])).length;
  const autoTotal = qAutoCount(questions);
  const marked = feedback?.shortAnswer && typeof feedback.shortAnswer === "object" ? feedback.shortAnswer : null;
  return (
    <Collapsible defaultOpen={true} borderColor="var(--border)" iconBg="var(--good-tint)" iconColor="var(--good)"
      icon={<IconBookOpenCheck size={16} strokeWidth={2.2} />} title="Question by question"
      teaser={`${rightCount} of ${autoTotal} right`}>
      <div className="flex flex-col gap-3">
        {questions.map((q, i) => {
          const r = byNumber.get(i + 1);
          const chosen = answers?.[i];
          const isRight = qIsRight(q, chosen);
          if (!qIsAuto(q)) {
            const full = marked && marked.awarded === marked.outOf;
            return (
              <div key={i} className="rounded-xl p-3.5" style={{ background: "var(--surface-2)" }}>
                <div className="flex items-start justify-between gap-2 flex-wrap">
                  <div className="text-[11px] font-bold uppercase tracking-wide" style={{ color: "var(--ink-faint)" }}>{Q_STYLE_NAME.short}</div>
                  {marked && Number.isInteger(marked.awarded) && (
                    <span className="inline-flex items-center rounded-full px-2.5 py-0.5 text-[12px] font-bold" style={{ background: "var(--surface)", color: full ? "var(--good)" : "var(--gold-ink)", border: "1px solid " + (full ? "var(--good)" : "var(--gold)") }}>
                      {marked.awarded} / {marked.outOf} marks
                    </span>
                  )}
                </div>
                <div className="text-[13.5px] font-semibold mt-1" style={{ color: "var(--ink)" }}>{i + 1}. {q.q}</div>
                <div className="text-[13px] mt-1 font-read" style={{ color: "var(--ink-soft)" }}>
                  You wrote: <strong style={{ color: "var(--ink)", fontWeight: 600 }}>{qAnswerText(q, chosen)}</strong>
                </div>
                {marked?.comment && <p className="text-[13.5px] leading-snug mt-1.5 font-read" style={{ color: "var(--ink)" }}>{marked.comment}</p>}
                {marked && Array.isArray(marked.hit) && marked.hit.length > 0 && (
                  <p className="text-[12.5px] mt-1.5" style={{ color: "var(--good)" }}><span className="font-semibold">You made these points: </span>{marked.hit.join("; ")}</p>
                )}
                {marked && Array.isArray(marked.missed) && marked.missed.length > 0 && (
                  <p className="text-[12.5px] mt-1" style={{ color: "var(--ink-soft)" }}><span className="font-semibold">To earn more marks: </span>{marked.missed.join("; ")}</p>
                )}
                {marked && Array.isArray(marked.parts) && marked.parts.length > 0 && (
                  <div className="mt-1.5 flex flex-wrap items-center gap-1.5" aria-label={(qFwName(q) || "Answer") + " parts used"}>
                    <span className="text-[11px] font-bold uppercase tracking-wide" style={{ color: "var(--ink-faint)" }}>{qFwName(q) || "Parts"}</span>
                    {marked.parts.map((pt) => (
                      <span key={pt.name} className="inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-[11.5px] font-semibold" style={{ background: pt.used ? "var(--good-tint)" : "var(--surface)", color: pt.used ? "var(--good)" : "var(--ink-faint)", border: "1px solid " + (pt.used ? "var(--good)" : "var(--border)") }}>
                        {pt.used ? <IconCheck size={11} strokeWidth={3} /> : <span aria-hidden="true">○</span>}{pt.name}
                      </span>
                    ))}
                  </div>
                )}
                {!marked && <p className="text-[12.5px] mt-1.5" style={{ color: "var(--ink-faint)" }}>We could not mark this one this time, so compare it with the model answer below.</p>}
                {q.modelAnswer && (
                  <div className="mt-2 rounded-lg p-2.5" style={{ background: "var(--good-tint)" }}>
                    <div className="text-[11px] font-bold uppercase tracking-wide" style={{ color: "var(--good)" }}>A strong answer{qFwName(q) ? ", built with " + qFwName(q) : ""}</div>
                    {Array.isArray(q.modelParts) && q.modelParts.length > 0 ? (
                      <p className="text-[13.5px] leading-relaxed mt-1 font-read" style={{ color: "var(--ink)" }}>
                        {q.modelParts.map((m, k) => (
                          <span key={k}>
                            <span className="inline-block rounded px-1 mr-1 align-baseline text-[10.5px] font-bold uppercase tracking-wide" style={{ background: "var(--surface)", color: "var(--good)" }}>{m.part}</span>{m.text}{" "}
                          </span>
                        ))}
                      </p>
                    ) : (
                      <p className="text-[13.5px] leading-snug mt-0.5 font-read" style={{ color: "var(--ink)" }}>{q.modelAnswer}</p>

                )}
              </div>

          }
          return (
            <div key={i} className="rounded-xl p-3.5" style={{ background: "var(--surface-2)" }}>
              <div className="flex items-start gap-2">
                <span className="mt-0.5 shrink-0" style={{ color: isRight ? "var(--good)" : "var(--bad)" }}>
                  {isRight ? <IconCheck size={15} strokeWidth={2.6} /> : <IconX size={15} strokeWidth={2.6} />}
                </span>
                <div className="min-w-0">
                  <div className="text-[11px] font-bold uppercase tracking-wide" style={{ color: "var(--ink-faint)" }}>{Q_STYLE_NAME[qStyle(q)] || Q_STYLE_NAME.mc}</div>
                  <div className="text-[13.5px] font-semibold" style={{ color: "var(--ink)" }}>{i + 1}. {qStyle(q) === "cloze" ? q.text : q.q}</div>
                  <div className="text-[13px] mt-1" style={{ color: "var(--ink-soft)" }}>
                    You chose: <strong style={{ color: "var(--ink)" }}>{qAnswerText(q, chosen)}</strong>
                  </div>
                  {!isRight && q.correct != null && qCorrectText(q) && (
                    <div className="text-[13px]" style={{ color: "var(--ink-soft)" }}>
                      Right answer: <strong style={{ color: "var(--good)" }}>{qCorrectText(q)}</strong>
                    </div>
                  )}
                  {r?.explanation && <p className="text-[13.5px] leading-snug mt-1.5 font-read" style={{ color: "var(--ink)" }}>{r.explanation}</p>}
                  {r?.evidence && (
                    <p className="text-[12.5px] leading-snug mt-1.5 font-read" style={{ color: "var(--ink-faint)" }}>
                      From the passage: “{r.evidence}”
                    </p>
                  )}
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </Collapsible>
  );
}

// The score as a ring: a quick read of "how did I do" before any text.
function ScoreRing({ score, total, size = 92, label = "correct" }){
  const pct = total > 0 ? score / total : 0;
  const color = pct >= 0.8 ? "var(--good)" : pct >= 0.5 ? "var(--gold-ink)" : "var(--bad)";
  const r = (size - 12) / 2, c = 2 * Math.PI * r;
  return (
    <div className="relative shrink-0" style={{ width: size, height: size }} role="img" aria-label={score + " out of " + total + " correct"}>
      <svg width={size} height={size} viewBox={"0 0 " + size + " " + size}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--border)" strokeWidth="9" />
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth="9" strokeLinecap="round"
          strokeDasharray={c} strokeDashoffset={c * (1 - pct)} transform={"rotate(-90 " + size/2 + " " + size/2 + ")"} />
      </svg>
      <div className="absolute inset-0 grid place-items-center text-center leading-none">
        <div><div className="font-display font-extrabold text-2xl tabular" style={{ color: "var(--ink)" }}>{score}<span className="text-sm font-bold" style={{ color: "var(--ink-faint)" }}>/{total}</span></div>
        <div className="text-[10px] font-bold uppercase tracking-wide mt-1" style={{ color: "var(--ink-faint)" }}>{label}</div></div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------- */
/* Student Workspace                                                  */
/* ---------------------------------------------------------------- */
function Workspace({ country, gradeIdx, setGradeIdx, tier, setTierOverride, interests, confidenceWriting, confidenceReading, motivation, used, total, onSubmit, session, backendLive, childId, children_, onSwitchChild, onMakeUsable, activeChangeAvailableAt, onSeePlans, displayName }){
  const grades = GRADE_DATA[country].grades;
  const gradeLabel = grades[gradeIdx];
  const [exerciseType, setExerciseType] = useState("writing"); // writing | reading | vocab
  const [text, setText] = useState(()=> (backendLive ? "" : PROMPTS[tier].sample));
  const [answers, setAnswers] = useState({});
  const [readingScore, setReadingScore] = useState(0);
  const [phase, setPhase] = useState("draft"); // draft | analyzing | done
  // Live testing found this defaulting to the literal id "exam" ("College /
  // Exam Prep") whenever a child had no interests selected yet, regardless
  // of age tier — INTERESTS_BY_TIER doesn't even offer that option below
  // "high", so a parent who skipped the interest picker during onboarding
  // got every piece of feedback for their 7-year-old framed around exam
  // prep. Falls back to the first tier-appropriate interest instead.
  const [activeInterest, setActiveInterest] = useState(()=> interests[0] || interestsForTier(tier)[0]?.id || "space");
  const [backendFeedback, setBackendFeedback] = useState(null); // real LLM output, when connected
  const [submissionId, setSubmissionId] = useState(null);
  const [submitError, setSubmitError] = useState(null);
  const [readingPassageIdx, setReadingPassageIdx] = useState(()=> pickPassageIndex(tier)); // demo mode only
  const [readingPassage, setReadingPassage] = useState(null); // backendLive: AI-generated {submissionId, title, skill, passage, questions}
  const [readingLoading, setReadingLoading] = useState(false);
  const [writingPrompt, setWritingPrompt] = useState(null); // backendLive: AI-generated {submissionId, title, prompt}
  const [writingLoading, setWritingLoading] = useState(false);
  const timerRef = useRef(null);
  // Each writing-prompt/reading-passage generation is billable (see
  // api/writing-prompt.js and api/reading-passage.js) - it inserts a
  // submissions row the moment it's generated, not when the student
  // eventually submits. Without caching one pending (not-yet-submitted)
  // generation per tier here, merely clicking through the tier tabs or the
  // Writing/Reading toggle would silently burn a real usage credit on every
  // click, since that switch re-runs the effect below. Cleared for a tier
  // once that submission is actually completed (it can't be reused after
  // that - submitting again 409s) or when "New Story"/"New Passage" is
  // tapped explicitly, which is a genuine, intentional new credit spend.
  const pendingWritingRef = useRef({});
  const pendingReadingRef = useRef({});
  const locked = used >= total;
  const [bannerDismissed, setBannerDismissed] = useState(false);

  const meta = backendLive
    ? (writingPrompt ? { ...writingLimitsFor(country, gradeIdx), title: writingPrompt.title, prompt: writingPrompt.prompt } : null)
    : PROMPTS[tier];

  // Generates a brand-new writing prompt. In demo mode the prompt is static
  // (PROMPTS[tier]); with a live backend it calls the AI for an original one
  // tailored to tier/country/interest, consuming this account's usage
  // credit up front — same reasoning and pattern as requestNewPassage below,
  // so a returning student doesn't see the same prompt every session.
  const cacheKey = `${childId}:${tier}`; // scoped per learner too, not just tier - a sibling's cached prompt must never leak into another child's tab

  // Tracks which exercise is actually on screen right now, kept fresh every
  // render - handleSubmit reads this AFTER its await to tell a genuinely
  // finished grading call apart from one whose exercise the student has
  // since left (switched tier, switched child, or flipped the Writing/
  // Reading toggle while the AI call was still in flight). Found live via
  // Sentry: a stale "done" landing after the student moved on left
  // phase="done" pointed at a readingPassage that the effect above had
  // already nulled out for the new context, crashing ReadingExercise on
  // `bank.skill` reading off null.
  const liveContextRef = useRef(null);
  useEffect(()=>{ liveContextRef.current = `${exerciseType}:${cacheKey}`; });

  // A learner can pick several interests, but every piece is explained
  // through ONE (the Grow's analogy, vocab examples). It used to be whichever
  // came first in the saved list, every time, so the others never appeared.
  // Now each NEW piece rotates: a random one of the learner's interests that
  // suit this age tier, never the same as the previous piece (remembered per
  // learner across reloads). The choice is made once, when the piece is
  // generated, and travels with it - the server stores it on the submission
  // and uses that same interest when the feedback is written.
  function chooseInterestForNewPiece(){
    const validForTier = interestsForTier(tier).map(i=>i.id);
    let last = null;
    try { last = localStorage.getItem("ll_last_interest_" + childId); } catch {}
    const chosen = pickInterestForNewPiece({ interests, validForTier, last, fallback: activeInterest });
    try { localStorage.setItem("ll_last_interest_" + childId, chosen); } catch {}
    setActiveInterest(chosen);
    return chosen;
  }

  async function requestNewWritingPrompt(force){
    if (!backendLive || locked) return;
    if (!force && pendingWritingRef.current[cacheKey]) {
      // Already have an ungraded prompt for this tier from earlier in the
      // session (e.g. the student tabbed away and back) - reuse it instead
      // of spending another credit on a prompt they haven't answered yet.
      setWritingPrompt(pendingWritingRef.current[cacheKey]);
      return;
    }
    setWritingLoading(true);
    setWritingPrompt(null);
    setSubmitError(null);
    const interestForPiece = chooseInterestForNewPiece();
    try {
      const result = await authedFetch(session, "/api/writing-prompt", {
        method: "POST",
        body: JSON.stringify({ tier, country, gradeLabel, interest: interestForPiece, childId }),
      });
      const fresh = { submissionId: result.submissionId, title: result.title, prompt: result.prompt, interest: interestForPiece };
      pendingWritingRef.current[cacheKey] = fresh;
      setWritingPrompt(fresh);
      onSubmit(result.usage);
    } catch (err) {
      setSubmitError(err.payload?.error || err.message || "Couldn't generate a writing prompt. Please try again.");
    } finally {
      setWritingLoading(false);
    }
  }

  // Generates a brand-new reading passage. In demo mode this just rerolls
  // the local static bank; with a live backend it calls the AI to write an
  // original one (consuming this account's usage credit up front — see
  // api/reading-passage.js) so no student ever sees the same passage twice.
  async function requestNewPassage(force){
    if (!backendLive) { setReadingPassageIdx(pickPassageIndex(tier)); return; }
    if (locked) return;
    if (!force && pendingReadingRef.current[cacheKey]) {
      // Same reasoning as requestNewWritingPrompt above - reuse an ungraded
      // passage for this tier instead of re-billing a credit for it.
      setReadingPassage(pendingReadingRef.current[cacheKey]);
      return;
    }
    setReadingLoading(true);
    setReadingPassage(null);
    setSubmitError(null);
    const interestForPiece = chooseInterestForNewPiece();
    try {
      const result = await authedFetch(session, "/api/reading-passage", {
        method: "POST",
        body: JSON.stringify({ tier, country, gradeLabel, interest: interestForPiece, childId }),
      });
      const fresh = { submissionId: result.submissionId, title: result.title, skill: result.skill, passage: result.passage, questions: result.questions, textType: result.textType, interest: interestForPiece };
      pendingReadingRef.current[cacheKey] = fresh;
      setReadingPassage(fresh);
      onSubmit(result.usage);
    } catch (err) {
      setSubmitError(err.payload?.error || err.message || "Couldn't generate a reading passage. Please try again.");
    } finally {
      setReadingLoading(false);
    }
  }

  useEffect(()=>{
    setAnswers({}); setPhase("draft"); setBackendFeedback(null); setSubmissionId(null); setSubmitError(null);
    if (exerciseType === "writing") {
      if (backendLive) {
        setText("");
        // Live testing surfaced a real billing bug here: this effect used to
        // call requestNewWritingPrompt()/requestNewPassage() unconditionally,
        // and both bill a usage credit the instant they're called (see
        // api/writing-prompt.js, api/reading-passage.js) - so every age-tier
        // tab click and every Writing/Reading toggle silently spent a
        // credit, and a curious student could burn their entire monthly
        // quota without ever writing a word. An in-memory "already
        // generated this tier" cache alone isn't enough to fix it either,
        // because Workspace fully remounts (losing that cache) every time
        // the student visits the Dashboard and comes back. So generation is
        // now NEVER automatic: this only restores an already-cached ungraded
        // prompt for free (below), and otherwise leaves it to the explicit
        // "Get my prompt" button in the render, so spending a credit always
        // requires a deliberate tap, on first visit or any later one.
        const cached = pendingWritingRef.current[cacheKey];
        setWritingPrompt(cached || null);
      } else setText(PROMPTS[tier].sample);
    } else if (exerciseType === "reading") {
      if (backendLive) {
        setReadingPassage(pendingReadingRef.current[cacheKey] || null);
      } else {
        requestNewPassage(); // demo mode: free, just rerolls the local static bank
      }
    }
  }, [tier, exerciseType, childId]);
  useEffect(()=>{
    // Keeps activeInterest valid as either the child's selected interests or
    // the tier itself changes (e.g. tabbing from High School, where "exam"
    // is valid, down to Elementary, where it isn't offered at all).
    const validForTier = interestsForTier(tier).map(i=>i.id);
    if (interests.length) {
      if (!interests.includes(activeInterest)) {
        setActiveInterest(interests.find(id=>validForTier.includes(id)) || interests[0]);
      }
    } else if (!validForTier.includes(activeInterest)) {
      setActiveInterest(validForTier[0] || "space");
    }
  }, [interests, tier]);
  useEffect(()=> ()=> clearTimeout(timerRef.current), []);

  const words = useMemo(()=> text.trim().length ? text.trim().split(/\s+/).length : 0, [text]);
  const readingBankEntry = backendLive ? readingPassage : READING_BANK[tier][readingPassageIdx];
  // The interest THIS piece was generated with (not whatever is selected
  // now - a cached, still-ungraded piece can outlive a later rotation).
  const feedbackInterest = (exerciseType === "writing" ? writingPrompt?.interest : readingPassage?.interest) || activeInterest;
  const readingQuestions = readingBankEntry ? readingBankEntry.questions : [];
  const allAnswered = readingQuestions.length > 0 && readingQuestions.every((q,i)=> !qIsAuto(q) || qIsAnswered(q, answers[i]));

  async function handleSubmit(){
    if (locked || phase === "analyzing") return;
    setSubmitError(null);
    setPhase("analyzing");
    // Captured now, compared against liveContextRef's latest value once the
    // AI call below resolves - see that ref's comment for why.
    const submittedContext = `${exerciseType}:${cacheKey}`;

    if (!backendLive) {
      // Demo mode: no account connected, so this simulates the flow with scripted content.
      // Same stale-context guard as the real submit path below, since a
      // demo user can just as easily switch tier/child/exercise during
      // this 2s delay.
      timerRef.current = setTimeout(()=>{
        if (liveContextRef.current !== submittedContext) return;
        if (exerciseType === "reading") {
          const score = readingQuestions.reduce((n,q,i)=> n + (qIsRight(q, answers[i]) ? 1 : 0), 0);
          setReadingScore(score);
        }
        setPhase("done");
        onSubmit();
      }, 2000);
      return;
    }

    try {
      const payload = exerciseType === "writing"
        ? { kind: "writing", confidenceWriting, motivation, submissionId: writingPrompt.submissionId, text }
        : { kind: "reading", confidenceReading, motivation, submissionId: readingBankEntry.submissionId, answers: readingQuestions.map((_,i)=> answers[i] ?? null) };
      const result = await authedFetch(session, "/api/submit", { method: "POST", body: JSON.stringify(payload) });
      // This tier's pending generation is now used up (resubmitting it would
      // 409) - drop it from the cache so tabbing back to this tier later
      // fetches a genuinely new one instead of reusing the completed one.
      // Uses the captured cacheKey (this submission's own), not whatever
      // tier/child is live now, so this cleanup is correct either way.
      if (exerciseType === "writing") delete pendingWritingRef.current[cacheKey];
      else delete pendingReadingRef.current[cacheKey];
      onSubmit(result.usage);
      if (window.llTrack) {
        window.llTrack("submission_complete", { kind: exerciseType, tier });
        // The first ever completed piece on this browser - the moment someone becomes an active user.
        try {
          if (!localStorage.getItem("ll_first_submission")) {
            localStorage.setItem("ll_first_submission", "1");
            window.llTrack("first_submission", { kind: exerciseType, tier });
          }
        } catch (e) {}
      }
      // The student has since switched tier, child, or exercise type -
      // applying this result now would show reading/writing feedback for an
      // exercise no longer on screen, or (for reading) crash outright since
      // the effect that runs on that switch already nulled readingPassage
      // for the new context. The credit was still spent (onSubmit above
      // already reported it) - only the now-irrelevant UI update is skipped.
      if (liveContextRef.current !== submittedContext) return;
      setBackendFeedback(result.feedback);
      setSubmissionId(result.submissionId);
      if (exerciseType === "reading") {
        setReadingScore(result.score);
        // The answer key was withheld when the passage was generated so it
        // never sat in a network response before grading — now that grading
        // is done, merge it back in so the UI can highlight right/wrong.
        setReadingPassage(prev => prev ? { ...prev, questions: result.questions } : prev);
      }
      setPhase("done");
    } catch (err) {
      // Same reasoning as the success path above - don't surface an error
      // banner for a request the student isn't looking at anymore. setPhase
      // is left unconditional as a harmless safety net: it's a no-op if the
      // switch away already reset it, and self-heals it if not.
      if (liveContextRef.current === submittedContext) {
        setSubmitError(err.payload?.error || err.message || "Something went wrong generating feedback. Please try again.");
      }
      setPhase("draft");
    }
  }
  function handleNew(){
    setText("");
    setAnswers({});
    setPhase("draft");
    setBackendFeedback(null);
    setSubmissionId(null);
    if (exerciseType === "reading") requestNewPassage(true);
    else if (backendLive) requestNewWritingPrompt(true);
  }

  return (

function WordMeter({ words, target, chars, maxChars }){
  const pct = Math.min(100, Math.round((words/target)*100));
  const charPct = maxChars ? chars / maxChars : 0;
  const nearCap = charPct >= 0.9;
  return (
    <div className="flex flex-col gap-1">
      <div className="flex items-center gap-2.5">
        <Tooltip text="The word target is a goal, not a limit - writing past it is fine and won't block submitting. It's set for this exact country and grade/year, anchored to real curriculum/exam guidance where one exists.">
          <div className="h-1.5 w-24 rounded-full cursor-help" style={{ background: "var(--surface-2)" }}>
            <div className="h-1.5 rounded-full transition-all" style={{ width: pct + "%", background: pct >= 100 ? "var(--good)" : "var(--cyan)" }} />
          </div>
        </Tooltip>
        <span className="text-xs font-semibold tabular whitespace-nowrap" style={{ color: "var(--ink-soft)" }}>{words} / {target} words</span>
      </div>
      {maxChars != null && (
        <Tooltip text="This IS a hard limit - typing stops here. It's derived from the word target above using a words-to-characters ratio, so it scales with the same real curriculum guidance rather than being a flat number for every age.">
          <span className="text-[11px] tabular cursor-help" style={{ color: nearCap ? "var(--bad)" : "var(--ink-faint)" }}>
            {chars.toLocaleString()} / {maxChars.toLocaleString()} characters{nearCap ? " — approaching limit" : ""}
          </span>
        </Tooltip>
      )}
    </div>
  );
}

const NEW_LABEL_BY_TIER = { early: "New Story", elementary: "New Mission", middle: "New response", high: "New essay" };

function SubmissionRecap({ tier, title, words, onNew }){

// ---- Reading question styles. These mirror api/_lib/questionTypes.js (keep both in step): a question
// is multiple choice, true/false/not given, "which line proves it", put in order, match words to
// meanings, or fill the gap. An answer is a number, or a list of numbers for order, match and gap.
const qStyle = (q) => (q && q.type) || "mc";
// Before marking the page holds the question as sent to the browser (framework is an object with its steps); after
// marking it holds the stored question (framework is just the name). Either way, this is the name.
const qFwName = (q) => (q && q.framework ? (typeof q.framework === "string" ? q.framework : q.framework.name || "") : "");
const qIsAnswered = (q, a) => {
  const st = qStyle(q);
  if (st === "short") return typeof a === "string" && a.trim().length >= 2;
  if (st === "order" || st === "match") return Array.isArray(a) && a.length === (q.items || []).length && a.every(Number.isInteger);
  if (st === "cloze") return Array.isArray(a) && a.length === (q.blanks || []).length && a.every(Number.isInteger);
  return Number.isInteger(a);
};
const qIsRight = (q, a) => {
  if (!q || !qIsAnswered(q, a)) return false;
  if (Array.isArray(q.correct)) return q.correct.length === a.length && q.correct.every((v, i) => v === a[i]);
  return a === q.correct;
};
const qText = (q, v) => {
  if (!q || v == null) return "no answer";
  const st = qStyle(q);
  if (st === "order") return Array.isArray(v) && v.length ? v.map((j, k) => (k + 1) + ". " + ((q.items || [])[j] ?? "?")).join("  ") : "no answer";
  if (st === "match") return Array.isArray(v) ? (q.items || []).map((w, i) => w + " = " + ((q.options || [])[v[i]] ?? "?")).join("; ") : "no answer";
  if (st === "cloze") return Array.isArray(v) ? (q.blanks || []).map((o, i) => (o || [])[v[i]] ?? "?").join(", ") : "no answer";
  return (q.options || [])[v] ?? "no answer";
};
const qAnswerText = (q, a) => (qStyle(q) === "short" ? (qIsAnswered(q, a) ? a.trim() : "no answer written") : qIsAnswered(q, a) ? qText(q, a) : "no answer");
// The written answer is marked by the AI, so it sits outside the instant score.
const qIsAuto = (q) => qStyle(q) !== "short";
const qAutoCount = (questions) => (questions || []).filter(qIsAuto).length;
const qCorrectText = (q) => (q && q.correct != null ? (Array.isArray(q.correct) && qStyle(q) === "order" ? q.correct.map((j, k) => (k + 1) + ". " + ((q.items || [])[j] ?? "?")).join("  ") : qText(q, q.correct)) : "");
const Q_STYLE_NAME = { short: "Written answer", mc: "Multiple choice", tfng: "True, false or not given", evidence: "Part B: which line proves it?", order: "Put in order", match: "Match each word to its meaning", cloze: "Fill the gap" };

function choiceStyle(revealed, selected, isCorrect) {
  let borderColor = "var(--border)", bg = "var(--surface)";
  if (revealed && isCorrect) { borderColor = "var(--good)"; bg = "var(--good-tint)"; }
  else if (revealed && selected && !isCorrect) { borderColor = "var(--bad)"; bg = "var(--bad-tint)"; }
  else if (!revealed && selected) { borderColor = "var(--cyan)"; bg = "var(--cyan-tint)"; }
  return { borderColor, background: bg, color: "var(--ink)" };
}

function ReadingQuestion({ q, qi, answer, setAnswer, revealed, disabled }){
  const st = qStyle(q);
  const lock = disabled || revealed;
  const label = <div className="text-[11px] font-bold uppercase tracking-wide mb-1" style={{ color: "var(--ink-faint)" }}>{Q_STYLE_NAME[st] || Q_STYLE_NAME.mc}</div>;
  const title = st === "cloze" ? null : <div className="text-sm font-semibold mb-2" style={{ color: "var(--ink)" }}>{qi + 1}. {q.q}</div>;

  if (st === "short") {
    const text = typeof answer === "string" ? answer : "";
    const words = text.trim() ? text.trim().split(/\s+/).length : 0;
    return (
      <div>
        {label}
        <div className="text-sm font-semibold mb-2" style={{ color: "var(--ink)" }}>{qi + 1}. {q.q} <span className="font-normal text-xs" style={{ color: "var(--ink-faint)" }}>({q.marks} marks)</span></div>
        {q.framework && Array.isArray(q.framework.parts) && (
          <div className="rounded-xl p-3 mb-2" style={{ background: "var(--cyan-tint)" }}>
            <div className="text-[12px] font-bold" style={{ color: "var(--cyan-ink)" }}>Build your answer with {q.framework.name}</div>
            <ul className="mt-1 flex flex-col gap-0.5">
              {q.framework.parts.map((pt) => <li key={pt.name} className="text-[12.5px] leading-snug" style={{ color: "var(--ink)" }}><strong>{pt.name}</strong>: {pt.meaning}</li>)}
            </ul>
          </div>
        )}
        <textarea value={text} disabled={lock} maxLength={1200} rows={4} aria-label={"Your written answer to question " + (qi + 1)}
          onChange={(e) => setAnswer(e.target.value)} placeholder="Write one to three sentences. Use the passage to support your answer."
          className="focus-ring w-full rounded-xl border px-3.5 py-2.5 text-sm font-read leading-relaxed"
          style={{ borderColor: "var(--border)", background: "var(--surface)", color: "var(--ink)", resize: "vertical" }} />
        {!revealed && <div className="text-xs mt-1" style={{ color: "var(--ink-soft)" }}>Optional. Marked out of {q.marks} when you check your understanding. {words} {words === 1 ? "word" : "words"}</div>}
      </div>
    );
  }

  if (st === "order") {
    const picked = Array.isArray(answer) ? answer : [];
    const items = q.items || [];
    return (
      <div>
        {label}{title}
        <div className="flex flex-col gap-1.5">
          {items.map((item, j) => {
            const pos = picked.indexOf(j);
            const right = revealed && Array.isArray(q.correct) && pos !== -1 && q.correct[pos] === j;
            const wrong = revealed && pos !== -1 && !right;
            return (
              <button key={j} disabled={lock || pos !== -1} onClick={() => setAnswer([...picked, j])}
                className="focus-ring text-left rounded-xl border px-3.5 py-2.5 text-sm transition-colors flex items-center gap-2.5"
                style={choiceStyle(false, false, false) && { borderColor: right ? "var(--good)" : wrong ? "var(--bad)" : pos !== -1 ? "var(--cyan)" : "var(--border)", background: right ? "var(--good-tint)" : wrong ? "var(--bad-tint)" : pos !== -1 ? "var(--cyan-tint)" : "var(--surface)", color: "var(--ink)" }}>
                <span className="inline-grid place-items-center rounded-full text-[12px] font-bold shrink-0" style={{ width: 24, height: 24, background: pos !== -1 ? "var(--cyan)" : "var(--surface-2)", color: pos !== -1 ? "white" : "var(--ink-faint)" }}>{pos !== -1 ? pos + 1 : "•"}</span>
                <span>{item}</span>
              </button>
            );
          })}
        </div>
        {!revealed && (
          <div className="flex items-center gap-3 mt-2 text-xs" style={{ color: "var(--ink-soft)" }}>
            <span>Tap the events in the order they happen.</span>
            {picked.length > 0 && <button type="button" disabled={lock} onClick={() => setAnswer(null)} className="focus-ring underline font-semibold">Start again</button>}
          </div>
        )}
      </div>
    );
  }

  if (st === "match") {
    const chosen = Array.isArray(answer) ? answer : [];
    const items = q.items || [];
    return (
      <div>
        {label}{title}
        <div className="flex flex-col gap-2">
          {items.map((word, i) => {
            const val = chosen[i];
            const right = revealed && Array.isArray(q.correct) && val === q.correct[i];
            const wrong = revealed && !right;
            return (
              <div key={i} className="flex items-center gap-3 flex-wrap">
                <span className="text-sm font-semibold min-w-[6rem]" style={{ color: "var(--ink)" }}>{word}</span>
                <select disabled={lock} value={val == null ? "" : String(val)} aria-label={"Meaning of " + word}
                  onChange={(e) => { const next = items.map((_, k) => (chosen[k] == null ? null : chosen[k])); next[i] = e.target.value === "" ? null : Number(e.target.value); setAnswer(next); }}
                  className="focus-ring rounded-xl border px-3 py-2 text-sm flex-1 min-w-[10rem]"
                  style={{ borderColor: right ? "var(--good)" : wrong ? "var(--bad)" : "var(--border)", background: right ? "var(--good-tint)" : wrong ? "var(--bad-tint)" : "var(--surface)", color: "var(--ink)" }}>
                  <option value="">Choose a meaning</option>
                  {(q.options || []).map((m, mi) => <option key={mi} value={mi}>{m}</option>)}
                </select>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  if (st === "cloze") {
    const chosen = Array.isArray(answer) ? answer : [];
    const blanks = q.blanks || [];
    const parts = String(q.text || "").split("___");
    return (
      <div>
        {label}
        <div className="text-sm font-semibold mb-2" style={{ color: "var(--ink)" }}>{qi + 1}. {q.q}</div>
        <p className="font-read text-[15px] leading-loose" style={{ color: "var(--ink)" }}>
          {parts.map((part, bi) => (
            <React.Fragment key={bi}>
              {part}
              {bi < blanks.length && (() => {
                const val = chosen[bi];
                const right = revealed && Array.isArray(q.correct) && val === q.correct[bi];
                const wrong = revealed && !right;
                return (
                  <select disabled={lock} value={val == null ? "" : String(val)} aria-label={"Gap " + (bi + 1)}
                    onChange={(e) => { const next = blanks.map((_, k) => (chosen[k] == null ? null : chosen[k])); next[bi] = e.target.value === "" ? null : Number(e.target.value); setAnswer(next); }}
                    className="focus-ring rounded-lg border px-2 py-1 text-sm mx-1 align-baseline"
                    style={{ borderColor: right ? "var(--good)" : wrong ? "var(--bad)" : "var(--border)", background: right ? "var(--good-tint)" : wrong ? "var(--bad-tint)" : "var(--surface)", color: "var(--ink)" }}>
                    <option value="">choose</option>
                    {(blanks[bi] || []).map((w, wi) => <option key={wi} value={wi}>{w}</option>)}
                  </select>
                );
              })()}
            </React.Fragment>
          ))}
        </p>
      </div>
    );
  }

  // multiple choice, true/false/not given and "which line proves it" are all single choice
  const options = q.options || [];
  return (
    <div>
      {label}{title}
      <div className={st === "tfng" ? "grid grid-cols-1 sm:grid-cols-3 gap-1.5" : "flex flex-col gap-1.5"}>
        {options.map((opt, oi) => {
          const selected = answer === oi;
          const isCorrect = oi === q.correct;
          return (
            <button key={oi} disabled={lock} onClick={() => setAnswer(oi)}
              className={"focus-ring text-left rounded-xl border px-3.5 py-2.5 text-sm transition-colors" + (st === "tfng" ? " text-center font-semibold" : "") + (st === "evidence" ? " font-read italic" : "")}
              style={choiceStyle(revealed, selected, isCorrect)}>
              {st === "evidence" ? "\u201C" + opt + "\u201D" : opt}
            </button>
          );
        })}
      </div>
    </div>
  );
}

  // The high-school "timed essay" badge used to be a hard-coded "40:00
  // remaining" string with nothing behind it - it never moved. Starts on the
  // first keystroke (not on page load, so reading the prompt is free),

  const [essaySecondsUsed, setEssaySecondsUsed] = useState(0);

  }, [essayTimerRunning]);

    if (text.length === 0 && phase === "draft") { setEssaySecondsUsed(0); setEssayStarted(false); }

  const essaySecondsLeft = Math.max(0, ESSAY_TIME_LIMIT_SECONDS - essaySecondsUsed);

      </div>

  }

  if (tier === "elementary") {
    const badges = [
      { label: "Word Wizard", earned: words >= 50, tip: "Earned once the draft reaches 50 words." },
      { label: "Great Opener", earned: /^[A-Z]/.test(text.trim()), tip: "Earned when the story starts with a capital letter." },
      { label: "Mission Ready", earned: words >= meta.target, tip: `Earned once the draft reaches the ${meta.target}-word target for this mission.` },
    ];
    return (
      <div className="card p-6 relative overflow-hidden" style={{ borderRadius: 24 }}>
        {phase === "analyzing" && <AnalyzingOverlay />}
        <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
          <div className="flex items-center gap-2">
            <span className="w-9 h-9 rounded-xl grid place-items-center" style={{ background: "var(--cyan-tint)", color: "var(--cyan-ink)" }}><IconTarget size={17} /></span>
            <h3 className="font-display font-bold text-lg" style={{ color: "var(--ink)" }}>{meta.title}</h3>
          </div>
          <Tooltip text="A fun on-screen badge for younger writers - it's not tracked, saved, or added up anywhere, and doesn't affect progress or mastery.">
            <span className="inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-[11px] font-bold cursor-help" style={{ background: "var(--gold-tint)", color: "var(--gold-ink)" }}>
              <IconFlame size={12} /> +50 XP on submit

        <div className="flex gap-2 mb-4 flex-wrap">
          {badges.map(b=> (
            <Tooltip key={b.label} text={b.tip}>
              <span className="inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-[11px] font-bold cursor-help"

                <IconAward size={12} strokeWidth={2.3} /> {b.label}

        </div>
        <textarea value={text} onChange={(e)=>setText(e.target.value)} rows={10} disabled={disabled} maxLength={meta.maxChars}
          className="focus-ring w-full rounded-2xl border p-4 text-base leading-relaxed resize-none"
          style={{ borderColor: "var(--border)", background: "var(--surface-2)", color: "var(--ink)" }}
          placeholder="Start your mission here…" />
        <div className="flex items-center justify-between mt-4 flex-wrap gap-3">
          <WordMeter words={words} target={meta.target} chars={text.length} maxChars={meta.maxChars} />
          {phase !== "done" ? (

              style={{ background: "var(--cyan)", color: "#fff" }}>
              {locked ? <><IconLock size={15} /> Upgrade to Continue</> : <>{submitLabel} <IconSend size={15} /></>}
            </button>

          )}
        </div>
      </div>
    );
  }

  if (tier === "middle") {
    return (
      <div className="card p-0 relative overflow-hidden">
        {phase === "analyzing" && <AnalyzingOverlay />}
        <div className="px-6 pt-5 pb-4 border-b" style={{ borderColor: "var(--border-soft)" }}>
          <SectionLabel>Analytical response</SectionLabel>
          <h3 className="font-display font-semibold text-lg mt-0.5" style={{ color: "var(--ink)" }}>{meta.title}</h3>
          <p className="text-sm mt-1.5" style={{ color: "var(--ink-soft)" }}>{meta.prompt}</p>
        </div>
        <textarea value={text} onChange={(e)=>setText(e.target.value)} rows={14} disabled={disabled} maxLength={meta.maxChars}

              style={{ background: "var(--ink)", color: "white" }}>

          <IconClock size={13} /> {essaySecondsLeft === 0 ? "Time's up" : `${essayClock} remaining`}
        </span>

      <p className="font-read text-[15px] px-6 pt-4 pb-2 leading-relaxed" style={{ color: "var(--ink)" }}>{meta.prompt}</p>
      <textarea value={text} onChange={(e)=>{ setText(e.target.value); setEssayStarted(true); }} rows={16} disabled={disabled} maxLength={meta.maxChars}
        className="focus-ring w-full px-6 py-4 font-read text-[15.5px] leading-[1.8] resize-none border-0"
        style={{ background: "var(--surface)", color: "var(--ink)" }}
        placeholder="Begin your response here…" />
      <div className="flex items-center justify-between px-6 py-4 border-t flex-wrap gap-3" style={{ borderColor: "var(--border-soft)" }}>
        <WordMeter words={words} target={meta.target} chars={text.length} maxChars={meta.maxChars} />
        {phase !== "done" ? (
          <button onClick={locked ? onSeePlans : onSubmit} disabled={locked ? false : disabled}
            className="focus-ring inline-flex items-center gap-2 rounded-lg px-5 py-2.5 font-display font-semibold text-sm disabled:opacity-60"
            style={{ background: "var(--ink)", color: "white" }}>
            {locked ? <><IconLock size={15} /> Upgrade to Continue</> : <>{submitLabel} <IconSend size={14} /></>}
          </button>
        ) : (
          <button onClick={onNew} className="focus-ring inline-flex items-center gap-1.5 rounded-lg px-4 py-2 text-sm font-semibold" style={{ background: "var(--surface-2)", color: "var(--ink)" }}>New essay</button>

}
