function tierForGrade(country, idx){

  high: (g)=>`Strong draft. Your thesis directly answers the question, which is exactly what examiners are looking for at ${g} level.`,
};

// Base skill each growth tip targets, before it's explained through the student's interest.
const GROWTH_TIP_BASE = {
  early: "Next time, try starting one sentence with a describing word, like “Suddenly,” to make your story even more exciting.",
  elementary: "Try opening one sentence with a fronted adverbial, such as “Without warning,” or “Later that day,” to add variety.",
  middle: "Push your argument one step further: add a sentence that directly addresses a counterargument before returning to your main point.",
  high: "To move this from “in progress” to “mastered,” close one body paragraph with a synthesis sentence that links your evidence back to the wider debate, rather than restating your point.",
};
const MICRO_MISSION_BASE = {
  early: "Use 3 describing words (adjectives) to tell us what things look like!",
  elementary: "Start two sentences with a fronted adverbial, like “Without hesitation,”",
  middle: "Include one sentence that considers the opposite point of view before you respond to it.",
  high: "End each body paragraph with a synthesis sentence linking evidence back to your thesis.",
};

// Explains the same skill through the lens of the student's chosen interest, so
// the feedback lands as something they already understand rather than an abstract rule.
const INTEREST_ANALOGY = {
  space:   { early: "like a rocket launch — a big countdown before the exciting blast-off",
             elementary: "like a mission control checklist, where each step has to happen in the right order before launch",
             middle: "like a launch countdown — tension building in careful stages before the big moment",
             high: "like a spacecraft's trajectory, where every stage quietly corrects course toward one destination" },
  coding:  { early: "like giving a robot instructions — first this, then this, then this",
             elementary: "like a level you're building in a game — one clear goal, then a twist to keep it interesting",
             middle: "like a function: one clear input (your point), a process (your reasoning), and an output (your conclusion)",
             high: "like well-structured code, where each paragraph is a function that takes your evidence in and returns a clear conclusion" },
  gaming:  { early: "like a mini-boss fight — build up the excitement, then the big moment",
             elementary: "like levelling up — each part of your story unlocks the next part of the adventure",
             middle: "like a boss fight: raise the tension, then land your strongest hit — your best evidence — at the right moment",
             high: "like a well-paced boss encounter, with rising stakes, a clear turning point, and a resolution" },
  lit:     { early: "like your favourite story — a beginning, an exciting middle, and a happy ending",
             elementary: "like the end of a book chapter, which should leave the reader wanting to turn the page",
             middle: "like foreshadowing in a novel — plant a detail early, then pay it off later",
             high: "like a novel's narrative arc: setup, complication, then resolution" },
  history: { early: "like telling a story about long ago — first, next, and last",
             elementary: "like a timeline, where one event leads clearly into the next",
             middle: "like cause and effect in a historical event, where one action leads clearly to the next",
             high: "like a historian building a case: evidence first, interpretation second" },
  pop:     { early: "like your favourite show building up to the exciting bit",
             elementary: "like a trailer — hook the audience early, save the best part for last",
             middle: "like a plot twist in a film: set it up quietly, then reveal it",
             high: "like a well-edited scene — build-up, climax, then a clean cut to the next idea" },
  exam:    { early: "like following a recipe, one step at a time, in order",
             elementary: "like a checklist, where you tick off one step before moving to the next",
             middle: "like a mark scheme — hit each point clearly, in the order it's expecting",
             high: "like an examiner's mark scheme: address the question, evidence it, then weigh it up" },
};
function analogyFor(interest, tier){
  return (INTEREST_ANALOGY[interest] || INTEREST_ANALOGY.exam)[tier];
}
function growthTipFor(tier, interest){
  return `${GROWTH_TIP_BASE[tier]} Think of it ${analogyFor(interest, tier)}.`;
}
function microMissionFor(tier, interest){
  return `${MICRO_MISSION_BASE[tier]} It works ${analogyFor(interest, tier)} — one step earning the next.`;
}

function Workspace({ country, gradeIdx, setGradeIdx, tier, setTierOverride, interests, used, total, onSubmit }){
  const grades = GRADE_DATA[country].grades;
  const gradeLabel = grades[gradeIdx];
  const meta = PROMPTS[tier];
  const [text, setText] = useState(meta.sample);
  const [phase, setPhase] = useState("draft"); // draft | analyzing | done
  const [activeInterest, setActiveInterest] = useState(interests[0] || "exam");
  const timerRef = useRef(null);
  const locked = used >= total;

  useEffect(()=>{ setText(PROMPTS[tier].sample); setPhase("draft"); }, [tier]);
  useEffect(()=>{ if (interests.length && !interests.includes(activeInterest)) setActiveInterest(interests[0]); }, [interests]);
  useEffect(()=> ()=> clearTimeout(timerRef.current), []);

  const words = useMemo(()=> text.trim().length ? text.trim().split(/\s+/).length : 0, [text]);

  function handleSubmit(){
    if (locked || phase === "analyzing") return;
    setPhase("analyzing");
    timerRef.current = setTimeout(()=>{ setPhase("done"); onSubmit(); }, 2000);
  }
  function handleNew(){
    setText("");
    setPhase("draft");
  }

  const tierIcon = TIER_META[tier].icon;

  return (
    <div className="mx-auto max-w-6xl px-4 sm:px-6 py-8">
      <div className="flex items-center justify-between flex-wrap gap-3 mb-6">
        <div>
          <h2 className="font-display font-bold text-2xl" style={{ color: "var(--ink)" }}>Student Workspace</h2>
          <p className="text-sm mt-0.5" style={{ color: "var(--ink-soft)" }}>{country} · {gradeLabel}</p>
        </div>
        <div className="flex items-center gap-1.5 rounded-full border p-1" style={{ borderColor: "var(--border)", background: "var(--surface-2)" }}>
          {TIER_KEYS.map(k=>{
            const TIcon = TIER_META[k].icon;
            return (
              <button key={k} onClick={()=>{ setTierOverride(k); }}
                className="focus-ring flex items-center gap-1.5 rounded-full px-3 py-1.5 text-xs font-semibold transition-colors"
                style={ tier===k ? { background: "var(--ink)", color: "white" } : { color: "var(--ink-soft)" } }
                title={TIER_META[k].ageRange}>
                <TIcon size={13} strokeWidth={2.2} />{TIER_META[k].label}
              </button>
            );
          })}
        </div>
      </div>

      <div className="grid lg:grid-cols-5 gap-6">
        <div className="lg:col-span-3 flex flex-col gap-4">
          <TierEditor
            tier={tier} meta={meta} text={text} setText={setText} words={words}
            phase={phase} onSubmit={handleSubmit} onNew={handleNew} locked={locked}
            interests={interests} activeInterest={activeInterest} setActiveInterest={setActiveInterest}
          />
        </div>

        <div className="lg:col-span-2 flex flex-col gap-4">
          <div className="card p-4 flex items-center gap-2">
            <div className="w-8 h-8 rounded-lg grid place-items-center shrink-0" style={{ background: "var(--navy-tint)", color: "var(--ink)" }}>
              {React.createElement(tierIcon, { size: 15, strokeWidth: 2.2 })}
            </div>
            <div className="text-[13px]" style={{ color: "var(--ink-soft)" }}><span className="font-semibold" style={{ color: "var(--ink)" }}>{TIER_META[tier].label}:</span> {TIER_META[tier].blurb}</div>
          </div>

          {phase !== "done" && (
            <div className="card p-6 flex flex-col items-center justify-center text-center gap-3 min-h-[220px]" style={{ borderStyle: "dashed" }}>
              <div className="w-11 h-11 rounded-full grid place-items-center" style={{ background: "var(--cyan-tint)", color: "var(--cyan-ink)" }}>
                <IconSparkle size={20} strokeWidth={2} />
              </div>
              <div className="font-display font-semibold text-sm" style={{ color: "var(--ink)" }}>Key Takeaways will appear here</div>
              <p className="text-[13px] max-w-[26ch]" style={{ color: "var(--ink-faint)" }}>Submit your {tier === "high" ? "essay" : "story"} to see personalised feedback from LiteracyLab AI.</p>
            </div>
          )}
          {phase === "done" && (
            <FeedbackPanel tier={tier} gradeLabel={gradeLabel} country={country} interest={activeInterest} seed={words} />
          )}
        </div>
      </div>
    </div>
  );
}

function AnalyzingOverlay(){
  return (
    <div className="absolute inset-0 z-10 grid place-items-center rounded-[20px]" style={{ background: "color-mix(in srgb, var(--surface) 88%, transparent)", backdropFilter: "blur(2px)" }}>
      <div className="flex flex-col items-center gap-4 px-6 text-center">
        <div className="relative w-14 h-14 rounded-full grid place-items-center analyzing-pulse" style={{ background: "var(--cyan-tint)" }}>
          <IconSparkle size={24} strokeWidth={2} className="animate-spin-slow" style={{ color: "var(--cyan-ink)" }} />
        </div>
        <div className="font-display font-semibold text-sm" style={{ color: "var(--ink)" }}>LiteracyLab AI is analyzing curriculum benchmarks…</div>
        <div className="text-xs" style={{ color: "var(--ink-faint)" }}>Checking grammar, structure and vocabulary against your targets</div>
      </div>
    </div>
  );
}

function WordMeter({ words, target }){
  const pct = Math.min(100, Math.round((words/target)*100));
  return (
    <div className="flex items-center gap-2.5">
      <div className="h-1.5 w-24 rounded-full" style={{ background: "var(--surface-2)" }}>
        <div className="h-1.5 rounded-full transition-all" style={{ width: pct + "%", background: pct >= 100 ? "var(--good)" : "var(--cyan)" }} />
      </div>
      <span className="text-xs font-semibold tabular whitespace-nowrap" style={{ color: "var(--ink-soft)" }}>{words} / {target} words</span>
    </div>
  );
}

function TierEditor({ tier, meta, text, setText, words, phase, onSubmit, onNew, locked, interests, activeInterest, setActiveInterest }){
  const submitLabel = tier === "high" ? "Submit Essay" : "Submit Story";
  const disabled = phase === "analyzing" || locked;

  if (tier === "early") {
    return (
      <div className="card p-6 relative overflow-hidden" style={{ borderRadius: 28, borderWidth: 2, borderStyle: "dashed", borderColor: "var(--gold)" }}>
        {phase === "analyzing" && <AnalyzingOverlay />}
        <div className="flex items-center gap-2 mb-3">
          <span className="w-9 h-9 rounded-2xl grid place-items-center" style={{ background: "var(--gold-tint)", color: "var(--gold-ink)" }}><IconSparkle size={18} /></span>
          <h3 className="font-display font-extrabold text-xl" style={{ color: "var(--ink)" }}>{meta.title}</h3>
        </div>
        <p className="font-read text-lg leading-snug mb-4" style={{ color: "var(--ink)" }}>{meta.prompt}</p>
        <button className="focus-ring inline-flex items-center gap-1.5 rounded-full px-3 py-1.5 text-xs font-bold mb-3" style={{ background: "var(--cyan-tint)", color: "var(--cyan-ink)" }}>
          <IconMic size={14} strokeWidth={2.3} /> Read prompt aloud
        </button>
        <textarea value={text} onChange={(e)=>setText(e.target.value)} rows={9} disabled={disabled}
          className="focus-ring w-full rounded-2xl border-2 p-4 font-read text-xl leading-relaxed resize-none"
          style={{ borderColor: "var(--border)", background: "var(--surface-2)", color: "var(--ink)" }}
          placeholder="Start typing your story here…" />
        <div className="flex items-center justify-between mt-4 flex-wrap gap-3">
          <WordMeter words={words} target={meta.target} />
          {phase !== "done" ? (
            <button onClick={onSubmit} disabled={disabled}
              className="focus-ring inline-flex items-center gap-2 rounded-full px-5 py-2.5 font-display font-extrabold text-sm disabled:opacity-60"
              style={{ background: "var(--gold)", color: "#FFFFFF" }}>
              {locked ? <><IconLock size={15} /> Upgrade to Continue</> : <>{submitLabel} <IconSend size={15} /></>}
            </button>
          ) : (
            <button onClick={onNew} className="focus-ring inline-flex items-center gap-1.5 rounded-full px-4 py-2 text-sm font-bold" style={{ background: "var(--navy-tint)", color: "var(--ink)" }}>New Story</button>
          )}
        </div>
      </div>
    );
  }

  if (tier === "elementary") {
    const badges = [
      { label: "Word Wizard", earned: words >= 50 },
      { label: "Great Opener", earned: /^[A-Z]/.test(text.trim()) },
      { label: "Mission Ready", earned: words >= meta.target },
    ];
    return (
      <div className="card p-6 relative overflow-hidden" style={{ borderRadius: 24 }}>
        {phase === "analyzing" && <AnalyzingOverlay />}
        <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
          <div className="flex items-center gap-2">
            <span className="w-9 h-9 rounded-xl grid place-items-center" style={{ background: "var(--cyan-tint)", color: "var(--cyan-ink)" }}><IconTarget size={17} /></span>
            <h3 className="font-display font-bold text-lg" style={{ color: "var(--ink)" }}>{meta.title}</h3>
          </div>
          <span className="inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-[11px] font-bold" style={{ background: "var(--gold-tint)", color: "var(--gold-ink)" }}>
            <IconFlame size={12} /> +50 XP on submit
          </span>
        </div>
        <p className="text-[15px] mb-4" style={{ color: "var(--ink)" }}>{meta.prompt}</p>
        <div className="flex gap-2 mb-4 flex-wrap">
          {badges.map(b=> (
            <span key={b.label} className="inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-[11px] font-bold"
              style={{ background: b.earned ? "var(--good-tint)" : "var(--surface-2)", color: b.earned ? "var(--good)" : "var(--ink-faint)" }}>
              <IconAward size={12} strokeWidth={2.3} /> {b.label}
            </span>
          ))}
        </div>
        <textarea value={text} onChange={(e)=>setText(e.target.value)} rows={10} disabled={disabled}
          className="focus-ring w-full rounded-2xl border p-4 text-base leading-relaxed resize-none"
          style={{ borderColor: "var(--border)", background: "var(--surface-2)", color: "var(--ink)" }}
          placeholder="Start your mission here…" />
        <div className="flex items-center justify-between mt-4 flex-wrap gap-3">
          <WordMeter words={words} target={meta.target} />
          {phase !== "done" ? (
            <button onClick={onSubmit} disabled={disabled}
              className="focus-ring inline-flex items-center gap-2 rounded-full px-5 py-2.5 font-display font-bold text-sm disabled:opacity-60"
              style={{ background: "var(--cyan)", color: "#FFFFFF" }}>
              {locked ? <><IconLock size={15} /> Upgrade to Continue</> : <>{submitLabel} <IconSend size={15} /></>}
            </button>
          ) : (
            <button onClick={onNew} className="focus-ring inline-flex items-center gap-1.5 rounded-full px-4 py-2 text-sm font-bold" style={{ background: "var(--navy-tint)", color: "var(--ink)" }}>New Mission</button>
          )}
        </div>
      </div>
    );
  }

  if (tier === "middle") {
    return (
      <div className="card p-0 relative overflow-hidden">
        {phase === "analyzing" && <AnalyzingOverlay />}
        <div className="px-6 pt-5 pb-4 border-b" style={{ borderColor: "var(--border-soft)" }}>
          <SectionLabel>Analytical response</SectionLabel>
          <h3 className="font-display font-semibold text-lg mt-0.5" style={{ color: "var(--ink)" }}>{meta.title}</h3>
          <p className="text-sm mt-1.5" style={{ color: "var(--ink-soft)" }}>{meta.prompt}</p>
        </div>
        <textarea value={text} onChange={(e)=>setText(e.target.value)} rows={14} disabled={disabled}
          className="focus-ring w-full p-6 font-read text-[16px] leading-[1.75] resize-none border-0"
          style={{ background: "var(--surface)", color: "var(--ink)" }}
          placeholder="Write your response here…" />
        <div className="flex items-center justify-between px-6 py-4 border-t flex-wrap gap-3" style={{ borderColor: "var(--border-soft)" }}>
          <WordMeter words={words} target={meta.target} />
          {phase !== "done" ? (
            <button onClick={onSubmit} disabled={disabled}
              className="focus-ring inline-flex items-center gap-2 rounded-lg px-4 py-2 font-display font-semibold text-sm disabled:opacity-60"
              style={{ background: "var(--ink)", color: "white" }}>
              {locked ? <><IconLock size={15} /> Upgrade to Continue</> : <>{submitLabel} <IconSend size={14} /></>}
            </button>
          ) : (
            <button onClick={onNew} className="focus-ring inline-flex items-center gap-1.5 rounded-lg px-4 py-2 text-sm font-semibold" style={{ background: "var(--surface-2)", color: "var(--ink)" }}>New response</button>
          )}
        </div>
      </div>
    );
  }

  // high school
  return (
    <div className="card p-0 relative overflow-hidden">
      {phase === "analyzing" && <AnalyzingOverlay />}
      <div className="px-6 pt-5 pb-4 border-b flex items-start justify-between gap-3 flex-wrap" style={{ borderColor: "var(--border-soft)", background: "var(--surface-2)" }}>
        <div>
          <SectionLabel>Timed essay practice</SectionLabel>
          <h3 className="font-display font-semibold text-lg mt-0.5" style={{ color: "var(--ink)" }}>{meta.title}</h3>
        </div>
        <span className="inline-flex items-center gap-1.5 rounded-full px-3 py-1.5 text-xs font-semibold shrink-0" style={{ background: "var(--surface)", color: "var(--ink-soft)", border: "1px solid var(--border)" }}>
          <IconClock size={13} /> 40:00 remaining
        </span>
      </div>
      <p className="font-read text-[15px] px-6 pt-4 pb-2 leading-relaxed" style={{ color: "var(--ink)" }}>{meta.prompt}</p>
      <textarea value={text} onChange={(e)=>setText(e.target.value)} rows={16} disabled={disabled}
        className="focus-ring w-full px-6 py-4 font-read text-[15.5px] leading-[1.8] resize-none border-0"
        style={{ background: "var(--surface)", color: "var(--ink)" }}
        placeholder="Begin your response here…" />
      <div className="flex items-center justify-between px-6 py-4 border-t flex-wrap gap-3" style={{ borderColor: "var(--border-soft)" }}>
        <WordMeter words={words} target={meta.target} />
        {phase !== "done" ? (
          <button onClick={onSubmit} disabled={disabled}
            className="focus-ring inline-flex items-center gap-2 rounded-lg px-5 py-2.5 font-display font-semibold text-sm disabled:opacity-60"
            style={{ background: "var(--ink)", color: "white" }}>
            {locked ? <><IconLock size={15} /> Upgrade to Continue</> : <>{submitLabel} <IconSend size={14} /></>}
          </button>
        ) : (
          <button onClick={onNew} className="focus-ring inline-flex items-center gap-1.5 rounded-lg px-4 py-2 text-sm font-semibold" style={{ background: "var(--surface-2)", color: "var(--ink)" }}>New essay</button>
        )}
      </div>
    </div>
  );
}

/* App                                                                */
/* ---------------------------------------------------------------- */
function App(){
  const [theme, setTheme] = useState("system");
  const [view, setView] = useState("workspace");
  const [country, setCountry] = useState("United Kingdom");
  const [gradeIdx, setGradeIdx] = useState(5); // Year 5
  const [tierOverride, setTierOverride] = useState(null);
  const [interests, setInterests] = useState(["space","gaming"]);
  const [used, setUsed] = useState(1);
  const total = 3;

  useEffect(()=>{
    const root = document.documentElement;
    if (theme === "system") root.removeAttribute("data-theme");
    else root.setAttribute("data-theme", theme);
  }, [theme]);

  const naturalTier = tierForGrade(country, gradeIdx);
  const tier = tierOverride || naturalTier;

  function setTierAndSyncGrade(k){
    setTierOverride(k);
    setGradeIdx(defaultGradeIndexForTier(country, k));
  }
  function handleCountryChange(c){
    setCountry(c);
    setGradeIdx(defaultGradeIndexForTier(c, tier));
  }
  function handleGradeChange(idx){
    setGradeIdx(idx);
    setTierOverride(null);
  }
  function toggleInterest(id){
    setInterests(prev => prev.includes(id) ? prev.filter(x=>x!==id) : [...prev, id]);
  }
  function handleSubmit(){
    setUsed(u => Math.min(total, u+1));
  }

  return (
    <div className="min-h-screen">
      <Header view={view} setView={setView} used={used} total={total} theme={theme === "system" ? "light" : theme} setTheme={setTheme} />
      <div className="md:hidden mx-auto max-w-6xl px-4 pt-3">
        <div className="rounded-xl border px-3 py-2 text-xs font-medium flex items-center justify-between" style={{ borderColor: "var(--border)", background: "var(--surface-2)", color: "var(--ink-soft)" }}>
          <span>Free Plan: <b className="tabular" style={{ color: "var(--ink)" }}>{total-used}</b> of {total} remaining</span>
          <span className="rounded-full px-2 py-0.5 text-[10px] font-bold" style={{ background: "var(--gold-tint)", color: "var(--gold-ink)" }}>FREE</span>
        </div>
      </div>
      {view === "dashboard" ? (
        <Dashboard country={country} setCountry={handleCountryChange} gradeIdx={gradeIdx} setGradeIdx={handleGradeChange}
          tier={tier} interests={interests} toggleInterest={toggleInterest} used={used} total={total} setView={setView} />
      ) : (
        <Workspace country={country} gradeIdx={gradeIdx} setGradeIdx={handleGradeChange} tier={tier} setTierOverride={setTierAndSyncGrade}
          interests={interests} used={used} total={total} onSubmit={handleSubmit} />
      )}
      <footer className="mx-auto max-w-6xl px-4 sm:px-6 py-10 text-center text-xs flex flex-col items-center gap-2" style={{ color: "var(--ink-faint)" }}>
        <div>LiteracyLab AI · interactive prototype — all learner data shown is sample data.</div>
        <div className="flex items-center gap-4">
          <a href="index.html" className="hover:underline" style={{ color: "var(--ink-faint)" }}>Home</a>
          <a href="privacy.html" className="hover:underline" style={{ color: "var(--ink-faint)" }}>Privacy</a>
          <a href="terms.html" className="hover:underline" style={{ color: "var(--ink-faint)" }}>Terms</a>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
