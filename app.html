  body{

// Every console.error(...) call site for an unexpected failure (not a
// normal validation message the UI already surfaces) should go through
// this instead, so it's visible in Sentry the same way server errors are
// (see api/_lib/auth.js's sendError) rather than only in a browser console
// nobody is watching.
// Named logAppError, not reportError, deliberately: `reportError()` is a
// native browser global (used by error-monitoring tooling, including
// Sentry itself, to dispatch an error report) - shadowing it with a
// same-named function of a different signature risked exactly the kind of
// silent cross-wiring that's very hard to debug later.
function logAppError(message, err, extra){
  console.error(message, err);
  if (SENTRY_DSN && window.Sentry) window.Sentry.captureException(err, { extra: { message, ...extra } });

// Attaches the signed-in user's access token to a call against our own /api
// serverless functions. Throws if somehow called without a session.
// Browser-native text-to-speech (no API cost) for the "Read prompt aloud"
// button, which matters most for the Early Years tier — pre/early readers
// who often can't fully read the prompt themselves.
function speakText(text) {
  if (!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel(); // stop anything already reading
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.rate = 0.9;
  window.speechSynthesis.speak(utterance);
}

async function authedFetch(session, path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      Authorization: `Bearer ${session.access_token}`,
      ...(options.headers || {}),
    },
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || `Request to ${path} failed (${res.status}).`);
    err.statusCode = res.status;
    err.payload = data;
    throw err;
  }
  return data;
}

// No published word-count guidance is specific enough to justify a
// separate character cap, so it's derived from the word target using a
// words-to-characters ratio that shrinks smoothly as the target grows
// (younger writing has more short/simple words and spacing overhead per
// word). This must be a continuous function of the target rather than a
// per-tier constant - a discrete per-tier ratio was tried first and live
// testing caught it producing a SMALLER cap for an older grade than a
// younger one right at a tier boundary (e.g. US Grade 9's 450-word target
// got a tighter cap than Grade 8's 400-word target, because the ratio
// stepped down from "middle" to "high" faster than the target grew).
function deriveMaxChars(target){
  const ratio = 7.5 + 5.5 * Math.exp(-target / 220);
  return Math.round((target * ratio) / 10) * 10;
}
function writingLimitsFor(country, gradeIdx){
  const gradeLabel = GRADE_DATA[country].grades[gradeIdx];
  const tier = tierForGrade(country, gradeIdx);
  const target = (GRADE_WORD_TARGETS[country] || {})[gradeLabel] ?? TIER_WRITING_LIMITS[tier].target;
  return { target, maxChars: deriveMaxChars(target) };
}

function readingGlows(tier, score, totalQ, curriculum){

function readingGrows(tier, score, totalQ, interest, country, motivation, confidence){
  const base = score === totalQ
    ? "Try reading the next passage a little faster and see if your comprehension holds up under time pressure."
    : "Go back to the question you missed and find the exact sentence in the passage that answers it — that habit is the fastest way to stop losing marks on inference questions.";
  const closer = MOTIVATION_CLOSER[motivation] || MOTIVATION_CLOSER.enjoyment;
  return `${base} Think of it ${analogyFor(interest, tier, country)}. ${closer}${confidenceStretch(tier, confidence)}`;
}

    ? { "--t-bg": "var(--gold-tint)", "--t-ink": "var(--gold-ink)", "--t-ring": "var(--gold)" }
    : { "--t-bg": "var(--cyan-tint)", "--t-ink": "var(--cyan-ink)", "--t-ring": "var(--cyan)" };
  return (
    <button onClick={onClick}
      className={"focus-ring inline-flex items-center gap-1.5 rounded-full border px-3.5 py-2 text-sm font-medium transition-all " +
        (active ? "border-transparent" : "border-[var(--border)] text-[var(--ink-soft)] hover:border-[var(--ink-faint)]")}
      style={{
        ...(active ? toneVars : {}),
        background: active ? "var(--t-bg)" : "var(--surface)",
        color: active ? "var(--t-ink)" : "var(--ink-soft)",
        boxShadow: active ? "inset 0 0 0 1.5px var(--t-ring)" : "none",
      }}>
      {IconEl && <IconEl size={15} strokeWidth={2} />}
      {children}
    </button>
  );
}

// Hand-rolled SVG line chart rather than pulling in a charting library -
// this app already draws every icon as inline SVG, and a single mastery
// line over <=26 weekly points doesn't need more than that. Weeks with no
// assessed writing that week (masteryPct: null) are skipped when drawing
// the line/points but still counted for the x-axis, so a quiet week shows
// as a gap rather than a misleading dip to 0%.
function ProgressTimeline({ weeks }){
  const plottable = (weeks || []).filter(w => w.masteryPct != null);
  if (plottable.length < 2) {
    return (
      <div className="text-sm py-6 text-center" style={{ color: "var(--ink-faint)" }}>
        Keep submitting stories — a trend line appears once there are at least two weeks of assessed writing.
      </div>
    );
  }
  const W = 640, H = 200, padL = 34, padR = 12, padT = 16, padB = 28;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const n = plottable.length;
  const x = (i) => padL + (n === 1 ? innerW / 2 : (i / (n - 1)) * innerW);
  const y = (pct) => padT + innerH - (pct / 100) * innerH;
  const points = plottable.map((w, i) => ({ ...w, cx: x(i), cy: y(w.masteryPct) }));
  const path = points.map((p, i) => `${i === 0 ? "M" : "L"} ${p.cx.toFixed(1)} ${p.cy.toFixed(1)}`).join(" ");
  const areaPath = `${path} L ${points[points.length - 1].cx.toFixed(1)} ${padT + innerH} L ${points[0].cx.toFixed(1)} ${padT + innerH} Z`;
  const fmtWeek = (iso) => new Date(iso + "T00:00:00Z").toLocaleDateString(undefined, { month: "short", day: "numeric", timeZone: "UTC" });
  // At most 5 x-axis labels, evenly spaced, so dense histories don't overlap.
  const labelEvery = Math.max(1, Math.ceil(n / 5));
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ height: 200 }}>
      {[0, 50, 100].map(gy => (
        <g key={gy}>
          <line x1={padL} x2={W - padR} y1={y(gy)} y2={y(gy)} stroke="var(--border-soft)" strokeWidth="1" />
          <text x={padL - 8} y={y(gy) + 4} textAnchor="end" fontSize="10" fill="var(--ink-faint)">{gy}%</text>
        </g>
      ))}
      <path d={areaPath} fill="var(--cyan-tint)" opacity="0.6" />
      <path d={path} fill="none" stroke="var(--cyan-ink)" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
      {points.map((p, i) => (
        <circle key={p.weekStart} cx={p.cx} cy={p.cy} r="3.5" fill="var(--cyan-ink)" />
      ))}
      {points.map((p, i) => (
        (i % labelEvery === 0 || i === points.length - 1) && (
          <text key={"lbl-" + p.weekStart} x={p.cx} y={H - 8} textAnchor="middle" fontSize="10" fill="var(--ink-faint)">{fmtWeek(p.weekStart)}</text>
        )
      ))}
    </svg>
  );
}

function ChildSwitcher({ children_, activeChildId, onSwitchChild, onAddChild, showAdd = true }){
  return (
    <div className="flex items-center gap-1.5 rounded-full border p-1 w-fit mb-4 flex-wrap" style={{ borderColor: "var(--border)", background: "var(--surface-2)" }}>
      {children_.map(c=>(

          className="focus-ring inline-flex items-center gap-1.5 rounded-full pl-1 pr-3.5 py-1 text-xs font-semibold transition-colors"

          <Avatar avatarId={c.avatar_id ?? 0} size={22} />

      {showAdd && (
        <button onClick={onAddChild} className="focus-ring inline-flex items-center gap-1 rounded-full px-3.5 py-1.5 text-xs font-semibold" style={{ color: "var(--cyan-ink)" }}>
          <IconPlus size={13} strokeWidth={2.4} /> Add learner
        </button>
      )}

  );
}

// A short, low-friction "did this land?" check — captured per piece of feedback
// rather than guessed once at signup, since feedback receptivity shifts over time.
function ThumbsFeedback({ context, session, submissionId, backendLive }){
  const [value, setValue] = useState(null);
  function pick(v){
    setValue(v);
    if (backendLive && submissionId) {
      authedFetch(session, "/api/commit", { method: "POST", body: JSON.stringify({ submissionId, helpfulRating: v }) })
        .catch((err)=> logAppError("Failed to log feedback rating:", err));
    }
  }
  if (value) {
    return (
      <div className="text-[12.5px] flex items-center gap-1.5" style={{ color: "var(--ink-faint)" }}>
        <IconCheck size={13} strokeWidth={2.4} style={{ color: "var(--good)" }} />
        Thanks — that helps us calibrate your next {context}.
      </div>
    );
  }
  return (
    <div className="flex items-center gap-2.5 flex-wrap">
      <span className="text-[12.5px] font-medium" style={{ color: "var(--ink-faint)" }}>Did this feedback help?</span>
      <div className="flex items-center gap-1.5">
        <button onClick={()=>pick("up")} aria-label="Yes, this helped"
          className="focus-ring w-8 h-8 rounded-full grid place-items-center border" style={{ borderColor: "var(--border)", color: "var(--ink-soft)" }}>
          <IconThumbsUp size={14} strokeWidth={2.2} />
        </button>
        <button onClick={()=>pick("down")} aria-label="No, this didn't help"
          className="focus-ring w-8 h-8 rounded-full grid place-items-center border" style={{ borderColor: "var(--border)", color: "var(--ink-soft)" }}>
          <IconThumbsDown size={14} strokeWidth={2.2} />
        </button>
      </div>
    </div>
  );
}

// The higher-leverage signal: not "did you like this" but "what will you actually do
// with it" — a committed action, chosen from options drawn from this piece's own Grow.
function CommitPrompt({ options, session, submissionId, backendLive }){
  const [picked, setPicked] = useState(null);
  function pick(opt){
    setPicked(opt);
    if (backendLive && submissionId) {
      authedFetch(session, "/api/commit", { method: "POST", body: JSON.stringify({ submissionId, chosenAction: opt }) })
        .catch((err)=> logAppError("Failed to log commitment:", err));
    }
  }
  if (picked) {
    return (
      <div className="rounded-xl p-3 flex items-center gap-2" style={{ background: "var(--good-tint)" }}>
        <IconCheck size={15} strokeWidth={2.4} style={{ color: "var(--good)" }} />
        <span className="text-[13px] font-medium" style={{ color: "var(--ink)" }}>Locked in: <strong>{picked}</strong> — we'll check in on this next time.</span>
      </div>
    );
  }
  return (
    <div>
      <div className="text-[12.5px] font-semibold mb-2" style={{ color: "var(--ink-soft)" }}>What will you try next time?</div>
      <div className="flex flex-wrap gap-2">
        {options.map(opt=>(
          <button key={opt} onClick={()=>pick(opt)}
            className="focus-ring text-left rounded-full border px-3.5 py-2 text-[13px] font-medium"
            style={{ borderColor: "var(--cyan)", color: "var(--cyan-ink)", background: "var(--cyan-tint)" }}>
            {opt}
          </button>
        ))}
      </div>
    </div>
  );
}

// Renders the student's own submitted text with the AI's highlight quotes
// picked out inline (green = glow, burgundy = grow), plus a plain-language
// list below each one — so feedback that's otherwise just prose the student
// has to mentally map back onto their story is instead pinned directly to
// the words it's about.
function AnnotatedText({ text, highlights }){
  const spans = useMemo(()=>{
    if (!text || !Array.isArray(highlights) || highlights.length === 0) return null;
    const lowerText = text.toLowerCase();
    const found = [];
    highlights.forEach((h, i)=>{
      if (!h?.quote) return;
      const idx = lowerText.indexOf(String(h.quote).toLowerCase());
      if (idx === -1) return; // defensive: shouldn't happen, server validates this, but never crash the UI over it
      found.push({ start: idx, end: idx + h.quote.length, type: h.type === "grow" ? "grow" : "glow", note: h.note, revision: h.revision, key: i });
    });
    found.sort((a,b)=> a.start - b.start);
    const nonOverlapping = [];
    let cursor = 0;
    found.forEach(f=>{ if (f.start >= cursor) { nonOverlapping.push(f); cursor = f.end; } });
    return nonOverlapping;
  }, [text, highlights]);

  // The actual whole-text rewrite the user asked for: not a note beside the
  // original sentence, the student's FULL story with every "grow" fragment
  // swapped for its revision in place, everything else untouched. Built by
  // walking the same non-overlapping spans used to highlight the original.
  const revisedText = useMemo(()=>{
    if (!spans || spans.length === 0) return null;
    if (!spans.some(f => f.type === "grow" && f.revision)) return null;
    let out = "";
    let pos = 0;
    spans.forEach(f => {
      out += text.slice(pos, f.start);
      let piece = (f.type === "grow" && f.revision) ? f.revision : text.slice(f.start, f.end);
      // A "grow" quote sometimes excludes its own trailing punctuation
      // while the AI's revision supplies its own closing punctuation -
      // found live as a real "..double period.." glitch right at the
      // splice point (e.g. "...space.. This..."). Only trims when the
      // very next original character is ALSO sentence-ending punctuation,
      // so a legitimate "..." ellipsis elsewhere in the story is untouched.
      const nextChar = text[f.end];
      if (piece && /[.!?]/.test(piece[piece.length - 1]) && nextChar && /[.!?]/.test(nextChar)) {
        piece = piece.slice(0, -1);
      }
      out += piece;
      pos = f.end;
    });
    out += text.slice(pos);
    return out;
  }, [text, spans]);

  if (!spans || spans.length === 0) {
    return <p className="whitespace-pre-wrap font-read text-[14.5px] leading-relaxed" style={{ color: "var(--ink)" }}>{text}</p>;
  }

  const parts = [];
  let pos = 0;
  spans.forEach((f, i)=>{
    if (f.start > pos) parts.push(<span key={`t${i}`}>{text.slice(pos, f.start)}</span>);
    const isGlow = f.type === "glow";
    parts.push(
      <mark key={`h${i}`} title={f.note} tabIndex={0}
        className="focus-ring rounded px-0.5 cursor-help"
        style={{ background: isGlow ? "var(--good-tint)" : "var(--bad-tint)", color: isGlow ? "var(--good)" : "var(--bad)", textDecoration: "underline", textDecorationStyle: "dotted", textUnderlineOffset: 2 }}>
        {text.slice(f.start, f.end)}
      </mark>
    );
    pos = f.end;
  });
  if (pos < text.length) parts.push(<span key="tail">{text.slice(pos)}</span>);

  return (
    <div>
      <p className="whitespace-pre-wrap font-read text-[14.5px] leading-relaxed" style={{ color: "var(--ink)" }}>{parts}</p>
      <div className="flex items-center gap-3 mt-3 text-[11px] font-semibold" style={{ color: "var(--ink-faint)" }}>
        <span className="inline-flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full" style={{ background: "var(--good)" }} />Glow</span>
        <span className="inline-flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full" style={{ background: "var(--bad)" }} />Grow</span>
      </div>
      <div className="flex flex-col gap-1.5 mt-3 pt-3 border-t" style={{ borderColor: "var(--border-soft)" }}>
        {spans.map((f, i)=>(
          <div key={i} className="text-[12.5px] leading-snug flex items-start gap-1.5">
            <span className="font-bold shrink-0" style={{ color: f.type === "glow" ? "var(--good)" : "var(--bad)" }}>{f.type === "glow" ? "✓" : "→"}</span>
            <span style={{ color: "var(--ink-soft)" }}><strong style={{ color: "var(--ink)" }}>&ldquo;{text.slice(f.start, f.end)}&rdquo;</strong> — {f.note}</span>
          </div>
        ))}
      </div>
      {revisedText && (
        <div className="mt-4 pt-4 border-t rounded-b-xl -mx-5 sm:-mx-6 -mb-5 sm:-mb-6 px-5 sm:px-6 pb-5 sm:pb-6" style={{ borderColor: "var(--border-soft)", background: "var(--good-tint)" }}>
          <div className="flex items-center gap-1.5 mb-2">
            <IconSparkle size={13} strokeWidth={2.4} style={{ color: "var(--good)" }} />
            <span className="text-[11px] font-bold uppercase tracking-wide" style={{ color: "var(--good)" }}>Your story, revised</span>
          </div>
          <p className="whitespace-pre-wrap font-read text-[14.5px] leading-relaxed" style={{ color: "var(--ink)" }}>{revisedText}</p>
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------- */
/* Student Workspace                                                  */
/* ---------------------------------------------------------------- */
function Workspace({ country, gradeIdx, setGradeIdx, tier, setTierOverride, interests, confidenceWriting, confidenceReading, motivation, used, total, onSubmit, session, backendLive, childId, children_, onSwitchChild }){
  const grades = GRADE_DATA[country].grades;
  const gradeLabel = grades[gradeIdx];
  const [exerciseType, setExerciseType] = useState("writing"); // writing | reading
  const [text, setText] = useState(()=> (backendLive ? "" : PROMPTS[tier].sample));
  const [answers, setAnswers] = useState({});
  const [readingScore, setReadingScore] = useState(0);
  const [phase, setPhase] = useState("draft"); // draft | analyzing | done
  // Live testing found this defaulting to the literal id "exam" ("College /
  // Exam Prep") whenever a child had no interests selected yet, regardless
  // of age tier — INTERESTS_BY_TIER doesn't even offer that option below
  // "high", so a parent who skipped the interest picker during onboarding
  // got every piece of feedback for their 7-year-old framed around exam
  // prep. Falls back to the first tier-appropriate interest instead.
  const [activeInterest, setActiveInterest] = useState(()=> interests[0] || interestsForTier(tier)[0]?.id || "space");
  const [backendFeedback, setBackendFeedback] = useState(null); // real LLM output, when connected
  const [submissionId, setSubmissionId] = useState(null);
  const [submitError, setSubmitError] = useState(null);
  const [readingPassageIdx, setReadingPassageIdx] = useState(()=> pickPassageIndex(tier)); // demo mode only
  const [readingPassage, setReadingPassage] = useState(null); // backendLive: AI-generated {submissionId, title, skill, passage, questions}
  const [readingLoading, setReadingLoading] = useState(false);
  const [writingPrompt, setWritingPrompt] = useState(null); // backendLive: AI-generated {submissionId, title, prompt}
  const [writingLoading, setWritingLoading] = useState(false);
  const timerRef = useRef(null);
  // Each writing-prompt/reading-passage generation is billable (see
  // api/writing-prompt.js and api/reading-passage.js) - it inserts a
  // submissions row the moment it's generated, not when the student
  // eventually submits. Without caching one pending (not-yet-submitted)
  // generation per tier here, merely clicking through the tier tabs or the
  // Writing/Reading toggle would silently burn a real usage credit on every
  // click, since that switch re-runs the effect below. Cleared for a tier
  // once that submission is actually completed (it can't be reused after
  // that - submitting again 409s) or when "New Story"/"New Passage" is
  // tapped explicitly, which is a genuine, intentional new credit spend.
  const pendingWritingRef = useRef({});
  const pendingReadingRef = useRef({});
  const locked = used >= total;
  const [bannerDismissed, setBannerDismissed] = useState(false);

  const meta = backendLive
    ? (writingPrompt ? { ...writingLimitsFor(country, gradeIdx), title: writingPrompt.title, prompt: writingPrompt.prompt } : null)
    : PROMPTS[tier];

  // Generates a brand-new writing prompt. In demo mode the prompt is static
  // (PROMPTS[tier]); with a live backend it calls the AI for an original one
  // tailored to tier/country/interest, consuming this account's usage
  // credit up front — same reasoning and pattern as requestNewPassage below,
  // so a returning student doesn't see the same prompt every session.
  const cacheKey = `${childId}:${tier}`; // scoped per learner too, not just tier - a sibling's cached prompt must never leak into another child's tab

  async function requestNewWritingPrompt(force){
    if (!backendLive || locked) return;
    if (!force && pendingWritingRef.current[cacheKey]) {
      // Already have an ungraded prompt for this tier from earlier in the
      // session (e.g. the student tabbed away and back) - reuse it instead
      // of spending another credit on a prompt they haven't answered yet.
      setWritingPrompt(pendingWritingRef.current[cacheKey]);
      return;
    }
    setWritingLoading(true);
    setWritingPrompt(null);
    setSubmitError(null);
    try {
      const result = await authedFetch(session, "/api/writing-prompt", {
        method: "POST",
        body: JSON.stringify({ tier, country, gradeLabel, interest: activeInterest, childId }),
      });
      const fresh = { submissionId: result.submissionId, title: result.title, prompt: result.prompt };
      pendingWritingRef.current[cacheKey] = fresh;
      setWritingPrompt(fresh);
      onSubmit(result.usage);
    } catch (err) {
      setSubmitError(err.payload?.error || err.message || "Couldn't generate a writing prompt. Please try again.");
    } finally {
      setWritingLoading(false);
    }
  }

  // Generates a brand-new reading passage. In demo mode this just rerolls
  // the local static bank; with a live backend it calls the AI to write an
  // original one (consuming this account's usage credit up front — see
  // api/reading-passage.js) so no student ever sees the same passage twice.
  async function requestNewPassage(force){
    if (!backendLive) { setReadingPassageIdx(pickPassageIndex(tier)); return; }
    if (locked) return;
    if (!force && pendingReadingRef.current[cacheKey]) {
      // Same reasoning as requestNewWritingPrompt above - reuse an ungraded
      // passage for this tier instead of re-billing a credit for it.
      setReadingPassage(pendingReadingRef.current[cacheKey]);
      return;
    }
    setReadingLoading(true);
    setReadingPassage(null);
    setSubmitError(null);
    try {
      const result = await authedFetch(session, "/api/reading-passage", {
        method: "POST",
        body: JSON.stringify({ tier, country, gradeLabel, interest: activeInterest, childId }),
      });
      const fresh = { submissionId: result.submissionId, title: result.title, skill: result.skill, passage: result.passage, questions: result.questions };
      pendingReadingRef.current[cacheKey] = fresh;
      setReadingPassage(fresh);
      onSubmit(result.usage);
    } catch (err) {
      setSubmitError(err.payload?.error || err.message || "Couldn't generate a reading passage. Please try again.");
    } finally {
      setReadingLoading(false);
    }
  }

  useEffect(()=>{
    setAnswers({}); setPhase("draft"); setBackendFeedback(null); setSubmissionId(null); setSubmitError(null);
    if (exerciseType === "writing") {
      if (backendLive) {
        setText("");
        // Live testing surfaced a real billing bug here: this effect used to
        // call requestNewWritingPrompt()/requestNewPassage() unconditionally,
        // and both bill a usage credit the instant they're called (see
        // api/writing-prompt.js, api/reading-passage.js) - so every age-tier
        // tab click and every Writing/Reading toggle silently spent a
        // credit, and a curious student could burn their entire monthly
        // quota without ever writing a word. An in-memory "already
        // generated this tier" cache alone isn't enough to fix it either,
        // because Workspace fully remounts (losing that cache) every time
        // the student visits the Dashboard and comes back. So generation is
        // now NEVER automatic: this only restores an already-cached ungraded
        // prompt for free (below), and otherwise leaves it to the explicit
        // "Get my prompt" button in the render, so spending a credit always
        // requires a deliberate tap, on first visit or any later one.
        const cached = pendingWritingRef.current[cacheKey];
        setWritingPrompt(cached || null);
      } else setText(PROMPTS[tier].sample);
    } else {
      if (backendLive) {
        setReadingPassage(pendingReadingRef.current[cacheKey] || null);
      } else {
        requestNewPassage(); // demo mode: free, just rerolls the local static bank
      }
    }
  }, [tier, exerciseType, childId]);
  useEffect(()=>{
    // Keeps activeInterest valid as either the child's selected interests or
    // the tier itself changes (e.g. tabbing from High School, where "exam"
    // is valid, down to Elementary, where it isn't offered at all).
    const validForTier = interestsForTier(tier).map(i=>i.id);
    if (interests.length) {
      if (!interests.includes(activeInterest)) {
        setActiveInterest(interests.find(id=>validForTier.includes(id)) || interests[0]);
      }
    } else if (!validForTier.includes(activeInterest)) {
      setActiveInterest(validForTier[0] || "space");
    }
  }, [interests, tier]);
  useEffect(()=> ()=> clearTimeout(timerRef.current), []);

  const words = useMemo(()=> text.trim().length ? text.trim().split(/\s+/).length : 0, [text]);
  const readingBankEntry = backendLive ? readingPassage : READING_BANK[tier][readingPassageIdx];
  const readingQuestions = readingBankEntry ? readingBankEntry.questions : [];
  const allAnswered = readingQuestions.length > 0 && readingQuestions.every((_,i)=> answers[i] != null);

  async function handleSubmit(){
    if (locked || phase === "analyzing") return;
    setSubmitError(null);
    setPhase("analyzing");

    if (!backendLive) {
      // Demo mode: no account connected, so this simulates the flow with scripted content.
      timerRef.current = setTimeout(()=>{
        if (exerciseType === "reading") {
          const score = readingQuestions.reduce((n,q,i)=> n + (answers[i] === q.correct ? 1 : 0), 0);
          setReadingScore(score);
        }
        setPhase("done");
        onSubmit();
      }, 2000);
      return;
    }

    try {
      const payload = exerciseType === "writing"
        ? { kind: "writing", confidenceWriting, motivation, submissionId: writingPrompt.submissionId, text }
        : { kind: "reading", confidenceReading, motivation, submissionId: readingBankEntry.submissionId, answers: readingQuestions.map((_,i)=> answers[i] ?? null) };
      const result = await authedFetch(session, "/api/submit", { method: "POST", body: JSON.stringify(payload) });
      setBackendFeedback(result.feedback);
      setSubmissionId(result.submissionId);
      // This tier's pending generation is now used up (resubmitting it would
      // 409) - drop it from the cache so tabbing back to this tier later
      // fetches a genuinely new one instead of reusing the completed one.
      if (exerciseType === "writing") delete pendingWritingRef.current[cacheKey];
      else delete pendingReadingRef.current[cacheKey];
      if (exerciseType === "reading") {
        setReadingScore(result.score);
        // The answer key was withheld when the passage was generated so it
        // never sat in a network response before grading — now that grading
        // is done, merge it back in so the UI can highlight right/wrong.
        setReadingPassage(prev => prev ? { ...prev, questions: result.questions } : prev);
      }
      setPhase("done");
      onSubmit(result.usage);
    } catch (err) {
      setSubmitError(err.payload?.error || err.message || "Something went wrong generating feedback. Please try again.");
      setPhase("draft");
    }
  }
  function handleNew(){
    setText("");
    setAnswers({});
    setPhase("draft");
    setBackendFeedback(null);
    setSubmissionId(null);
    if (exerciseType === "reading") requestNewPassage(true);
    else if (backendLive) requestNewWritingPrompt(true);
  }

  const tierIcon = TIER_META[tier].icon;

  return (
    <div className="mx-auto max-w-6xl px-4 sm:px-6 py-8">
      {backendLive && children_ && children_.length > 1 && (
        <ChildSwitcher children_={children_} activeChildId={childId} onSwitchChild={onSwitchChild} showAdd={false} />
      )}
      <div className="flex items-center justify-between flex-wrap gap-3 mb-4">
        <div>
          <h2 className="font-display font-bold text-2xl" style={{ color: "var(--ink)" }}>Student Workspace</h2>
          <p className="text-sm mt-0.5" style={{ color: "var(--ink-soft)" }}>{country} · {gradeLabel}</p>
        </div>
        <div className="flex items-center gap-1.5 rounded-full border p-1" style={{ borderColor: "var(--border)", background: "var(--surface-2)" }}>
          {TIER_KEYS.map(k=>{
            const TIcon = TIER_META[k].icon;
            return (
              <button key={k} onClick={()=>{ setTierOverride(k); }}
                className="focus-ring flex items-center gap-1.5 rounded-full px-3 py-1.5 text-xs font-semibold transition-colors"
                style={ tier===k ? { background: "var(--ink)", color: "white" } : { color: "var(--ink-soft)" } }
                title={TIER_META[k].ageRange}>
                <TIcon size={13} strokeWidth={2.2} />{TIER_META[k].label}
              </button>
            );
          })}
        </div>
      </div>

      <div className="flex items-center gap-1.5 rounded-full border p-1 w-fit mb-6" style={{ borderColor: "var(--border)", background: "var(--surface-2)" }}>
        {[["writing","Writing",IconPen],["reading","Reading Comprehension",IconBookOpenCheck]].map(([key,label,IconEl])=>(
          <button key={key} onClick={()=>setExerciseType(key)}
            className="focus-ring flex items-center gap-1.5 rounded-full px-3.5 py-1.5 text-xs font-semibold transition-colors"
            style={ exerciseType===key ? { background: "var(--cyan)", color: "#fff" } : { color: "var(--ink-soft)" } }>
            <IconEl size={13} strokeWidth={2.2} />{label}
          </button>
        ))}
      </div>

      <div className="grid lg:grid-cols-5 gap-6">
        <div className="lg:col-span-3 flex flex-col gap-4">
          {(exerciseType === "writing" && backendLive && (writingLoading || !meta)) ? (
            <div className="card p-10 flex flex-col items-center justify-center text-center gap-3 min-h-[300px]">
              {locked ? (
                <>
                  <IconLock size={22} style={{ color: "var(--ink-faint)" }} />
                  <div className="font-display font-semibold text-sm" style={{ color: "var(--ink)" }}>Upgrade to Pro for more writing prompts</div>
                  <p className="text-[13px] max-w-[28ch]" style={{ color: "var(--ink-faint)" }}>You've used all your free submissions this month.</p>
                </>
              ) : writingLoading ? (
                <>
                  <IconSparkle size={24} className="animate-spin-slow" style={{ color: "var(--cyan-ink)" }} />
                  <div className="font-display font-semibold text-sm" style={{ color: "var(--ink)" }}>Writing you a fresh prompt…</div>
                </>
              ) : (
                <>
                  <IconSparkle size={22} style={{ color: "var(--cyan-ink)" }} />
                  <div className="font-display font-semibold text-sm" style={{ color: "var(--ink)" }}>Ready for a {TIER_META[tier].label.toLowerCase()} prompt?</div>
                  <p className="text-[13px] max-w-[30ch]" style={{ color: "var(--ink-faint)" }}>This uses 1 of your {total === 999 ? "" : `${total - used} remaining `}submissions.</p>
                  <button onClick={()=>requestNewWritingPrompt()}
                    className="focus-ring inline-flex items-center gap-1.5 rounded-full px-4 py-2 text-sm font-bold mt-1"
                    style={{ background: "var(--cyan)", color: "#fff" }}>
                    Get my prompt
                  </button>
                </>
              )}
            </div>
          ) : exerciseType === "writing" ? (
            <TierEditor
              tier={tier} meta={meta} text={text} setText={setText} words={words}
              phase={phase} onSubmit={handleSubmit} onNew={handleNew} locked={locked}
              interests={interests} activeInterest={activeInterest} setActiveInterest={setActiveInterest}
            />
          ) : (backendLive && (readingLoading || !readingBankEntry)) ? (
            <div className="card p-10 flex flex-col items-center justify-center text-center gap-3 min-h-[300px]">
              {locked ? (
                <>
                  <IconLock size={22} style={{ color: "var(--ink-faint)" }} />
                  <div className="font-display font-semibold text-sm" style={{ color: "var(--ink)" }}>Upgrade to Pro for more reading passages</div>
                  <p className="text-[13px] max-w-[28ch]" style={{ color: "var(--ink-faint)" }}>You've used all your free submissions this month.</p>
                </>
              ) : readingLoading ? (
                <>
                  <IconSparkle size={24} className="animate-spin-slow" style={{ color: "var(--cyan-ink)" }} />
                  <div className="font-display font-semibold text-sm" style={{ color: "var(--ink)" }}>Writing you a fresh passage…</div>
                </>
              ) : (
                <>
                  <IconSparkle size={22} style={{ color: "var(--cyan-ink)" }} />
                  <div className="font-display font-semibold text-sm" style={{ color: "var(--ink)" }}>Ready for a {TIER_META[tier].label.toLowerCase()} passage?</div>
                  <p className="text-[13px] max-w-[30ch]" style={{ color: "var(--ink-faint)" }}>This uses 1 of your {total === 999 ? "" : `${total - used} remaining `}submissions.</p>
                  <button onClick={()=>requestNewPassage()}
                    className="focus-ring inline-flex items-center gap-1.5 rounded-full px-4 py-2 text-sm font-bold mt-1"
                    style={{ background: "var(--cyan)", color: "#fff" }}>
                    Get my passage
                  </button>
                </>
              )}
            </div>
          ) : (
            <ReadingExercise
              bank={readingBankEntry} answers={answers} setAnswers={setAnswers} allAnswered={allAnswered}
              phase={phase} onSubmit={handleSubmit} onNew={handleNew} locked={locked}
            />
          )}
        </div>

        <div className="lg:col-span-2 flex flex-col gap-4">
          <div className="card p-4 flex items-center gap-2">
            <div className="w-8 h-8 rounded-lg grid place-items-center shrink-0" style={{ background: "var(--navy-tint)", color: "var(--ink)" }}>
              {React.createElement(tierIcon, { size: 15, strokeWidth: 2.2 })}
            </div>
            <div className="text-[13px]" style={{ color: "var(--ink-soft)" }}><span className="font-semibold" style={{ color: "var(--ink)" }}>{TIER_META[tier].label}:</span> {TIER_META[tier].blurb}</div>
          </div>

          {phase !== "done" && (
            <div className="card p-6 flex flex-col items-center justify-center text-center gap-3 min-h-[220px]" style={{ borderStyle: submitError ? "solid" : "dashed", borderColor: submitError ? "var(--bad)" : undefined }}>
              <div className="w-11 h-11 rounded-full grid place-items-center" style={{ background: submitError ? "var(--bad-tint)" : "var(--cyan-tint)", color: submitError ? "var(--bad)" : "var(--cyan-ink)" }}>
                {submitError ? <IconAlert size={20} strokeWidth={2} /> : <IconSparkle size={20} strokeWidth={2} />}
              </div>
              <div className="font-display font-semibold text-sm" style={{ color: "var(--ink)" }}>{submitError ? "Couldn't generate feedback" : "Key Takeaways will appear here"}</div>
              <p className="text-[13px] max-w-[28ch]" style={{ color: "var(--ink-faint)" }}>
                {submitError || `${exerciseType === "writing" ? `Submit your ${tier === "high" ? "essay" : "story"}` : "Check your understanding"} to see personalised feedback from LiteracyLab AI.`}
              </p>
            </div>
          )}
          {phase === "done" && exerciseType === "writing" && (
            <FeedbackPanel tier={tier} gradeLabel={gradeLabel} country={country} interest={activeInterest} confidence={confidenceWriting} motivation={motivation} seed={words}
              feedback={backendFeedback} submissionId={submissionId} session={session} backendLive={backendLive} submittedText={text} />
          )}
          {phase === "done" && exerciseType === "reading" && (
            <ReadingFeedbackPanel tier={tier} country={country} interest={activeInterest} confidence={confidenceReading} motivation={motivation} score={readingScore} totalQ={readingQuestions.length}
              feedback={backendFeedback} submissionId={submissionId} session={session} backendLive={backendLive} />
          )}
        </div>
      </div>

      {!bannerDismissed && (
        <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-40 w-[calc(100%-2rem)] max-w-md">
          <div className="card px-4 py-3 flex items-center gap-3 animate-float-in" style={{ borderColor: locked ? "var(--bad)" : "var(--gold)", borderWidth: 1.5 }}>
            <div className="w-8 h-8 rounded-full grid place-items-center shrink-0" style={{ background: "var(--gold-tint)", color: "var(--gold-ink)" }}>
              <IconFlame size={15} strokeWidth={2.2} />
            </div>
            <div className="flex-1 min-w-0">
              {/* total is the 999 sentinel for Pro/admin (see App's usage.cap
                  handling) - a Pro account was seeing "1 of 999 Free Monthly
                  Submissions Used", leaking that internal number and mislabeling
                  a paid plan as free. */}
              <div className="text-[13px] font-semibold" style={{ color: "var(--ink)" }}>{total >= 999 ? "Pro Plan: unlimited submissions" : `${used} of ${total} Free Monthly Submissions Used`}</div>
              <div className="text-[11px]" style={{ color: "var(--ink-faint)" }}>{total >= 999 ? "Thanks for being a Pro subscriber." : locked ? "Upgrade to Pro for unlimited submissions." : "Resets automatically at the start of next month."}</div>
            </div>
            <button onClick={()=>setBannerDismissed(true)} className="focus-ring w-7 h-7 rounded-full grid place-items-center shrink-0" style={{ color: "var(--ink-faint)" }} aria-label="Dismiss">
              <IconX size={14} />
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function AnalyzingOverlay(){
  return (
    <div className="absolute inset-0 z-10 grid place-items-center rounded-[20px]" style={{ background: "color-mix(in srgb, var(--surface) 88%, transparent)", backdropFilter: "blur(2px)" }}>
      <div className="flex flex-col items-center gap-4 px-6 text-center">
        <div className="relative w-14 h-14 rounded-full grid place-items-center analyzing-pulse" style={{ background: "var(--cyan-tint)" }}>
          <IconSparkle size={24} strokeWidth={2} className="animate-spin-slow" style={{ color: "var(--cyan-ink)" }} />
        </div>
        <div className="font-display font-semibold text-sm" style={{ color: "var(--ink)" }}>LiteracyLab AI is analyzing curriculum benchmarks…</div>
        <div className="text-xs" style={{ color: "var(--ink-faint)" }}>Checking grammar, structure and vocabulary against your targets</div>
      </div>

}

function WordMeter({ words, target, chars, maxChars }){
  const pct = Math.min(100, Math.round((words/target)*100));
  const charPct = maxChars ? chars / maxChars : 0;
  const nearCap = charPct >= 0.9;
  return (
    <div className="flex flex-col gap-1">
      <div className="flex items-center gap-2.5">
        <div className="h-1.5 w-24 rounded-full" style={{ background: "var(--surface-2)" }}>
          <div className="h-1.5 rounded-full transition-all" style={{ width: pct + "%", background: pct >= 100 ? "var(--good)" : "var(--cyan)" }} />
        </div>
        <span className="text-xs font-semibold tabular whitespace-nowrap" style={{ color: "var(--ink-soft)" }}>{words} / {target} words</span>
      </div>
      {maxChars != null && (
        <span className="text-[11px] tabular" style={{ color: nearCap ? "var(--bad)" : "var(--ink-faint)" }}>
          {chars.toLocaleString()} / {maxChars.toLocaleString()} characters{nearCap ? " — approaching limit" : ""}
        </span>
      )}
    </div>
  );
}

function ReadingExercise({ bank, answers, setAnswers, allAnswered, phase, onSubmit, onNew, locked }){

      {phase === "analyzing" && <AnalyzingOverlay />}

        {bank.questions.map((q,qi)=>(
          <div key={qi}>
            <div className="text-sm font-semibold mb-2" style={{ color: "var(--ink)" }}>{qi+1}. {q.q}</div>
            <div className="flex flex-col gap-1.5">
              {q.options.map((opt,oi)=>{

                return (
                  <button key={oi} disabled={disabled || phase === "done"}

/* App                                                                */
/* ---------------------------------------------------------------- */
// Fallback used only in demo mode (no backend) — mirrors what the single
// hardcoded default child used to be, so demo mode's behavior is unchanged.
const DEMO_CHILD = { id: "demo", display_name: "My Learner", country: "🇬🇧 United Kingdom", grade_idx: 5, interests: ["space","gaming"], confidence_writing: "growing", confidence_reading: "growing", motivation: "enjoyment", onboarded: true, avatar_id: 0 };

function App({ session }){
  const backendLive = BACKEND_CONFIGURED && !!session;

  const [theme, setTheme] = useState("system");
  const [view, setView] = useState("workspace");
  const [tierOverride, setTierOverride] = useState(null);
  const [used, setUsed] = useState(1);
  const [total, setTotal] = useState(FREE_MONTHLY_CAP);
  const [plan, setPlan] = useState("free");
  const [profileLoaded, setProfileLoaded] = useState(!backendLive);
  const [history, setHistory] = useState(null);
  const [progress, setProgress] = useState(null);
  const [peerStats, setPeerStats] = useState(null);
  // A household can have more than one learner (see api/child-profile.js) -
  // `children` is every learner on this account, `activeChildId` is whichever
  // one is currently shown. Everything that used to be single "profile"
  // state (country, gradeIdx, interests, etc.) is now derived from whichever
  // child is active, rather than its own state, so there's one source of
  // truth and switching children can't leave stale fields behind.
  const [children, setChildren] = useState([]);
  const [activeChildId, setActiveChildId] = useState(null);
  const activeChild = backendLive ? (children.find(c => c.id === activeChildId) || null) : DEMO_CHILD;
  const country = activeChild?.country || "🇬🇧 United Kingdom";
  // gradeIdxOverride exists only so clicking a tier tab (setTierAndSyncGrade
  // below) can preview a different age tier's content without permanently
  // changing the child's real stored grade - a local-only override, distinct
  // from tierOverride's own child in that it never gets persisted.
  const [gradeIdxOverride, setGradeIdxOverride] = useState(null);
  const gradeIdx = gradeIdxOverride ?? (activeChild?.grade_idx ?? 5);
  const interests = activeChild?.interests || [];
  const confidenceWriting = activeChild?.confidence_writing || "growing";
  const confidenceReading = activeChild?.confidence_reading || "growing";
  const motivation = activeChild?.motivation || "enjoyment";
  const avatarId = activeChild?.avatar_id ?? 0;
  const needsOnboarding = backendLive && activeChild ? !activeChild.onboarded : false;

  useEffect(()=>{
    const root = document.documentElement;
    if (theme === "system") root.removeAttribute("data-theme");
    else root.setAttribute("data-theme", theme);
  }, [theme]);

  function rememberActiveChild(id){
    try { localStorage.setItem("ll_active_child_" + session.user.id, id); } catch {}
  }
  function switchChild(id){
    setActiveChildId(id);
    setTierOverride(null);
    setGradeIdxOverride(null);
    rememberActiveChild(id);
  }

  // On login: pull every learner on this account and the account-wide usage
  // numbers (the free/Pro cap is shared across a household's children, not
  // per-child - it's billed per account) instead of the local defaults.
  useEffect(()=>{
    if (!backendLive) { setProfileLoaded(true); return; }
    (async ()=>{
      try {
        const [{ profiles }, usage] = await Promise.all([
          authedFetch(session, "/api/child-profile"),
          authedFetch(session, "/api/usage"),
        ]);
        setChildren(profiles);
        let remembered = null;
        try { remembered = localStorage.getItem("ll_active_child_" + session.user.id); } catch {}
        const initial = profiles.find(p => p.id === remembered) || profiles[0];
        setActiveChildId(initial.id);
        setUsed(usage.used);
        setTotal(usage.cap == null ? 999 : usage.cap);
        setPlan(usage.plan || "free");
        if (!initial.onboarded) setView("dashboard");
      } catch (err) {
        logAppError("Failed to load learner profile:", err);
      } finally {
        setProfileLoaded(true);
      }
    })();
  }, [backendLive]);

  useEffect(()=>{
    if (!backendLive || view !== "dashboard" || !activeChildId) return;
    authedFetch(session, `/api/history?childId=${activeChildId}`).then(setHistory).catch((err)=> logAppError("Failed to load history:", err));
  }, [backendLive, view, used, activeChildId]);

  // Fire-and-forget persistence — the UI doesn't wait on this, it just keeps
  // the server's copy of the active child's setup in sync with what's shown
  // locally (updated optimistically here, before the request even resolves).
  function persistProfile(patch){
    if (!backendLive || !activeChildId) return;
    setChildren(prev => prev.map(c => c.id === activeChildId ? { ...c, ...patch } : c));
    authedFetch(session, "/api/child-profile", { method: "POST", body: JSON.stringify({ childId: activeChildId, ...patch }) })
      .catch((err)=> logAppError("Failed to save learner setup:", err));
  }

  async function addChild(){
    if (!backendLive) return;
    try {
      const { profile } = await authedFetch(session, "/api/child-profile", { method: "POST", body: JSON.stringify({}) });
      setChildren(prev => [...prev, profile]);
      switchChild(profile.id);
      setView("dashboard"); // the new learner needs onboarding
    } catch (err) {
      logAppError("Failed to add a learner:", err);
    }
  }
  async function removeChild(id){
    if (!backendLive) return;
    try {
      await authedFetch(session, "/api/child-profile", { method: "DELETE", body: JSON.stringify({ childId: id }) });
      const next = children.filter(c => c.id !== id);
      setChildren(next);
      if (activeChildId === id && next.length) switchChild(next[0].id);
    } catch (err) {
      logAppError("Failed to remove learner:", err);
    }
  }

  const naturalTier = tierForGrade(country, gradeIdx);
  const tier = tierOverride || naturalTier;
  const gradeLabel = GRADE_DATA[country].grades[gradeIdx];

  useEffect(()=>{
    if (!backendLive || view !== "dashboard" || !activeChildId) return;
    authedFetch(session, `/api/progress?tier=${tier}&country=${encodeURIComponent(country)}&gradeLabel=${encodeURIComponent(gradeLabel)}&childId=${activeChildId}`)
      .then(setProgress)
      .catch((err)=> logAppError("Failed to load mastery progress:", err));
  }, [backendLive, view, tier, country, gradeLabel, used, activeChildId]);

  useEffect(()=>{
    if (!backendLive || view !== "dashboard" || !activeChildId) return;
    setPeerStats(null); // avoid flashing the previous child/grade's numbers while this one loads
    authedFetch(session, `/api/cohort-stats?tier=${tier}&country=${encodeURIComponent(country)}&gradeLabel=${encodeURIComponent(gradeLabel)}&childId=${activeChildId}`)
      .then(setPeerStats)
      .catch((err)=> logAppError("Failed to load peer comparison:", err));
  }, [backendLive, view, tier, country, gradeLabel, used, activeChildId]);

  function setTierAndSyncGrade(k){
    setTierOverride(k);
    setGradeIdxOverride(defaultGradeIndexForTier(country, k)); // preview only - never persisted
  }
  function handleCountryChange(c){
    setGradeIdxOverride(null);
    persistProfile({ country: c, grade_idx: defaultGradeIndexForTier(c, tier) });
  }
  function handleGradeChange(idx){
    setTierOverride(null);
    setGradeIdxOverride(null);
    persistProfile({ grade_idx: idx });
  }
  function toggleInterest(id){
    const next = interests.includes(id) ? interests.filter(x=>x!==id) : [...interests, id];
    persistProfile({ interests: next });
  }
  function handleSetConfidenceWriting(v){ persistProfile({ confidence_writing: v }); }
  function handleSetConfidenceReading(v){ persistProfile({ confidence_reading: v }); }
  function handleSetMotivation(v){ persistProfile({ motivation: v }); }
  function handleSetDisplayName(v){ persistProfile({ display_name: v }); }
  function handleSetAvatar(id){ persistProfile({ avatar_id: id }); }
  function completeOnboarding(){
    persistProfile({ onboarded: true });
    setView("workspace");
  }
  // Blocks jumping to the workspace via the header nav switcher until setup is done —
  // the "Start Writing" button on the dashboard is the only way past this.
  function guardedSetView(v){
    if (needsOnboarding && v === "workspace") return;
    setView(v);
  }

  function handleSubmit(usageFromServer){
    if (backendLive && usageFromServer) {
      setUsed(usageFromServer.used);
      setTotal(usageFromServer.cap == null ? 999 : usageFromServer.cap);
      if (usageFromServer.plan) setPlan(usageFromServer.plan);
    } else {
      setUsed(u => Math.min(total, u+1));
    }
  }
  // After a Stripe Checkout redirect back with ?upgraded=1, refresh usage
  // once so the new Pro plan shows immediately instead of waiting for the
  // next submission — the actual plan flip already happened server-side
  // via the Stripe webhook by the time the browser gets here.
  useEffect(()=>{
    if (!backendLive) return;
    if (!new URLSearchParams(window.location.search).has("upgraded")) return;
    authedFetch(session, "/api/usage").then((usage)=>{
      setUsed(usage.used);
      setTotal(usage.cap == null ? 999 : usage.cap);
      setPlan(usage.plan || "free");
    }).catch((err)=> logAppError("Failed to refresh usage after upgrade:", err));
    window.history.replaceState(null, "", window.location.pathname);
  }, [backendLive]);
  async function handleSignOut(){
    if (supabaseClient) await supabaseClient.auth.signOut();
  }

  if (!profileLoaded) {
    return <div className="min-h-screen grid place-items-center" style={{ background: "var(--bg)" }}><IconSparkle size={24} className="animate-spin-slow" style={{ color: "var(--cyan-ink)" }} /></div>;
  }

  return (
    <div className="min-h-screen">
      <Header view={view} setView={guardedSetView} used={used} total={total} plan={plan} theme={theme === "system" ? "light" : theme} setTheme={setTheme}
        backendLive={backendLive} onSignOut={handleSignOut} needsOnboarding={needsOnboarding} />
      <div className="md:hidden mx-auto max-w-6xl px-4 pt-3 flex flex-col gap-2">
        <div className="rounded-xl border px-3 py-2 text-xs font-medium flex items-center justify-between" style={{ borderColor: "var(--border)", background: "var(--surface-2)", color: "var(--ink-soft)" }}>
          <span>{(plan === "pro" || plan === "admin") ? "Pro Plan: unlimited submissions" : <>Free Plan: <b className="tabular" style={{ color: "var(--ink)" }}>{total-used}</b> of {total} remaining</>}</span>
          <span className="rounded-full px-2 py-0.5 text-[10px] font-bold" style={{ background: (plan === "pro" || plan === "admin") ? "var(--gold-tint)" : "var(--navy-tint)", color: (plan === "pro" || plan === "admin") ? "var(--gold-ink)" : "var(--ink)" }}>{(plan === "pro" || plan === "admin") ? "PRO" : "FREE"}</span>
        </div>
        {/* Mobile equivalent of the header's Upgrade/Sign out buttons, which
            are hidden below md - see the note in Header for why this exists. */}
        <div className="flex items-center gap-2">
          <button onClick={()=>setView("dashboard")}
            className="focus-ring flex-1 inline-flex items-center justify-center gap-1.5 rounded-full px-3.5 py-2 text-[13px] font-bold"
            style={{ background: "var(--gold)", color: "#fff" }}>
            <IconCrown size={13} strokeWidth={2.4} /> {(plan === "pro" || plan === "admin") ? "Manage Pro" : "Upgrade to Pro"}
          </button>
          {backendLive && (
            <button onClick={handleSignOut} className="focus-ring inline-flex items-center rounded-full px-3 py-2 text-[13px] font-semibold" style={{ color: "var(--ink-faint)" }}>
              Sign out
            </button>
          )}
        </div>
      </div>
      {view === "dashboard" ? (
        <Dashboard country={country} setCountry={handleCountryChange} gradeIdx={gradeIdx} setGradeIdx={handleGradeChange}
          tier={tier} interests={interests} toggleInterest={toggleInterest}
          confidenceWriting={confidenceWriting} setConfidenceWriting={handleSetConfidenceWriting}
          confidenceReading={confidenceReading} setConfidenceReading={handleSetConfidenceReading}
          motivation={motivation} setMotivation={handleSetMotivation}
          displayName={activeChild?.display_name || ""} setDisplayName={handleSetDisplayName}
          avatarId={avatarId} setAvatarId={handleSetAvatar}
          children_={children} activeChildId={activeChildId} onSwitchChild={switchChild} onAddChild={addChild} onRemoveChild={removeChild}
          used={used} total={total} plan={plan} session={session} setView={setView} history={history} progress={progress} peerStats={peerStats} backendLive={backendLive}
          needsOnboarding={needsOnboarding} onCompleteOnboarding={completeOnboarding} />
      ) : (
        <Workspace country={country} gradeIdx={gradeIdx} setGradeIdx={handleGradeChange} tier={tier} setTierOverride={setTierAndSyncGrade}
          interests={interests} confidenceWriting={confidenceWriting} confidenceReading={confidenceReading} motivation={motivation}
          used={used} total={total} onSubmit={handleSubmit} session={session} backendLive={backendLive}
          childId={activeChildId} children_={children} onSwitchChild={switchChild} />
      )}
      <footer className="mx-auto max-w-6xl px-4 sm:px-6 py-10 text-center text-xs flex flex-col items-center gap-2" style={{ color: "var(--ink-faint)" }}>
        <div>LiteracyLab AI · {backendLive ? "your account data is private to you" : "interactive prototype — all learner data shown is sample data"}.</div>
        <div className="flex items-center gap-4">
          <a href="index.html" className="hover:underline" style={{ color: "var(--ink-faint)" }}>Home</a>
          <a href="privacy.html" className="hover:underline" style={{ color: "var(--ink-faint)" }}>Privacy</a>
          <a href="terms.html" className="hover:underline" style={{ color: "var(--ink-faint)" }}>Terms</a>
        </div>
      </footer>
    </div>
  );
}

/* ---------------------------------------------------------------- */
/* Auth                                                                */
/* ---------------------------------------------------------------- */
function AuthScreen(){
  const [mode, setMode] = useState("signup"); // signup | login
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [status, setStatus] = useState("idle"); // idle | loading | check-email | error
  const [errorMsg, setErrorMsg] = useState("");

  async function handleSubmit(e){
    e.preventDefault();
    setStatus("loading");
    setErrorMsg("");
    try {
      if (mode === "signup") {
        const { error } = await supabaseClient.auth.signUp({ email, password });
        if (error) throw error;
        setStatus("check-email");
      } else {
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;
        // onAuthStateChange in AuthGate picks up the new session automatically.
      }
    } catch (err) {
      setStatus("error");
      setErrorMsg(err.message || "Something went wrong.");
    }
  }

  return (
    <div className="min-h-screen flex items-center justify-center px-4" style={{ background: "var(--bg)" }}>
      <div className="w-full max-w-sm">
        <div className="flex items-center gap-2.5 justify-center mb-6">
          <IconMark size={30} />
          <span className="font-display font-bold text-lg" style={{ color: "var(--ink)" }}>LiteracyLab <span style={{ color: "var(--cyan-ink)" }}>AI</span></span>
        </div>
        <div className="card p-6">
          {status === "check-email" ? (
            <div className="text-center py-4">
              <div className="w-11 h-11 rounded-full grid place-items-center mx-auto mb-3" style={{ background: "var(--good-tint)", color: "var(--good)" }}>
                <IconCheck size={20} strokeWidth={2.4} />
              </div>
              <h2 className="font-display font-bold mb-1.5" style={{ color: "var(--ink)" }}>Check your email</h2>
              <p className="text-sm" style={{ color: "var(--ink-soft)" }}>We sent a confirmation link to <strong>{email}</strong>. Click it, then come back and log in.</p>
              <button onClick={()=>{ setStatus("idle"); setMode("login"); }} className="focus-ring mt-4 text-sm font-semibold" style={{ color: "var(--cyan-ink)" }}>Back to log in</button>
            </div>
          ) : (
            <>
              <h2 className="font-display font-bold text-lg mb-1" style={{ color: "var(--ink)" }}>{mode === "signup" ? "Create your account" : "Welcome back"}</h2>
              <p className="text-sm mb-5" style={{ color: "var(--ink-soft)" }}>{mode === "signup" ? "One account per household — set up your learner after signing up." : "Log in to see your learner's dashboard."}</p>
              <form onSubmit={handleSubmit} className="flex flex-col gap-3">
                <label className="flex flex-col gap-1.5">
                  <span className="text-xs font-semibold" style={{ color: "var(--ink-soft)" }}>Email</span>
                  <input type="email" required value={email} onChange={(e)=>setEmail(e.target.value)}
                    className="focus-ring w-full rounded-xl border px-3.5 py-2.5 text-sm" style={{ borderColor: "var(--border)", background: "var(--surface)", color: "var(--ink)" }} placeholder="parent@email.com" />
                </label>
                <label className="flex flex-col gap-1.5">
                  <span className="text-xs font-semibold" style={{ color: "var(--ink-soft)" }}>Password</span>
                  <input type="password" required minLength={8} value={password} onChange={(e)=>setPassword(e.target.value)}
                    className="focus-ring w-full rounded-xl border px-3.5 py-2.5 text-sm" style={{ borderColor: "var(--border)", background: "var(--surface)", color: "var(--ink)" }} placeholder="At least 8 characters" />
                </label>
                {status === "error" && (
                  <div className="text-[13px] rounded-lg px-3 py-2" style={{ background: "var(--bad-tint)", color: "var(--bad)" }}>{errorMsg}</div>
                )}
                <button type="submit" disabled={status === "loading"}
                  className="focus-ring w-full rounded-xl py-2.5 font-display font-bold text-sm disabled:opacity-60"
                  style={{ background: "var(--cyan)", color: "#fff" }}>
                  {status === "loading" ? "Please wait…" : mode === "signup" ? "Create account" : "Log in"}
                </button>
              </form>
              <button onClick={()=>setMode(mode === "signup" ? "login" : "signup")} className="focus-ring w-full text-center text-sm font-semibold mt-4" style={{ color: "var(--cyan-ink)" }}>
                {mode === "signup" ? "Already have an account? Log in" : "New here? Create an account"}
              </button>
            </>
          )}
        </div>
        <p className="text-center text-xs mt-4" style={{ color: "var(--ink-faint)" }}>By continuing you agree to our <a href="terms.html" className="underline">Terms</a> and <a href="privacy.html" className="underline">Privacy Policy</a>.</p>
      </div>
    </div>
  );
}

function AuthGate(){
  const [session, setSession] = useState(undefined); // undefined = loading, null = signed out

  useEffect(()=>{
    if (!BACKEND_CONFIGURED) return;
    supabaseClient.auth.getSession().then(({ data })=> setSession(data.session));
    const { data: sub } = supabaseClient.auth.onAuthStateChange((_event, newSession)=> setSession(newSession));
    return ()=> sub.subscription.unsubscribe();
  }, []);

  if (!BACKEND_CONFIGURED) {
    return <App session={null} />;
  }
  if (session === undefined) {
    return <div className="min-h-screen grid place-items-center" style={{ background: "var(--bg)" }}><IconSparkle size={24} className="animate-spin-slow" style={{ color: "var(--cyan-ink)" }} /></div>;
  }
  if (session === null) {
    return <AuthScreen />;
  }
  return <App session={session} />;
}

// Catches render crashes that would otherwise leave a blank white page (the
// same failure shape as an earlier real incident this app had, though that
// one turned out to be a browser extension, not a render error) — reports
// to Sentry and shows a plain-language fallback with a reload button
// instead of silence.
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { hasError: false }; }
  static getDerivedStateFromError() { return { hasError: true }; }
  componentDidCatch(err, info) { logAppError("Unhandled render error:", err, { componentStack: info?.componentStack }); }
  render() {
    if (!this.state.hasError) return this.props.children;
    return (
      <div className="min-h-screen grid place-items-center px-4" style={{ background: "var(--bg)" }}>
        <div className="text-center max-w-sm">
          <div className="font-display font-bold text-lg mb-2" style={{ color: "var(--ink)" }}>Something went wrong</div>
          <p className="text-sm mb-4" style={{ color: "var(--ink-soft)" }}>We've been notified. Reloading the page usually fixes this.</p>
          <button onClick={()=>window.location.reload()} className="focus-ring rounded-full px-4 py-2 text-sm font-bold" style={{ background: "var(--cyan)", color: "#fff" }}>Reload</button>
        </div>
      </div>
    );
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><AuthGate /></ErrorBoundary>);
</script>
